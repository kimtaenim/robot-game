<title>로봇 SI 납품소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 주문 카드(그림) → 작업대(머지 보드, 안전 줄무늬) → 스토리지 선반. 글자 대신 그림으로 읽는 작업장 */
:root {
  --bg: #E7ECEF;
  --surface: #FFFFFF;
  --surface-2: #F2F5F7;
  --ink: #13202A;
  --muted: #586977;
  --line: #CBD5DC;
  --accent: #F0B400;
  --steel: #1C5A86;
  --steel-soft: #DCE8F1;
  --good: #24804D;
  --bad: #C03A2A;
  --scrim: rgba(12, 20, 27, 0.55);
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151A; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0; --muted: #91A2AF;
    --line: #2E3B47; --accent: #F5C12B; --steel: #72AEDC; --steel-soft: #1D3346; --good: #3FA86C;
    --bad: #E0594A; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151A; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0; --muted: #91A2AF;
  --line: #2E3B47; --accent: #F5C12B; --steel: #72AEDC; --steel-soft: #1D3346; --good: #3FA86C;
  --bad: #E0594A; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { box-sizing: border-box; height: 100%; max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 14px; display: flex; flex-direction: column; gap: 12px; }

/* 상단 바: 숫자만 */
.top { display: flex; align-items: center; gap: 14px; font-size: 16px; }
.top .stat { display: flex; align-items: center; gap: 4px; }
.top .stat b { font-size: 17px; }
.combo { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.combo b { font-size: 17px; min-width: 1.5em; }
.combo .meter { flex: 1; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.combo .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
.tools { display: flex; gap: 6px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; font-size: 16px; padding: 0; }

/* 주문 카드 */
.clients { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; min-height: 150px; box-sizing: border-box; }
.card.empty { border-style: dashed; background: transparent; cursor: default; }
.card .who { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; max-width: 100%; }
.card .who span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .want { margin-top: 2px; width: 100%; background: var(--steel-soft); border-radius: 10px; padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.card .want .big { font-size: 40px; line-height: 1.05; }
.card .want .nm { font-family: var(--font-display); font-size: 14px; color: var(--steel); text-align: center; line-height: 1.15; padding-inline: 4px; }
.card .recipe { font-size: 17px; letter-spacing: 1px; min-height: 22px; color: var(--muted); }
.card.target { border-color: var(--steel); box-shadow: 0 0 0 2px var(--steel); }
.card.over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.card.enter { animation: enter .35s ease-out; }
.card.shake { animation: shake .4s; }
.backlog { position: absolute; top: -8px; right: -6px; background: var(--ink); color: var(--bg); border-radius: 10px; font-size: 11px; font-weight: 700; padding: 2px 7px; }
@keyframes enter { from { transform: translateY(-14px) scale(.95); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }

/* 작업대 */
.bench { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stripe { height: 8px; background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, var(--ink) 10px 20px); }
.bench-in { padding: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cell { height: 76px; border: 2px dashed var(--line); border-radius: 12px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10.5px; font-weight: 700; touch-action: none; padding: 0 2px; line-height: 1.15; text-align: center; }
.cell.part { border-style: solid; background: var(--surface-2); }
.cell.robot { border-style: solid; border-color: var(--steel); background: var(--steel-soft); }
.cell .ic { font-size: 32px; line-height: 1; }
.cell.sel { outline: 3px solid var(--accent); outline-offset: 1px; transform: translateY(-3px); }
.cell.drop { border-color: var(--accent); }
.cell.dim { opacity: .3; }
.cell.pop { animation: pop .35s ease-out; }
.cell.nope { animation: shake .35s; }
@keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* 스토리지 */
.storage { margin-top: auto; display: flex; gap: 8px; align-items: stretch; }
.shelf { flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.stock { background: var(--surface); border: 1px solid var(--line); border-bottom-width: 4px; border-radius: 12px; padding: 7px 1px 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; touch-action: none; }
.stock .ic { font-size: 28px; line-height: 1.1; }
.stock .nm { font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.stock.robot { border-color: var(--steel); }
.stock.glow { box-shadow: 0 0 0 3px var(--accent); animation: glow 1.2s ease-in-out infinite; }
.stock.nope { animation: shake .35s; }
@keyframes glow { 50% { box-shadow: 0 0 0 1px var(--accent); } }
.trash { width: 52px; background: var(--surface-2); border: 2px dashed var(--line); border-radius: 12px; font-size: 24px; padding: 0; touch-action: none; }
.trash.drop { border-color: var(--bad); }

.ghost { position: fixed; z-index: 40; pointer-events: none; font-size: 40px; transform: translate(-50%, -65%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
.float { position: fixed; z-index: 35; pointer-events: none; font-family: var(--font-display); font-size: 24px; color: var(--good); transform: translate(-50%, 0); animation: floatUp .9s ease-out forwards; }
@keyframes floatUp { to { transform: translate(-50%, -50px); opacity: 0; } }

/* 오버레이 */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 16px; width: 100%; max-width: 520px; max-height: 86%; overflow: auto; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; user-select: text; -webkit-user-select: text; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.sheet p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
.steps { display: grid; gap: 10px; }
.step { display: flex; align-items: center; gap: 12px; font-size: 26px; }
.step span { font-size: 14px; color: var(--muted); }
.big-stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; }
.big-stats b { font-size: 24px; margin-left: 4px; }
.log { display: grid; gap: 6px; }
.log-item { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: start; border-bottom: 1px solid var(--line); padding: 7px 0; font-size: 13px; line-height: 1.5; }
.log-item .i { font-size: 24px; grid-row: span 2; }
.log-item .h { font-weight: 700; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.log-item .h small { color: var(--steel); font-size: 11px; }
.log-item.locked { color: var(--muted); }
.primary { align-self: flex-start; background: var(--accent); color: #1A1400; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  .card.enter, .card.shake, .cell.pop, .cell.nope, .stock.nope, .stock.glow, .float { animation: none; }
}
</style>

<div class="app">
  <header class="top">
    <span class="stat" aria-label="남은 시간">⏱<b class="num" id="clock">3:00</b></span>
    <span class="stat" aria-label="점수">⭐<b class="num" id="score">0</b></span>
    <span class="combo" aria-label="콤보">🔥<b class="num" id="combo">0</b><span class="meter"><i id="flowBar"></i></span></span>
    <span class="tools">
      <button class="tool" id="btnDex" type="button" aria-label="현장 도감">📖</button>
      <button class="tool" id="btnPause" type="button" aria-label="일시정지">⏸</button>
    </span>
  </header>

  <section class="clients" id="clients" aria-label="주문"></section>

  <section class="bench" aria-label="작업대">
    <div class="stripe"></div>
    <div class="bench-in" id="board"></div>
  </section>

  <section class="storage" aria-label="스토리지">
    <div class="shelf" id="shelf"></div>
    <button class="trash" id="btnTrash" type="button" data-trash="1" aria-label="버리기">🗑</button>
  </section>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>

<script>
// ───────── 그래픽 9종: 부품 3 + 완제품 3 + 조립 로봇 3. 아이콘은 임시 이모지 ─────────
const ITEMS = {
  wheel: { kind: 'part',  icon: '🛞', name: '바퀴' },
  lidar: { kind: 'part',  icon: '👁️', name: '라이다' },
  tape:  { kind: 'part',  icon: '🧲', name: '마그넷' },
  cobot: { kind: 'robot', icon: '🦾', name: '협동로봇' },
  quad:  { kind: 'robot', icon: '🐕', name: '4족보행' },
  hum:   { kind: 'robot', icon: '🚶', name: '휴머노이드' },
  amr:   { kind: 'robot', icon: '🚚', name: 'AMR' },
  agv:   { kind: 'robot', icon: '🛤️', name: 'AGV' },
  mm:    { kind: 'robot', icon: '🚜', name: '모바일 매니퓰레이터' },
};
const SHELF = ['wheel', 'lidar', 'tape', 'cobot', 'quad', 'hum'];
// 자료에 나온 조합만: AMR(스스로 길 찾기) / AGV(바닥 경로) / AMR 위에 협동로봇 팔(⑧ LG엔솔)
const RECIPES = [['wheel', 'lidar', 'amr'], ['wheel', 'tape', 'agv'], ['amr', 'cobot', 'mm']];
const recipe = (a, b) => (RECIPES.find(([x, y]) => (x === a && y === b) || (x === b && y === a)) || [])[2] || null;
const recipeOf = r => RECIPES.find(x => x[2] === r);
const baseParts = r => { const x = recipeOf(r); return x ? [...baseParts(x[0]), ...baseParts(x[1])] : [r]; };

// ───────── 손님: 자료가 로봇 종류를 직접 밝힌 곳만 (로봇 스터디 2차 발제 자료, 2026.09.21) ─────────
const ORDERS = [
  { id: 'port',     want: 'agv',   icon: '⚓', who: '부산항',      sec: '⑮ 항만',        fact: '국내 첫 완전 자동화 부두에서 AGV가 시스템 지시대로 컨테이너를 옮겨요. 2018년 노조 반발 뒤 노사정 협의체를 거쳤어요.' },
  { id: 'kai',      want: 'agv',   icon: '🛩️', who: 'KAI',         sec: '⑨ 항공기 제조', fact: 'AGV로 자재를 옮기고 로봇으로 T-50 날개를 뚫어, 8시간 걸리던 작업을 40분으로 줄였어요.' },
  { id: 'stl',      want: 'amr',   icon: '📦', who: '에스티엘',    sec: '② AMR',         fact: '트위니가 오더피킹 AMR 12대를 먼저 넣어 검증한 뒤 본계약을 맺었어요.' },
  { id: 'transys',  want: 'amr',   icon: '🏭', who: '현대트랜시스', sec: '② AMR',        fact: '바닥 공사 없이 기존 공장에 바로 넣을 수 있는 300kg급 AMR이에요. AGV는 바닥 경로가 필요해요.' },
  { id: 'ford',     want: 'amr',   icon: '🔌', who: '포드',        sec: '② AMR',         fact: '티로보틱스가 미국 포드 ESS 공장에 AMR을 공급했어요. 미 FCC는 중국산 센서 장비를 막고 있어요.' },
  { id: 'ecopro',   want: 'amr',   icon: '🧪', who: '에코프로',    sec: '⑧ 배터리 공장', fact: '이차전지 소재 공장에서 AMR로 설비를 점검하고 고장을 미리 잡아요.' },
  { id: 'samsung',  want: 'amr',   icon: '💾', who: '삼성전자',    sec: '⑥ 반도체 공장', fact: '디지털 트윈 시나리오에서 AMR이 공구를 나르고 휴머노이드가 설비를 점검해요.' },
  { id: 'lg',       want: 'mm',    icon: '🔋', who: 'LG엔솔',      sec: '⑧ 배터리 공장', fact: 'AMR 위에 협동로봇 팔을 얹은 결합형이 라인을 돌며 불량 셀을 빼고 부품을 공급해요.' },
  { id: 'mipo',     want: 'cobot', icon: '🚢', who: 'HD현대미포',  sec: '④ 조선',        fact: '레인보우 협동로봇이 누적 55대예요. 용접공을 구하지 못해 일을 못 받는 현장이에요.' },
  { id: 'gwangjin', want: 'cobot', icon: '⚙️', who: '광진',        sec: '③ 제조 SI',     fact: '13억원을 들여 협동로봇을 넣으며, 값보다 A/S를 보고 국산을 골랐어요.' },
  { id: 'polytech', want: 'cobot', icon: '🎓', who: '폴리텍',      sec: '① 교육용 로봇', fact: '두산로보틱스가 실습용 협동로봇 4대를 기증했어요.' },
  { id: 'busanEdu', want: 'cobot', icon: '🍱', who: '부산교육청',  sec: '⑱ 학교 급식',   fact: '5개교에 조리로봇을 설치해요. 실증에서 근력 작업 72%, 고위험 작업시간 69%가 줄었어요.' },
  { id: 'posco',    want: 'quad',  icon: '🔥', who: '포스코',      sec: '⑦ 철강',        fact: '계단·배관이 많은 고로에서 스팟이 하루 12번 가스 누설을 점검해요.' },
  { id: 'police',   want: 'quad',  icon: '🚓', who: '경찰청',      sec: '㉖ 경찰',        fact: '사족보행 로봇 6대가 폭발물 현장에 먼저 들어가 영상을 보내요.' },
  { id: 'army',     want: 'quad',  icon: '🎖️', who: '방사청',      sec: '㉗ 국방',        fact: '대테러 다족보행로봇을 특전사·전방사단에 시범 배치했어요.' },
  { id: 'fire',     want: 'quad',  icon: '🚒', who: '소방청',      sec: '㉖ 소방',        fact: '4족보행로봇 40대에 160억원, 대당 약 4억원을 편성했어요.' },
  { id: 'hyundai',  want: 'hum',   icon: '🚙', who: '현대차',      sec: '⑤ 자동차 공장', fact: '아틀라스 2만5000대 투입 계획이에요. 노조는 "합의 없이 1대도 안 된다"고 해요.' },
  { id: 'bmw',      want: 'hum',   icon: '🇺🇸', who: 'BMW',        sec: '⑤ 자동차 공장', fact: 'Figure 02 2대가 11개월간 주 5일 10시간 교대로 일했어요.' },
  { id: 'cj',       want: 'hum',   icon: '🧴', who: 'CJ대한통운',  sec: '⑫ 물류센터',    fact: '올리브영 물류센터 포장 라인에 휴머노이드 양팔 로봇 2대가 들어갔어요.' },
  { id: 'catl',     want: 'hum',   icon: '⚡', who: 'CATL',        sec: '⑧ 배터리 공장', fact: '자사 배터리로 움직이는 휴머노이드를 생산라인에 실전 배치했어요.' },
];
const O = Object.fromEntries(ORDERS.map(o => [o.id, o]));
const BY_ROBOT = {};
ORDERS.forEach(o => (BY_ROBOT[o.want] = BY_ROBOT[o.want] || []).push(o.id));
const ROBOT_WEIGHT = { amr: 1.5, agv: 1, mm: 1, cobot: 1, quad: 1, hum: 1 };
const TUTORIAL = ['mipo', 'posco', 'stl', 'port', 'lg', 'hyundai'];
const SHIFT_SEC = 180, COMBO_SEC = 12, CELLS = 8, MAX_WAIT = 5;

// ───────── 상태 ─────────
const S = {
  shift: 1, running: false, paused: false, time: SHIFT_SEC, score: 0,
  combo: 0, comboT: 0, best: 0, board: Array(CELLS).fill(null), sel: null,
  clients: [], backlog: [], spawnT: 0, intro: [], served: [], dex: new Set(), last: 0,
};
try { JSON.parse(localStorage.getItem('robotsi.dex3') || '[]').forEach(id => O[id] && S.dex.add(id)); } catch (e) {}
const saveDex = () => { try { localStorage.setItem('robotsi.dex3', JSON.stringify([...S.dex])); } catch (e) {} };
const $ = id => document.getElementById(id);
const nudge = el => { if (!el) return; el.classList.remove('nope', 'shake'); void el.offsetWidth; el.classList.add(el.classList.contains('card') ? 'shake' : 'nope'); };

// ───────── 손님 흐름: 떠나지 않음, 대기가 차면 잠시 멈춤 ─────────
function pickOrder() {
  if (S.intro.length) return S.intro.shift();
  const waiting = new Set([...S.clients, ...S.backlog].map(c => c.order.id));
  const total = Object.values(ROBOT_WEIGHT).reduce((a, b) => a + b, 0);
  let r = Math.random() * total, robot = 'amr';
  for (const [k, w] of Object.entries(ROBOT_WEIGHT)) { if ((r -= w) <= 0) { robot = k; break; } }
  let ids = BY_ROBOT[robot].filter(id => !waiting.has(id));
  if (!ids.length) ids = ORDERS.map(o => o.id).filter(id => !waiting.has(id));
  return ids[Math.floor(Math.random() * ids.length)];
}
const spawnGap = () => Math.max(4, 9 - (S.shift - 1) * 1.2) - (1 - S.time / SHIFT_SEC) * 2.5;
function spawn() {
  const c = { order: O[pickOrder()], fresh: true };
  if (S.clients.length < 3) S.clients.push(c); else S.backlog.push(c);
  renderClients();
}

// ───────── 렌더링 ─────────
const selRobot = () => S.sel !== null && S.board[S.sel] && ITEMS[S.board[S.sel]].kind === 'robot';
function renderShelf() {
  const first = S.running && S.shift === 1 && S.clients[0];
  const need = first ? new Set(baseParts(first.order.want)) : new Set();
  $('shelf').innerHTML = SHELF.map(id => `
    <button class="stock ${ITEMS[id].kind}${need.has(id) ? ' glow' : ''}" type="button" data-stock="${id}" aria-label="${ITEMS[id].name}">
      <span class="ic">${ITEMS[id].icon}</span><span class="nm">${ITEMS[id].name}</span>
    </button>`).join('');
}
function renderBoard(popAt) {
  $('board').innerHTML = S.board.map((id, i) => {
    if (!id) return `<button class="cell" type="button" data-cell="${i}" aria-label="빈 칸"></button>`;
    const it = ITEMS[id];
    return `<button class="cell ${it.kind}${S.sel === i ? ' sel' : ''}${popAt === i ? ' pop' : ''}" type="button" data-cell="${i}" aria-label="${it.name}"><span class="ic">${it.icon}</span>${it.name}</button>`;
  }).join('');
  document.querySelectorAll('.card[data-client]').forEach(el => el.classList.toggle('target', selRobot()));
}
function renderClients() {
  $('clients').innerHTML = [0, 1, 2].map(i => {
    const c = S.clients[i];
    const extra = i === 2 && S.backlog.length ? `<span class="backlog">+${S.backlog.length}</span>` : '';
    if (!c) return `<div class="card empty">${extra}</div>`;
    const o = c.order, w = ITEMS[o.want], rc = recipeOf(o.want);
    const recipe = rc ? `${ITEMS[rc[0]].icon}+${ITEMS[rc[1]].icon}` : '';
    return `<button class="card${c.fresh ? ' enter' : ''}${selRobot() ? ' target' : ''}" type="button" data-client="${i}" aria-label="${o.who}: ${w.name} 주문">${extra}
      <span class="who"><span>${o.icon}</span><span>${o.who}</span></span>
      <span class="want"><span class="big">${w.icon}</span><span class="nm">${w.name}</span></span>
      <span class="recipe">${recipe}</span>
    </button>`;
  }).join('');
  S.clients.forEach(c => (c.fresh = false));
  renderShelf();
}
function renderHud() {
  const t = Math.max(0, Math.ceil(S.time));
  $('clock').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  $('score').textContent = S.score;
  $('combo').textContent = S.combo;
  $('flowBar').style.width = (S.combo ? S.comboT / COMBO_SEC * 100 : 0).toFixed(1) + '%';
}
function floatText(el, text) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'float'; f.textContent = text;
  f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top + 20) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 950);
}

// ───────── 동작 ─────────
const firstEmpty = () => S.board.findIndex(x => !x);
function placeStock(id, at) {
  const i = at ?? firstEmpty();
  if (i < 0) { nudge($('btnTrash')); return; }
  S.board[i] = id; S.sel = null; renderBoard(i);
}
function mergeInto(target, incoming, fromCell) {
  const r = recipe(S.board[target], incoming);
  if (!r) return false;
  if (fromCell !== undefined) S.board[fromCell] = null;
  S.board[target] = r; S.sel = null;
  renderBoard(target);
  return true;
}
function cellToCell(from, to) {
  if (from === to) return;
  if (!S.board[to]) { S.board[to] = S.board[from]; S.board[from] = null; S.sel = null; renderBoard(); return; }
  if (mergeInto(to, S.board[from], from)) return;
  S.sel = null; renderBoard();
  nudge(document.querySelector(`[data-cell="${to}"]`));
}
function tapCell(i) {
  if (S.sel === null) { if (S.board[i]) { S.sel = i; renderBoard(); } return; }
  if (S.sel === i) { S.sel = null; renderBoard(); return; }
  if (!S.board[i]) { cellToCell(S.sel, i); return; }
  if (mergeInto(i, S.board[S.sel], S.sel)) return;
  S.sel = i; renderBoard();
}
function tapStock(id) {
  if (S.sel !== null && S.board[S.sel] && mergeInto(S.sel, id)) return;
  placeStock(id);
}
function trash(i) {
  if (i === null || !S.board[i]) return;
  S.board[i] = null; S.sel = null; renderBoard();
}
// src: { cell } 또는 { stock } — 완제품은 스토리지에서 손님에게 바로 끌어다 줄 수 있음
function deliver(src, ci) {
  const c = S.clients[ci];
  const id = src.stock || S.board[src.cell];
  const card = document.querySelector(`.card[data-client="${ci}"]`);
  if (!c || !id) return;
  if (id !== c.order.want) { nudge(card); return; }
  S.combo = S.comboT > 0 ? S.combo + 1 : 1;
  S.comboT = COMBO_SEC;
  S.best = Math.max(S.best, S.combo);
  const gain = Math.round(100 * Math.min(3, 1 + 0.25 * (S.combo - 1)));
  S.score += gain;
  floatText(card, `+${gain}`);
  S.served.push(c.order.id);
  S.dex.add(c.order.id); saveDex();
  if (src.cell !== undefined) S.board[src.cell] = null;
  S.sel = null;
  S.clients.splice(ci, 1);
  if (S.backlog.length) S.clients.push(S.backlog.shift());
  if (!S.clients.length) S.spawnT = Math.min(S.spawnT, 0.6);
  renderClients(); renderBoard(); renderHud();
}

// ───────── 끌기 + 누르기 ─────────
let drag = null;
document.addEventListener('pointerdown', e => {
  if (!S.running || S.paused) return;
  const cell = e.target.closest('[data-cell]'), stock = e.target.closest('[data-stock]');
  if (!cell && !stock) return;
  drag = { src: cell ? { cell: +cell.dataset.cell } : { stock: stock.dataset.stock }, x: e.clientX, y: e.clientY, started: false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    const id = drag.src.stock || S.board[drag.src.cell];
    if (!id) { drag = null; return; }
    drag.started = true;
    drag.ghost = Object.assign(document.createElement('div'), { className: 'ghost', textContent: ITEMS[id].icon });
    document.body.appendChild(drag.ghost);
    if (drag.src.cell !== undefined) document.querySelector(`[data-cell="${drag.src.cell}"]`)?.classList.add('dim');
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-cell],[data-client],[data-trash]');
  if (drag.over && drag.over !== over) drag.over.classList.remove('drop', 'over');
  if (over) over.classList.add(over.dataset.client !== undefined ? 'over' : 'drop');
  drag.over = over;
}, { passive: false });
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.started) { if (d.src.stock) tapStock(d.src.stock); else tapCell(d.src.cell); return; }
  d.ghost.remove();
  d.over?.classList.remove('drop', 'over');
  const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-cell],[data-client],[data-trash]');
  if (!t) { renderBoard(); return; }
  if (t.dataset.trash) { if (d.src.cell !== undefined) trash(d.src.cell); else renderBoard(); return; }
  if (t.dataset.client !== undefined) { deliver(d.src, +t.dataset.client); renderBoard(); return; }
  const to = +t.dataset.cell;
  if (d.src.stock) {
    if (!S.board[to]) placeStock(d.src.stock, to);
    else if (!mergeInto(to, d.src.stock)) { renderBoard(); nudge(document.querySelector(`[data-cell="${to}"]`)); }
  } else cellToCell(d.src.cell, to);
});
document.addEventListener('pointercancel', () => { drag?.ghost?.remove(); drag = null; renderBoard(); });
$('clients').addEventListener('click', e => {
  const b = e.target.closest('[data-client]');
  if (!b || !S.running || S.paused || S.sel === null) return;
  deliver({ cell: S.sel }, +b.dataset.client);
});
$('btnTrash').addEventListener('click', () => { if (S.running && !S.paused) trash(S.sel); });

// ───────── 근무 ─────────
function loop(t) {
  const dt = Math.min(0.1, (t - (S.last || t)) / 1000);
  S.last = t;
  if (S.running && !S.paused) {
    S.time -= dt;
    if (S.comboT > 0 && (S.comboT -= dt) <= 0) { S.comboT = 0; S.combo = 0; }
    if (S.clients.length + S.backlog.length < MAX_WAIT && (S.spawnT -= dt) <= 0) { spawn(); S.spawnT = spawnGap(); }
    renderHud();
    if (S.time <= 0) endShift();
  }
  requestAnimationFrame(loop);
}
function startShift() {
  Object.assign(S, { running: true, paused: false, time: SHIFT_SEC, score: 0, combo: 0, comboT: 0, best: 0,
    served: [], board: Array(CELLS).fill(null), sel: null, clients: [], backlog: [], spawnT: 0.3,
    intro: S.shift === 1 ? TUTORIAL.slice() : [] });
  $('overlay').hidden = true;
  renderClients(); renderBoard(); renderHud();
}
const logItem = o => `<div class="log-item"><span class="i">${o.icon}</span><span class="h">${o.who} ${ITEMS[o.want].icon} ${ITEMS[o.want].name}<small>${o.sec}</small></span><span>${o.fact}</span></div>`;
function endShift() {
  S.running = false;
  const seen = [...new Set(S.served)].map(id => logItem(O[id])).join('');
  openSheet(`
    <h2>근무 끝!</h2>
    <div class="big-stats"><span>📦<b class="num">${S.served.length}</b></span><span>⭐<b class="num">${S.score}</b></span><span>🔥<b class="num">${S.best}</b></span></div>
    ${seen ? `<p>오늘 다녀온 현장</p><div class="log">${seen}</div>` : ''}
    <button class="primary" type="button" data-act="next">다음 근무 ▶</button>`);
}

// ───────── 오버레이 ─────────
function openSheet(html, pause) {
  $('sheet').innerHTML = html;
  $('overlay').hidden = false;
  if (pause && S.running) S.paused = true;
  $('sheet').querySelector('button')?.focus();
}
const HELP = `
  <h2>로봇 SI 납품소</h2>
  <div class="steps">
    <div class="step">🛞 + 👁️ → 🚚 <span>끌어다 겹치면 조립</span></div>
    <div class="step">🚚 → 📦 <span>주문 카드에 끌어다 놓으면 납품</span></div>
    <div class="step">🦾 🐕 🚶 <span>완제품은 선반에서 바로 납품</span></div>
  </div>
  <p>손님은 떠나지 않고, 틀려도 괜찮아요. 연달아 납품하면 🔥콤보! 근무는 3분이에요.</p>
  <button class="primary" type="button" data-act="begin">근무 시작 ▶</button>`;
$('sheet').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') { $('overlay').hidden = true; if (S.running) S.paused = false; }
  else if (act === 'begin') startShift();
  else if (act === 'next') { S.shift++; startShift(); }
});
$('btnDex').addEventListener('click', () => openSheet(`
  <h2>현장 도감 ${S.dex.size}/${ORDERS.length}</h2>
  <div class="log">${ORDERS.map(o => S.dex.has(o.id) ? logItem(o)
    : `<div class="log-item locked"><span class="i">❔</span><span class="h">???<small>${o.sec}</small></span><span>아직 납품 전</span></div>`).join('')}</div>
  <p>출처: 로봇 스터디 2차 발제 자료 (2026.09.21)</p>
  <button class="primary" type="button" data-act="close">닫기</button>`, true));
$('btnPause').addEventListener('click', () => {
  if (S.running) openSheet(`<h2>⏸</h2><button class="primary" type="button" data-act="close">계속 ▶</button>`, true);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) $('btnPause').click(); });

renderShelf(); renderBoard(); renderClients(); renderHud();
openSheet(HELP);
requestAnimationFrame(loop);
</script>
