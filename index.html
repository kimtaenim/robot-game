<title>로봇 SI 납품소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위에서 아래로 손님 줄 → 조립대(작업대 안전 줄무늬) → 현장 소식 → 스토리지 선반. 한 화면 안에서 끝나는 작업장 */
:root {
  --bg: #E7ECEF;
  --surface: #FFFFFF;
  --surface-2: #F2F5F7;
  --ink: #13202A;
  --muted: #586977;
  --line: #CBD5DC;
  --accent: #F0B400;
  --steel: #1C5A86;
  --good: #24804D;
  --warn: #C77F00;
  --bad: #C03A2A;
  --on-color: #FFFFFF;
  --scrim: rgba(12, 20, 27, 0.55);
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151A; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0; --muted: #91A2AF;
    --line: #2E3B47; --accent: #F5C12B; --steel: #72AEDC; --good: #3FA86C; --warn: #E0A030;
    --bad: #E0594A; --on-color: #0F151A; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151A; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0; --muted: #91A2AF;
  --line: #2E3B47; --accent: #F5C12B; --steel: #72AEDC; --good: #3FA86C; --warn: #E0A030;
  --bad: #E0594A; --on-color: #0F151A; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { box-sizing: border-box; height: 100%; max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; }

/* 상단 바 */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.01em; }
.brand small { font-family: var(--font-body); font-size: 11px; color: var(--muted); margin-left: 4px; font-weight: 500; }
.stats { display: flex; gap: 12px; margin-left: auto; font-size: 13px; align-items: baseline; }
.stats b { font-weight: 600; }
.stats .lbl { color: var(--muted); font-size: 11px; margin-right: 3px; }
.tools { display: flex; gap: 6px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; }

.label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }

/* 손님 줄 */
.clients { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; min-height: 178px; }
.card { position: relative; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; min-width: 0; }
.card.empty { align-items: center; justify-content: center; color: var(--muted); font-size: 12px; border-style: dashed; background: transparent; cursor: default; }
.card .c-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.card .c-icon { font-size: 22px; line-height: 1; }
.card .c-sec { font-size: 10px; color: var(--steel); font-weight: 700; text-align: right; }
.card .c-who { font-weight: 700; font-size: 13px; line-height: 1.25; }
.card .c-ask { font-size: 11.5px; line-height: 1.4; color: var(--ink); opacity: 0.85; }
.card .c-tags { display: flex; flex-wrap: wrap; gap: 3px; }
.tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.card .c-foot { margin-top: auto; display: flex; justify-content: space-between; gap: 4px; font-size: 10.5px; color: var(--muted); align-items: baseline; flex-wrap: wrap; }
.card .c-budget { color: var(--ink); font-weight: 600; font-size: 12px; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--surface-2); }
.bar i { display: block; height: 100%; width: 100%; background: var(--good); transition: background-color .3s; }
.bar i.warn { background: var(--warn); }
.bar i.crit { background: var(--bad); }
.card.enter { animation: enter .35s ease-out; }
.card.shake { animation: shake .4s; border-color: var(--bad); }
.card.ready { border-color: var(--steel); box-shadow: 0 0 0 1px var(--steel); }
@keyframes enter { from { transform: translateY(-12px); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

/* 조립대 */
.bench { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stripe { height: 7px; background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, var(--ink) 10px 20px); }
.bench-in { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.bench-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.robot-name { font-family: var(--font-display); font-size: 19px; color: var(--steel); min-width: 0; flex: 1; }
.robot-name.idle { color: var(--muted); }
.cost { font-size: 12px; color: var(--muted); }
.cost b { color: var(--ink); }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot { height: 62px; border: 2px dashed var(--line); border-radius: 10px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); }
.slot.filled { border-style: solid; border-color: var(--steel); background: var(--surface-2); color: var(--ink); }
.slot .ic { font-size: 24px; line-height: 1; }
.hint { font-size: 11.5px; color: var(--muted); }

/* 현장 소식 */
.ticker { font-size: 12px; line-height: 1.5; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-height: 2.6em; }
.ticker b { color: var(--steel); }

/* 스토리지 */
.storage { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.parts { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 560px) { .parts { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.part { position: relative; background: var(--surface); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 10px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.part:active { transform: translateY(1px); }
.part .ic { font-size: 22px; line-height: 1.1; }
.part .nm { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.part .pc { font-size: 10px; color: var(--muted); }
.part .badge { position: absolute; top: 3px; right: 3px; font-size: 8.5px; font-weight: 700; padding: 1px 3px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--font-mono); }
.part.on { border-color: var(--steel); background: var(--surface-2); }

/* 알림 */
.toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: min(90vw, 460px); padding: 11px 15px; border-radius: 10px; font-size: 13.5px; line-height: 1.45; font-weight: 500; color: var(--on-color); background: var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,.25); pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 20; }
.toast.show { opacity: 1; }
.toast.good { background: var(--good); }
.toast.bad { background: var(--bad); }

/* 오버레이 */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; width: 100%; max-width: 540px; max-height: 86%; overflow: auto; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; text-wrap: balance; }
.sheet h3 { font-size: 13px; margin: 6px 0 0; color: var(--muted); letter-spacing: .06em; }
.sheet p { margin: 0; font-size: 14px; line-height: 1.6; }
.sheet ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.65; }
.rules { display: grid; gap: 6px; font-size: 13px; }
.rules div { display: flex; gap: 8px; align-items: baseline; }
.big-stats { display: flex; gap: 18px; flex-wrap: wrap; }
.big-stats div { display: flex; flex-direction: column; }
.big-stats span { font-size: 11px; color: var(--muted); }
.big-stats b { font-size: 22px; }
.log { display: grid; gap: 8px; }
.log-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.55; background: var(--surface-2); }
.log-item .hd { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; margin-bottom: 3px; }
.log-item .hd b { font-size: 14px; }
.log-item .hd small { color: var(--steel); font-weight: 700; font-size: 11px; }
.log-item .hd em { font-style: normal; color: var(--muted); font-size: 11px; margin-left: auto; }
.log-item.miss { border-style: dashed; background: transparent; }
.log-item.locked { color: var(--muted); border-style: dashed; background: transparent; }
.answer { color: var(--bad); font-weight: 700; }
.primary { align-self: flex-start; background: var(--accent); color: #1A1400; border: 0; border-radius: 10px; padding: 11px 20px; font-weight: 700; font-size: 15px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  .card.enter, .card.shake { animation: none; }
  .toast, .bar i { transition: none; }
}
</style>

const costOf = b => b.reduce((s, id) => s + P[id].cost, 0);

function robotName(bench) {
  if (!bench.length) return '';
  let rest = bench.map(id => ({ id, k: id.startsWith('vis') ? 'vision' : id }));
  const names = [];
  for (const r of RECIPES) {
    if (r.set.every(k => rest.some(x => x.k === k))) {
      names.push(r.name);
      r.set.forEach(k => { const i = rest.findIndex(x => x.k === k); rest.splice(i, 1); });
    }
  }
  rest.forEach(x => names.push(P[x.id].solo));
  return names.join(' + ');
}

function check(order, bench) {
  if (order.tags.includes('us') && bench.some(id => P[id].cn))
    return '미 FCC 인증 차단: 중국산 카메라·센서를 단 장비는 미국 공장에 못 들어가요';

    return '기존 공장이라 바닥 공사를 못 해요. AGV는 바닥에 마그넷·QR 경로를 깔아야 해요';
  for (const n of order.needs) {
    if (!n.any.some(id => hasNeed(bench, id))) {
      if (n.any.includes('amr') && !n.any.includes('agv') && bench.includes('agv'))
        return 'AGV는 바닥에 깐 경로만 따라가요. 스스로 길을 찾는 AMR이 필요해요';
      return n.why;
    }
  }
  const cost = costOf(bench);
  if (cost > order.budget) return `예산 초과: ${order.payer} 예산은 ${order.budget}인데 원가가 ${cost}예요. 필요 없는 부품을 빼 보세요`;

}

  toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'bad' ? 3200 : 2400);

function dayConfig(d) {
  return { patience: Math.max(40, 80 - (d - 1) * 12), gap: Math.max(4, 9 - (d - 1) * 1.5) };
}
function buildQueue(d) {
  if (d <= DAY_PLANS.length) return DAY_PLANS[d - 1].slice();
  if (d === 3) return shuffle(['fire', 'hyundai', ...shuffle(ORDERS.map(o => o.id).filter(id => id !== 'fire' && id !== 'hyundai')).slice(0, 6)]);
  return shuffle(ORDERS.map(o => o.id)).slice(0, Math.min(ORDERS.length, 8 + (d - 4)));
}
function startDay() {
  S.cfg = dayConfig(S.day);
  S.queue = buildQueue(S.day);
  S.total = S.queue.length;
  S.slots = [null, null, null];
  S.bench = []; S.served = []; S.missed = []; S.dayEarn = 0; S.spawnT = 0.4;
  S.running = true; S.paused = false;

}
function spawn() {
  const i = S.slots.findIndex(s => !s);
  if (i < 0 || !S.queue.length) return;
  const order = O[S.queue.shift()];

}
function deliver(i) {

  if (!S.bench.length) { toast('조립대가 비어 있어요. 스토리지에서 부품을 먼저 올리세요', 'bad'); return; }
  const why = check(s.order, S.bench);
  const card = document.querySelector(`.card[data-slot="${i}"]`);
  if (why) {
    s.t = Math.max(1, s.t - s.max * 0.15);
    toast(`❌ ${s.order.who}: ${why}`, 'bad');
    if (card) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }

  const name = robotName(S.bench);
  const cost = costOf(S.bench);
  const tip = Math.round(3 * s.t / s.max);
  const gain = s.order.budget - cost + tip;
  S.money += gain; S.dayEarn += gain;
  S.served.push({ id: s.order.id, name, gain });
  S.dex.add(s.order.id); saveDex();
  $('ticker').innerHTML = `<b>${s.order.icon} ${s.order.who}</b> · ${s.order.fact}`;
  S.slots[i] = null; S.bench = [];
  S.spawnT = Math.max(S.spawnT, 1.2);
  toast(`✅ ${name} 납품! 이익 +${gain} (팁 ${tip})`, 'good');
  renderClients(); renderBench(); renderHud();
}
function addPart(id) {
  if (!S.running || S.paused) return;
  if (S.bench.includes(id)) { toast(`${P[id].name}은(는) 이미 올라가 있어요`); return; }
  if (S.bench.length >= 4) { toast('조립대가 꽉 찼어요. 부품을 눌러 빼세요', 'bad'); return; }
  S.bench.push(id);
  renderBench();
}

function loop(t) {
  const dt = Math.min(0.1, (t - (S.last || t)) / 1000);
  S.last = t;
  if (S.running && !S.paused) {
    if (S.queue.length && S.slots.some(s => !s)) {
      S.spawnT -= dt;
      if (S.spawnT <= 0) { spawn(); S.spawnT = S.cfg.gap; }
    }
    let changed = false;
    S.slots.forEach((s, i) => {
      if (!s) return;
      s.t -= dt;
      if (s.t <= 0) {
        S.missed.push(s.order.id);
        S.slots[i] = null; changed = true;
        S.spawnT = Math.max(S.spawnT, 1.2);
        toast(`${s.order.icon} ${s.order.who} 고객이 기다리다 떠났어요`, 'bad');
      }
    });
    if (changed) { renderClients(); renderHud(); } else updateBars();
    if (!S.queue.length && S.slots.every(s => !s)) endDay();
  }
  requestAnimationFrame(loop);
}

// ───────── 오버레이 ─────────
function openSheet(html, pause) {
  $('sheet').innerHTML = html;
  $('overlay').hidden = false;
  if (pause && S.running) S.paused = true;
  const btn = $('sheet').querySelector('button');
  if (btn) btn.focus();
}
function closeSheet() {
  $('overlay').hidden = true;
  if (S.running) S.paused = false;
}
const answerOf = o => o.needs.map(n => n.any.map(needLabel).join(' 또는 ')).join(' + ')
  + o.tags.map(t => ` · ${TAGS[t].rule}`).join('');

function helpHtml(first) {
  return `
    <h2>로봇 SI 납품소</h2>
    <p>당신은 로봇 SI 회사 사장이에요. 산업 현장에서 고객이 찾아오면, 요청에 맞는 로봇을 조립해 납품하세요.</p>
    <ol>
      <li>손님 카드에서 <b>요청·조건·예산</b>을 읽어요</li>
      <li>스토리지에서 부품을 눌러 <b>조립대</b>에 올려요 (최대 4개)</li>
      <li><b>손님 카드를 누르면 납품</b>. 틀리면 이유를 알려주고 손님 인내심이 줄어요</li>
    </ol>
    <h3>조건 표시</h3>
    <div class="rules">
      ${Object.values(TAGS).map(t => `<div><span class="tag">${t.label}</span><span>${t.rule}</span></div>`).join('')}
    </div>
    <p>이익 = 예산 − 부품 원가 + 빨리 납품한 팁. 싼 중국산 센서와 AGV를 쓸 수 있는 곳에선 써서 이익을 남기세요.</p>
    <div class="row"><button class="primary" type="button" data-act="${first ? 'begin' : 'close'}">${first ? '1일차 시작' : '계속하기'}</button></div>`;
}
function dayStartHtml() {
  const c = dayConfig(S.day);
  const n = S.day <= DAY_PLANS.length ? DAY_PLANS[S.day - 1].length : buildQueue(S.day).length;
  return `
    <h2>${S.day}일차 영업</h2>
    <p>오늘 손님 ${n}팀이 와요. 손님 한 팀은 약 ${c.patience}초 기다려요.${S.day >= 3 ? ' 오늘부터는 손님이 무작위로 섞여 와요.' : ''}</p>
    <div class="row"><button class="primary" type="button" data-act="begin">영업 시작</button></div>`;
}
function endDay() {
  S.running = false;
  const served = S.served.map(x => {
    const o = O[x.id];
    return `<div class="log-item"><div class="hd"><b>${o.icon} ${o.who}</b><small>${o.sec}</small><em>${o.when} · ${x.name} · +${x.gain}</em></div>${o.fact}</div>`;
  }).join('');
  const missed = S.missed.map(id => {
    const o = O[id];
    return `<div class="log-item miss"><div class="hd"><b>${o.icon} ${o.who}</b><small>${o.sec}</small></div>정답: <span class="answer">${answerOf(o)}</span></div>`;
  }).join('');
  openSheet(`
    <h2>${S.day}일차 마감</h2>
    <div class="big-stats">
      <div><span>납품</span><b class="num">${S.served.length}/${S.total}</b></div>
      <div><span>오늘 이익</span><b class="num">${S.dayEarn}</b></div>
      <div><span>누적 이익</span><b class="num">${S.money}</b></div>
      <div><span>도감</span><b class="num">${S.dex.size}/${ORDERS.length}</b></div>
    </div>
    ${served ? `<h3>오늘의 납품 일지</h3><div class="log">${served}</div>` : ''}
    ${missed ? `<h3>놓친 손님</h3><div class="log">${missed}</div>` : ''}
    <div class="row"><button class="primary" type="button" data-act="next">${S.day + 1}일차로</button></div>`);
}
function dexHtml() {
  const items = ORDERS.map(o => S.dex.has(o.id)
    ? `<div class="log-item"><div class="hd"><b>${o.icon} ${o.who}</b><small>${o.sec}</small><em>${o.when} · 지불: ${o.payer}</em></div>${o.fact}</div>`
    : `<div class="log-item locked"><div class="hd"><b>${o.icon} ???</b><small>${o.sec}</small></div>아직 납품 전이에요.</div>`).join('');
  return `
    <h2>현장 도감 ${S.dex.size}/${ORDERS.length}</h2>
    <p>납품에 성공한 현장의 실제 이야기가 모여요. 출처는 로봇 스터디 2차 발제 자료(2026.09.21)예요.</p>
    <div class="log">${items}</div>
    <div class="row"><button class="primary" type="button" data-act="close">닫기</button></div>`;
}

// ───────── 입력 ─────────
$('parts').addEventListener('click', e => { const b = e.target.closest('[data-part]'); if (b) addPart(b.dataset.part); });
$('slots').addEventListener('click', e => {
  const b = e.target.closest('[data-bench]');
  if (!b || S.paused) return;
  S.bench.splice(+b.dataset.bench, 1); renderBench();
});
$('clients').addEventListener('click', e => { const b = e.target.closest('[data-slot]'); if (b) deliver(+b.dataset.slot); });
$('btnClear').addEventListener('click', () => { if (S.paused) return; S.bench = []; renderBench(); });
$('btnHelp').addEventListener('click', () => openSheet(helpHtml(false), true));
$('btnDex').addEventListener('click', () => openSheet(dexHtml(), true));
$('btnPause').addEventListener('click', () => {
  if (!S.running) return;
  openSheet(`<h2>일시정지</h2><p>손님들이 기다려 주고 있어요.</p><div class="row"><button class="primary" type="button" data-act="close">계속하기</button></div>`, true);
});
$('sheet').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'close') closeSheet();
  else if (act === 'begin') { $('overlay').hidden = true; startDay(); }
  else if (act === 'next') { S.day++; renderHud(); openSheet(dayStartHtml()); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.running && !S.paused) $('btnPause').click();
});

// ───────── 시작 ─────────
let seen = false;
try { seen = localStorage.getItem('robotsi.seen') === '1'; localStorage.setItem('robotsi.seen', '1'); } catch (e) {}
renderBench(); renderHud();
S.slots = [null, null, null]; S.queue = DAY_PLANS[0].slice(); renderClients(); S.queue = [];
openSheet(seen ? dayStartHtml() : helpHtml(true));
requestAnimationFrame(loop);
</script>
