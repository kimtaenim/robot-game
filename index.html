<title>로봇 SI 납품소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위 클라이언트 3명(말풍선 주문) → 재고 → 아래 5×5 매치3 보드. 공장 작업장 톤 */
:root {
  --bg: #DDE4E8;
  --board: #C3CED5;
  --cell: #D2DBE1;
  --surface: #FFFFFF;
  --surface-2: #F2F5F7;
  --ink: #13202A;
  --muted: #586977;
  --line: #B7C3CB;
  --accent: #F0B400;
  --gold-soft: #FFF3C9;
  --steel: #1C5A86;
  --steel-soft: #DCE8F1;
  --good: #24804D;
  --warn: #C77F00;
  --bad: #C03A2A;
  --scrim: rgba(12, 20, 27, 0.55);
  --t-wheel: #F4E3C1; --t-auto: #CFE6FA; --t-floor: #FBD3B0; --t-arm: #D9D2F5; --t-tool: #CDEFD8; --t-legs: #F7D0DA; --t-hum: #FFE27A;
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151A; --board: #1A242C; --cell: #222E38; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0;
    --muted: #91A2AF; --line: #3A4855; --accent: #F5C12B; --gold-soft: #3A3115; --steel: #72AEDC; --steel-soft: #1D3346;
    --good: #3FA86C; --warn: #E0A030; --bad: #E0594A; --scrim: rgba(0, 0, 0, 0.65);
    --t-wheel: #5A4A2A; --t-auto: #234A6B; --t-floor: #6B3F1F; --t-arm: #3F3670; --t-tool: #22553A; --t-legs: #6B2E3F; --t-hum: #7A6418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151A; --board: #1A242C; --cell: #222E38; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0;
  --muted: #91A2AF; --line: #3A4855; --accent: #F5C12B; --gold-soft: #3A3115; --steel: #72AEDC; --steel-soft: #1D3346;
  --good: #3FA86C; --warn: #E0A030; --bad: #E0594A; --scrim: rgba(0, 0, 0, 0.65);
  --t-wheel: #5A4A2A; --t-auto: #234A6B; --t-floor: #6B3F1F; --t-arm: #3F3670; --t-tool: #22553A; --t-legs: #6B2E3F; --t-hum: #7A6418;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { box-sizing: border-box; height: 100%; max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
.app.fever { background: var(--gold-soft); }

/* 상단 바 */
.top { display: flex; align-items: center; gap: 12px; font-size: 15px; }
.lv { font-family: var(--font-display); font-size: 18px; }
.top .stat { display: flex; align-items: center; gap: 4px; }
.top .stat b { font-size: 16px; }
.goal { flex: 1; min-width: 0; height: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.goal i { display: block; height: 100%; width: 0; background: var(--accent); }
.tools { display: flex; gap: 6px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; font-size: 15px; padding: 0; }
.sub { display: flex; align-items: center; gap: 12px; font-size: 14px; min-height: 20px; }
.sub .chain { font-family: var(--font-display); color: var(--accent); font-size: 16px; }
.sub .left { margin-left: auto; color: var(--muted); font-size: 12px; }

/* 주문표 */
.rail { flex: 1 1 0; min-height: 200px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.client { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; padding-top: 2px; }
.client.empty .door { flex: 1; width: 100%; border: 2px dashed var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.bubble { position: relative; width: 100%; box-sizing: border-box; background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; padding: 6px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; box-shadow: 0 2px 0 var(--line); }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; background: var(--surface); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.bubble .say { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.25; word-break: keep-all; }
.bubble .robot { display: flex; align-items: center; gap: 2px; font-size: 26px; line-height: 1; }
.bubble .robot small { font-family: var(--font-display); font-size: 12px; color: var(--steel); margin-left: 2px; }
.bubble .needs { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; position: relative; z-index: 1; }
.need { position: relative; width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 17px; border: 2px dashed var(--line); box-sizing: border-box; }
.need.got { border: 2px solid var(--good); background: var(--surface-2); }
.need.got::after { content: '✓'; position: absolute; right: -4px; bottom: -6px; font-size: 11px; font-weight: 700; color: var(--good); }
.face { font-size: 46px; line-height: 1; margin-top: 8px; transition: transform .2s; }
.who { font-size: 12.5px; font-weight: 700; text-align: center; line-height: 1.2; word-break: keep-all; }
.who small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 700; }
.pat { width: 90%; height: 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; flex: none; }
.pat i { display: block; height: 100%; background: var(--good); transform-origin: left; }
.pat i.warn { background: var(--warn); }
.pat i.crit { background: var(--bad); }
.client.gone .bubble { border-color: var(--bad); background: var(--surface); }
.client.gone .bubble .say { color: var(--bad); font-size: 13px; }
.client.gone .face { animation: stomp .5s ease-in-out infinite; }
.client.gone .who, .client.gone .pat { opacity: .5; }
.client.done .bubble { border-color: var(--good); }
.client.done .bubble .say { color: var(--good); font-size: 13px; }
.client.slow .pat i { background: var(--steel); }
.client.enter { animation: drop .35s ease-out; }
.client.bump .face { transform: scale(1.18); }
@keyframes drop { from { transform: translateY(-18px); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes stomp { 50% { transform: translateY(-4px) rotate(-6deg); } }
.showcase { position: fixed; z-index: 39; pointer-events: none; font-size: 30px; transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
.showcase b { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 400; font-size: 9px; color: var(--ink); white-space: nowrap; text-shadow: 0 1px 0 var(--surface); }

/* 재고 */
.stock { display: flex; gap: 6px; align-items: center; min-height: 28px; font-size: 13px; color: var(--muted); }
.stock .chip { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 2px 8px; font-size: 15px; color: var(--ink); }
.stock .chip b { font-size: 12px; }

/* 매치3 보드 */
.boardwrap { flex: none; display: flex; justify-content: center; }
.board { position: relative; width: min(100%, 400px); aspect-ratio: 1; background: var(--board); border-radius: 14px; touch-action: none; overflow: visible; }
.clip { position: absolute; inset: 0; overflow: hidden; border-radius: 14px; }
.fxc { position: absolute; left: -40px; top: -40px; pointer-events: none; z-index: 5; }
.cellbg { position: absolute; border-radius: 10px; background: var(--cell); }
.tile { position: absolute; left: 0; top: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); will-change: transform; pointer-events: none; transform-origin: 50% 50%; }
.tile .ic { font-size: 30px; line-height: 1; }
.tile .nm { font-size: 9.5px; font-weight: 700; color: var(--ink); opacity: .75; margin-top: 2px; }
.tile.hum { box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 0 0 3px var(--accent); }
.tile.sel { box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 0 0 3px var(--accent); }
.tile.hint { animation: hint 1s ease-in-out infinite; }
@keyframes hint { 50% { filter: brightness(1.25); } }

.flyer { position: fixed; z-index: 38; pointer-events: none; font-size: 28px; transform: translate(-50%, -50%); transition: left .32s ease-in, top .32s ease-in, transform .32s ease-in; }
.float { position: fixed; z-index: 35; pointer-events: none; font-family: var(--font-display); font-size: 24px; color: var(--good); transform: translate(-50%, 0); animation: floatUp .9s ease-out forwards; text-shadow: 0 1px 0 var(--surface); }
.float.bad { color: var(--bad); }
.float.big { font-size: 30px; color: var(--accent); }
@keyframes floatUp { to { transform: translate(-50%, -54px); opacity: 0; } }
.banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 36; pointer-events: none; font-family: var(--font-display); font-size: 36px; color: var(--accent); text-shadow: 0 2px 0 var(--ink); animation: banner 1.2s ease-out forwards; white-space: nowrap; }
@keyframes banner { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1); opacity: 0; } }

/* 오버레이 */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 16px; width: 100%; max-width: 480px; max-height: 88%; overflow: auto; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; user-select: text; -webkit-user-select: text; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.sheet p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
.steps { display: grid; gap: 10px; }
.step { display: flex; align-items: center; gap: 12px; font-size: 24px; }
.step span { font-size: 14px; color: var(--muted); }
.recipes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 14px; }
.big-stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; }
.big-stats b { font-size: 24px; margin-left: 4px; }
.map { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.sector { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; filter: grayscale(1); opacity: .35; }
.sector small { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--muted); font-weight: 700; }
.sector.lit { filter: none; opacity: 1; border: 1px solid var(--steel); background: var(--steel-soft); }
.log { display: grid; gap: 6px; }
.log-item { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: start; border-bottom: 1px solid var(--line); padding: 7px 0; font-size: 13px; line-height: 1.5; }
.log-item .i { font-size: 24px; grid-row: span 2; }
.log-item .h { font-weight: 700; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.log-item .h small { color: var(--steel); font-size: 11px; }
.log-item.locked { color: var(--muted); }
.primary { align-self: flex-start; background: var(--accent); color: #1A1400; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 16px; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }

@media (prefers-reduced-motion: reduce) {
  .client.enter, .client.gone .face, .float, .banner, .tile.hint { animation: none; }
  .flyer { transition: none; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <span class="lv" id="lv">1단계</span>
    <span class="goal" aria-label="단계 진행"><i id="goalBar"></i></span>
    <span class="stat" aria-label="손님 진행">🧾<b class="num" id="prog">0/6</b></span>
    <span class="tools">
      <button class="tool" id="btnSound" type="button" aria-label="소리 켜고 끄기">🔊</button>
      <button class="tool" id="btnPause" type="button" aria-label="일시정지와 도감">⏸</button>
    </span>
  </header>
  <div class="sub"><span class="num">💰 <b id="score">0</b></span><span class="chain" id="chain"></span><span class="left" id="left"></span></div>

  <section class="rail" id="rail" aria-label="클라이언트"></section>
  <div class="stock" id="stock" aria-label="남은 부품"></div>
  <div class="boardwrap"><div class="board" id="board" aria-label="부품 보드"><div class="clip" id="clip"></div><canvas class="fxc" id="fxc"></canvas></div></div>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>

<script>
// 보드 순수 로직 (렌더링·애니메이션 없음). 셀 인덱스 idx = r * cols + c.
// 타일 객체는 로직 필드(type, special)와 렌더용 필드(x, y, scale ...)를 함께 가진다.

let nextId = 1;

function makeTile(type, special = false, r = 0, c = 0) {
  return {
    id: nextId++,
    type,          // characters 배열 인덱스
    special,
    x: c, y: r,    // 셀 단위 렌더 위치
    scale: 1, sx: 1, sy: 1, alpha: 1, jx: 0,
    // 표정·몸짓 (faces.js)
    expr: 'smirk', exprUntil: 0, exprPrio: 0, flip: false,
    ox: 0, oy: 0, rot: 0, motion: 0, nextIdle: 0, phase: Math.random() * Math.PI * 2,
  };
}

class Board {
  constructor(cols, rows, types, rng = Math.random) {
    this.cols = cols;
    this.rows = rows;
    this.types = types;
    this.rng = rng;
    this.cells = new Array(cols * rows).fill(null);
  }

  idx(r, c) { return r * this.cols + c; }
  rc(idx) { return [Math.floor(idx / this.cols), idx % this.cols]; }
  inBounds(r, c) { return r >= 0 && r < this.rows && c >= 0 && c < this.cols; }
  get(r, c) { return this.inBounds(r, c) ? this.cells[this.idx(r, c)] : null; }
  // noMatch 아이템(시한폭탄·비둘기 민병대)은 어떤 것과도 매치되지 않는다 (드론은 드론끼리 매치됨)
  typeAt(r, c) { const t = this.get(r, c); return t && !t.noMatch ? t.type : -1; }

  randomType() { return this.types[Math.floor(this.rng() * this.types.length)]; }

  // 매치 없이 + 가능한 수가 하나 이상 있는 보드 생성
  fillInitial() {
    for (let attempt = 0; attempt < 200; attempt++) {
      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          let type, guard = 0;
          do {
            type = this.randomType();
            guard++;
          } while (guard < 50 && this.makesRunWhenPlaced(r, c, type));
          this.cells[this.idx(r, c)] = makeTile(type, false, r, c);
        }
      }
      if (this.findMatches().groups.length === 0 && this.findMove()) return;
    }
  }

  // (r,c)에 type을 놓으면 왼쪽 두 칸 또는 위쪽 두 칸과 3연속이 되는지
  makesRunWhenPlaced(r, c, type) {
    if (c >= 2 && this.typeAt(r, c - 1) === type && this.typeAt(r, c - 2) === type) return true;
    if (r >= 2 && this.typeAt(r - 1, c) === type && this.typeAt(r - 2, c) === type) return true;
    return false;
  }

  swap(a, b) {
    const ia = this.idx(a.r, a.c), ib = this.idx(b.r, b.c);
    const t = this.cells[ia];
    this.cells[ia] = this.cells[ib];
    this.cells[ib] = t;
  }

  // 가로/세로 3개 이상 연속 동일 인물. 겹치는(같은 셀 공유) 런은 한 그룹으로 합친다.
  findMatches() {
    const n = this.cells.length;
    const parent = new Int32Array(n).fill(-1);
    const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[rb] = ra; };
    const mark = (list) => {
      for (const i of list) if (parent[i] === -1) parent[i] = i;
      for (let k = 1; k < list.length; k++) union(list[0], list[k]);
    };

    const scan = (outer, inner, at) => {
      for (let o = 0; o < outer; o++) {
        let run = [];
        let runType = -1;
        for (let i = 0; i <= inner; i++) {
          const idx = i < inner ? at(o, i) : -1;
          const type = idx >= 0 && this.cells[idx] && !this.cells[idx].noMatch ? this.cells[idx].type : -1;
          if (type !== -1 && type === runType) {
            run.push(idx);
          } else {
            if (run.length >= 3) mark(run);
            run = type === -1 ? [] : [idx];
            runType = type;
          }
        }
      }
    };
    scan(this.rows, this.cols, (r, c) => this.idx(r, c));
    scan(this.cols, this.rows, (c, r) => this.idx(r, c));

    const byRoot = new Map();
    for (let i = 0; i < n; i++) {
      if (parent[i] === -1) continue;
      const root = find(i);
      if (!byRoot.has(root)) byRoot.set(root, { type: this.cells[i].type, cells: [] });
      byRoot.get(root).cells.push(i);
    }
    const groups = [...byRoot.values()];
    const matched = new Set();
    for (const g of groups) for (const i of g.cells) matched.add(i);
    return { groups, matched };
  }

  // (r,c)를 포함하는 3연속이 있는지
  hasMatchAt(r, c) {
    const type = this.typeAt(r, c);
    if (type === -1) return false;
    let h = 1, v = 1;
    for (let k = c - 1; this.typeAt(r, k) === type; k--) h++;
    for (let k = c + 1; this.typeAt(r, k) === type; k++) h++;
    for (let k = r - 1; this.typeAt(k, c) === type; k--) v++;
    for (let k = r + 1; this.typeAt(k, c) === type; k++) v++;
    return h >= 3 || v >= 3;
  }

  wouldMatch(a, b) {
    if (!this.get(a.r, a.c) || !this.get(b.r, b.c)) return false;
    this.swap(a, b);
    const ok = this.hasMatchAt(a.r, a.c) || this.hasMatchAt(b.r, b.c);
    this.swap(a, b);
    return ok;
  }

  // a↔b를 바꾸면 한 줄로 맞춰지는 칸들 [{ r, c }] (바꾼 뒤 위치 기준)
  matchCellsFor(a, b) {
    if (!this.get(a.r, a.c) || !this.get(b.r, b.c)) return [];
    this.swap(a, b);
    const out = new Map();
    for (const p of [a, b]) {
      const type = this.typeAt(p.r, p.c);
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const run = [p];
        for (let k = 1; this.typeAt(p.r - dr * k, p.c - dc * k) === type; k++) run.push({ r: p.r - dr * k, c: p.c - dc * k });
        for (let k = 1; this.typeAt(p.r + dr * k, p.c + dc * k) === type; k++) run.push({ r: p.r + dr * k, c: p.c + dc * k });
        if (run.length >= 3) for (const q of run) out.set(q.r * this.cols + q.c, q);
      }
    }
    this.swap(a, b);
    return [...out.values()];
  }

  // 가능한 수 목록 (없으면 빈 배열)
  allMoves() {
    const moves = [];
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const a = { r, c };
        if (c + 1 < this.cols && this.wouldMatch(a, { r, c: c + 1 })) moves.push([a, { r, c: c + 1 }]);
        if (r + 1 < this.rows && this.wouldMatch(a, { r: r + 1, c })) moves.push([a, { r: r + 1, c }]);
      }
    }
    return moves;
  }

  findMove() {
    const moves = this.allMoves();
    return moves.length ? moves[Math.floor(this.rng() * moves.length)] : null;
  }

  // 빈칸을 아래로 채우고 위에서 새 타일 생성.
  // 반환: [{ tile, c, fromY, toR }] — fromY가 음수면 보드 위에서 새로 생긴 타일
  collapse() {
    const falls = [];
    for (let c = 0; c < this.cols; c++) {
      let write = this.rows - 1;
      for (let r = this.rows - 1; r >= 0; r--) {
        const t = this.cells[this.idx(r, c)];
        if (!t) continue;
        if (write !== r) {
          this.cells[this.idx(write, c)] = t;
          this.cells[this.idx(r, c)] = null;
          falls.push({ tile: t, c, fromY: r, toR: write });
        }
        write--;
      }
      const empty = write + 1;
      for (let r = write; r >= 0; r--) {
        const t = makeTile(this.randomType(), false, r - empty, c);
        this.cells[this.idx(r, c)] = t;
        falls.push({ tile: t, c, fromY: r - empty, toR: r });
      }
    }
    return falls;
  }

  // 타일 객체를 섞어 재배치. 매치 없음 + 가능한 수 있음이 될 때까지.
  shuffle() {
    const tiles = this.cells.filter(Boolean);
    for (let attempt = 0; attempt < 300; attempt++) {
      for (let i = tiles.length - 1; i > 0; i--) {
        const j = Math.floor(this.rng() * (i + 1));
        [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
      }
      tiles.forEach((t, i) => { this.cells[i] = t; });
      if (this.findMatches().groups.length === 0 && this.findMove()) return;
    }
    // 드물게 실패하면 일반 타일의 인물을 새로 뽑는다
    for (let attempt = 0; attempt < 300; attempt++) {
      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          const t = this.cells[this.idx(r, c)];
          if (t.special) continue;
          this.cells[this.idx(r, c)] = null;
          let guard = 0, type;
          do { type = this.randomType(); guard++; } while (guard < 50 && this.makesRunWhenPlaced(r, c, type));
          t.type = type;
          this.cells[this.idx(r, c)] = t;
        }
      }
      if (this.findMatches().groups.length === 0 && this.findMove()) return;
    }
  }
}

// ───────── 연출 엔진: 트윈 + 파티클 캔버스 + 화면 흔들림 (Bosses of Our World의 fx/tween 방식을 따라함) ─────────

const rand = (a, b) => a + Math.random() * (b - a);

function fxBurst(x, y, color, count, speed = 1) {

}
function fxDust(x, y) {

}
function fxRing(x, y, r0, r1, dur, w = 3, rgb = '255,255,255') { if (JUICE > 0) FX.rings.push({ x, y, r0, r1, dur: dur / 1000, w, rgb, t: 0 }); }
function fxText(x, y, str, size, color) { if (JUICE > 0) FX.texts.push({ x, y, str, size, color, t: 0, dur: 0.9 }); }
// 보드 흔들림은 쓰지 않음 (타일이 흔들리지 않게). 호출은 남겨 두고 아무것도 안 함

function vibrate(p) { if (JUICE > 0 && navigator.vibrate) { try { navigator.vibrate(p); } catch (_) {} } }
function fxUpdate(s) {

function fxDraw() {

// ───────── 보드 그리기: 타일은 DOM, 위치·크기·번쩍임은 매 프레임 타일 상태로 ─────────
let geo = { size: 0, step: 0, pad: 0 };

function layout() {

  const W = el.clientWidth, H = el.clientHeight;
  const pad = 6, gap = 5;
  const size = Math.min((W - pad * 2 - gap * (COLS - 1)) / COLS, (H - pad * 2 - gap * (ROWS - 1)) / ROWS);
  geo = { size, step: size + gap, pad };
  $('clip').querySelectorAll('.cellbg').forEach(x => x.remove());
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const b = document.createElement('div');
    b.className = 'cellbg';
    Object.assign(b.style, { left: pad + c * geo.step + 'px', top: pad + r * geo.step + 'px', width: size + 'px', height: size + 'px' });
    $('clip').prepend(b);
  }
  tileEls.forEach(e => sizeTile(e));
  const cv = $('fxc'), dpr = devicePixelRatio || 1;
  cv.style.width = (W + FX.M * 2) + 'px'; cv.style.height = (H + FX.M * 2) + 'px';
  cv.width = Math.round((W + FX.M * 2) * dpr); cv.height = Math.round((H + FX.M * 2) * dpr);

}

function slide(t, r, c, ms) {

}

  S.busy = true; S.sel = null; S.idle = 0; clearHint(); renderBoard();
  const ta = S.board.get(a.r, a.c), tb = S.board.get(b.r, b.c);
  SFX.swap();
  if (!S.board.wouldMatch(a, b)) {
    await Promise.all([slide(ta, b.r, b.c, 110), slide(tb, a.r, a.c, 110)]);
    SFX.nope();
    await Promise.all([slide(ta, a.r, a.c, 130), slide(tb, b.r, b.c, 130)]);

}
function popTile(t) {

// 맞춘 부품: 타일에서 위로 떠올라 → 화면 가운데 크게 → 작아지며 클라이언트 말풍선 칸으로 날아가 붙음
const flying = { n: 0 };
async function showcase(p, x0, y0, delay) {
  const claim = claimNeed(p);

  el.innerHTML = `${TILES[p].icon}<b>${TILES[p].name}</b>`;
  const set = (x, y, s) => { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = `translate(-50%, -50%) scale(${s})`; };
  set(x0, y0, 1);

  await wait(delay);
  document.body.appendChild(el);
  const k = flying.n;
  const midX = innerWidth / 2 + ((k % 3) - 1) * 70, midY = innerHeight * 0.42;
  await tween(150, q => set(x0, y0 - 34 * q, 1 + 0.4 * q), EASE.outQuad);
  await tween(220, q => set(x0 + (midX - x0) * q, y0 - 34 + (midY - y0 + 34) * q, 1.4 + 1.8 * q), EASE.outQuad);
  SFX.part();
  await wait(170);
  // 날아갈 곳: 받을 손님의 말풍선 칸, 없으면 재고
  const live = claim && claim.c === S.slots[claim.i] && claim.c.state === 'wait';
  const target = live ? document.querySelector(`[data-slot="${claim.i}"] [data-need="${claim.k}"]`) : $('stock');
  const [tx, ty] = target ? centerOf(target) : [midX, 30];
  await tween(300, q => set(midX + (tx - midX) * q, midY + (ty - midY) * q, 3.2 - 2.6 * q), EASE.inQuad);
  el.remove();
  flying.n--;
  if (live && claim.c.state === 'wait') {
    claim.c.needs[claim.k].got = true;
    SFX.stick();
    const face = document.querySelector(`[data-slot="${claim.i}"]`);
    renderClients();
    document.querySelector(`[data-slot="${claim.i}"]`)?.classList.add('bump');
    setTimeout(() => document.querySelector(`[data-slot="${claim.i}"]`)?.classList.remove('bump'), 200);
    if (claim.c.needs.every(nd => nd.got)) complete(claim.i);

  }
}

async function resolve() {
  let chain = 0;
  for (;;) {
    const m = S.board.findMatches();
    if (!m.groups.length) break;
    chain++;
    S.chainMax = Math.max(S.chainMax, chain);
    const bigGroups = m.groups.filter(g => g.cells.length >= 4);
    // 히트스톱: 연쇄나 4개 이상이면 터지기 직전 아주 잠깐 멈춤
    if (JUICE > 0 && (chain >= 2 || bigGroups.length)) await wait(35 * JUICE);
    SFX.match(chain - 1); vibrate(10);
    let sx = 0, sy = 0;
    for (const i of m.matched) { const [r, c] = S.board.rc(i); sx += cx(c); sy += cy(r); }
    if (chain >= 2) { fxText(sx / m.matched.size, sy / m.matched.size, `x${chain}`, 30 + chain * 8, '#FFD84A'); $('chain').textContent = `연쇄 ×${chain}`; }
    let order = 0;
    for (const g of m.groups) {
      // 3개 = 부품 1, 4개 = 2, 5개 이상 = 3
      const gain = Math.min(3, g.cells.length - 2);
      const mid = g.cells[Math.floor(g.cells.length / 2)];
      const midEl = tileEls.get(S.board.cells[mid]);
      const [x0, y0] = midEl ? centerOf(midEl) : [innerWidth / 2, innerHeight / 2];
      for (let k = 0; k < gain; k++) showcase(g.type, x0, y0, (order++) * 140);
      const pts = 10 * g.cells.length * chain;
      S.score += pts;
      let gx = 0, gy = 0;
      g.cells.forEach(i => { const [r, c] = S.board.rc(i); gx += cx(c); gy += cy(r); });
      fxText(gx / g.cells.length, gy / g.cells.length + (chain >= 2 ? 26 : 0), gain > 1 ? `${TILES[g.type].icon}×${gain}` : `+${pts}`, gain > 1 ? 26 : 18, gain > 1 ? '#FFD84A' : '#ffffff');
    }
    const doomed = [...m.matched].map(i => S.board.cells[i]);
    await Promise.all(doomed.map(popTile));
    for (const i of m.matched) S.board.cells[i] = null;
    renderBoard();
    renderHud();
    const falls = S.board.collapse();
    // 4개 이상 맞춘 줄마다 휴머노이드가 하나씩 위에서 내려옴
    for (const g of bigGroups) {
      const cols = new Set(g.cells.map(i => S.board.rc(i)[1]));
      const cand = falls.filter(f => f.fromY < 0 && f.tile.type !== 'hum' && cols.has(f.c));
      const pick = (cand.length ? cand : falls.filter(f => f.fromY < 0 && f.tile.type !== 'hum'))[0];
      if (pick) {
        pick.tile.type = 'hum';
        SFX.hum();
        const W = $('board').clientWidth;
        fxText(Math.min(Math.max(cx(pick.c), 90), W - 90), cy(0) + 10, '🤖 휴머노이드 투입!', 18, '#FFD84A');
      }
    }
    await animateFalls(falls);
  }
  setTimeout(() => { $('chain').textContent = ''; }, 700);
  if (!S.board.findMove()) {
    banner('🔀 섞는 중');
    await wait(400);
    S.board.shuffle();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const t = S.board.get(r, c); t.x = c; t.y = r; }
    renderBoard();
  }
}
// 손님이 필요로 하는 부품이 조금 더 자주 떨어짐 (휴머노이드는 여기서 안 나옴)
function biasedType() {
  const need = waiting().flatMap(c => c.needs.filter(n => !n.res).map(n => n.p)).filter(p => S.def.tiles.includes(p));
  if (need.length && Math.random() < 0.3) return need[Math.floor(Math.random() * need.length)];
  return S.def.tiles[Math.floor(Math.random() * S.def.tiles.length)];
}

// 오래 손을 안 대면 맞출 수 있는 두 칸을 반짝임
let hintCells = [];
function clearHint() { hintCells.forEach(t => tileEls.get(t)?.classList.remove('hint')); hintCells = []; }
function showHint() {
  const mv = S.board.findMove();
  if (!mv) return;
  hintCells = mv.map(p => S.board.get(p.r, p.c)).filter(Boolean);
  hintCells.forEach(t => tileEl(t).classList.add('hint'));
}

// ───────── 입력: 끌어서 스왑, 또는 두 칸 차례로 탭 ─────────
let drag = null;
function cellAt(x, y) {
  const r0 = $('board').getBoundingClientRect();
  const c = Math.floor((x - r0.left - geo.pad + 2) / geo.step), r = Math.floor((y - r0.top - geo.pad + 2) / geo.step);
  return r >= 0 && r < ROWS && c >= 0 && c < COLS ? { r, c } : null;
}
const adjacent = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
$('board').addEventListener('pointerdown', e => {
  if (!S.running || S.paused || S.busy) return;
  const cell = cellAt(e.clientX, e.clientY);
  if (!cell) return;
  if (S.sel && adjacent(S.sel, cell)) { const a = S.sel; S.sel = null; trySwap(a, cell); return; }
  const same = S.sel && S.sel.r === cell.r && S.sel.c === cell.c;
  S.sel = same ? null : cell;
  renderBoard();
  drag = { cell, x: e.clientX, y: e.clientY, id: e.pointerId };
  try { $('board').setPointerCapture(e.pointerId); } catch (_) {}
});
$('board').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < geo.step * 0.3) return;
  const { r, c } = drag.cell;
  const to = Math.abs(dx) > Math.abs(dy) ? { r, c: c + Math.sign(dx) } : { r: r + Math.sign(dy), c };
  drag = null; S.sel = null;
  if (S.board.inBounds(to.r, to.c)) trySwap({ r, c }, to); else renderBoard();
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
$('board').addEventListener('pointerup', endDrag);
$('board').addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => { if (S.board) { layout(); renderBoard(); } });

// ───────── 효과 ─────────
function centerOf(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function floatText(el, text, kind) {
  if (!el) return;
  const [x, y] = centerOf(el);
  const f = document.createElement('div');
  f.className = 'float' + (kind ? ' ' + kind : ''); f.textContent = text;
  f.style.left = x + 'px'; f.style.top = (y - 20) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 950);
}
function fly(fromEl, toEl, icon) {
  if (!fromEl || !toEl) return;
  const [x0, y0] = centerOf(fromEl), [x1, y1] = centerOf(toEl);
  const f = document.createElement('div');
  f.className = 'flyer'; f.textContent = icon;
  f.style.left = x0 + 'px'; f.style.top = y0 + 'px';
  document.body.appendChild(f);
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.left = x1 + 'px'; f.style.top = y1 + 'px'; f.style.transform = 'translate(-50%, -50%) scale(.7)'; }));
  setTimeout(() => f.remove(), 340);
}
function banner(text, delay) {
  setTimeout(() => {
    const b = document.createElement('div');
    b.className = 'banner'; b.textContent = text;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1250);
  }, delay || 0);
}

// ───────── 진행 ─────────
function loop(t) {
  const dt = Math.min(0.1, (t - (S.last || t)) / 1000);
  S.last = t;
  if (S.running && !S.paused) {
    S.clock += dt;
    clientTick(dt);
    if (S.running) spawnTick(dt);
    updateBars();
    if (!S.busy && (S.idle += dt) > 6 && !hintCells.length) showHint();
  }
  updateTweens(dt * 1000);
  fxUpdate(dt);
  if (S.board) drawTiles();
  fxDraw();
  requestAnimationFrame(loop);
}
function startLevel() {
  S.def = levelDef(S.lv);
  Object.assign(S, { running: true, paused: false, busy: false, slots: [null, null, null], spawned: 0, done: 0, missed: 0, spawnT: 0, stock: {}, sel: null, idle: 0 });
  $('overlay').hidden = true;
  clearBoardEls();
  S.board = new Board(COLS, ROWS, S.def.tiles);
  S.board.randomType = biasedType;
  S.board.fillInitial();
  layout(); renderBoard();
  renderClients(); renderStock(); renderHud();
  banner(`${S.lv}단계`);
  const fresh = NEW_AT[S.lv];
  if (fresh) banner(`NEW ${fresh.map(r => ROBOTS[r].icon).join(' ')}`, 1100);
  addClient(0);
  S.spawnT = 2;
}
function levelClear() {
  if (!S.running) return;
  S.running = false;
  const n = levelTarget(S.lv);
  const stars = S.missed === 0 ? 3 : S.missed <= Math.ceil(n * 0.2) ? 2 : 1;
  const bonus = stars * 300;
  S.score += bonus; S.best = Math.max(S.best, S.score); save();
  SFX.clear();
  banner(`CLEAR ${'⭐'.repeat(stars)} +${bonus}`);
  S.lv++;
  setTimeout(() => { if (!S.paused) startLevel(); else S.pendingStart = true; }, 2400);
  renderHud();
}

// ───────── 오버레이 ─────────
const litSectors = () => new Set([...S.dex].map(id => secKey(O[id])));
const logItem = o => `<div class="log-item"><span class="i">${o.icon}</span><span class="h">${o.who} ${ROBOTS[o.want].icon}<small>${o.sec}</small></span><span>${o.fact}</span></div>`;
const mapHtml = () => { const lit = litSectors(); return `<div class="map">${SECTORS.map(s => `<div class="sector${lit.has(s.key) ? ' lit' : ''}"><small>${s.key}</small>${s.icon}</div>`).join('')}</div>`; };
const recipesHtml = () => `<div class="recipes">${Object.values(ROBOTS).map(r => `<span>${r.parts.map(p => TILES[p].icon).join('')}${r.parts.length === 1 ? '×3' : ''} = ${r.icon} ${r.name}</span>`).join('')}</div>`;
function openSheet(html, pause) {
  $('sheet').innerHTML = html;
  $('overlay').hidden = false;
  $('sheet').scrollTop = 0;
  if (pause) S.paused = true;
  $('sheet').querySelector('button')?.focus();
}
function resume() {
  $('overlay').hidden = true; S.paused = false;
  if (S.pendingStart) { S.pendingStart = false; startLevel(); }
}
const HELP = `
  <h2>로봇 SI 납품소</h2>
  <div class="steps">
    <div class="step">💬 <span>클라이언트가 말풍선으로 로봇을 주문해요</span></div>
    <div class="step">🛞🛞🛞 <span>같은 부품 3개를 맞추면 말풍선으로 날아가 붙어요</span></div>
    <div class="step">🤖 <span>4개 이상 맞추면 휴머노이드가 하나 내려와요. 휴머노이드 3개를 맞추면 휴머노이드 납품!</span></div>
  </div>
  <p>처음엔 웃으며 기다리던 손님도 오래 걸리면 찌푸리고, 바가 다 떨어지면 "계약은 없던 걸로 하죠!" 하고 떠나요. 휴머노이드 손님은 아주 오래 기다려줘요.</p>
  ${recipesHtml()}
  <button class="primary" type="button" data-act="begin">시작 ▶</button>`;
function summaryHtml() {
  const seen = [...new Set(S.runServed)].map(id => logItem(O[id])).join('');
  return `
    <h2>⏸ ${S.lv}단계</h2>
    <div class="big-stats"><span>💰<b class="num">${S.score}</b></span><span>🏆<b class="num">${S.best}</b></span><span>⛓<b class="num">${S.chainMax}</b></span></div>
    <button class="primary" type="button" data-act="close">계속 ▶</button>
    <span class="lbl">조합표</span>${recipesHtml()}
    <span class="lbl">산업 지도 ${litSectors().size}/${SECTORS.length}</span>${mapHtml()}
    <span class="lbl">현장 도감 ${S.dex.size}/${ORDERS.length}</span>
    <div class="log">${ORDERS.map(o => S.dex.has(o.id) ? logItem(o) : `<div class="log-item locked"><span class="i">❔</span><span class="h">???<small>${o.sec}</small></span><span>아직 납품 전</span></div>`).join('')}</div>
    <p>출처: 로봇 스터디 2차 발제 자료 (2026.09.21). 매치3 보드 로직은 Bosses of Our World에서 가져왔어요.</p>`;
}
$('sheet').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') resume();
  else if (act === 'begin') startLevel();
});
$('btnPause').addEventListener('click', () => { if ($('overlay').hidden && S.running) openSheet(summaryHtml(), true); });
const syncSound = () => { $('btnSound').textContent = S.sound ? '🔊' : '🔇'; };
$('btnSound').addEventListener('click', () => {
  S.sound = !S.sound; syncSound();
  try { localStorage.setItem('robotsi.sound', S.sound ? '1' : '0'); } catch (e) {}
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) $('btnPause').click(); });

syncSound(); renderHud();
openSheet(HELP);
requestAnimationFrame(loop);
</script>
