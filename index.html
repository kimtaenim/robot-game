<title>로봇 SI 납품소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 손님 줄 → 현장 소식 → 작업대(머지 보드, 안전 줄무늬) → 스토리지 선반. 한 화면 안에서 계속 흘러가는 작업장 */
:root {
  --bg: #E7ECEF;
  --surface: #FFFFFF;
  --surface-2: #F2F5F7;
  --ink: #13202A;
  --muted: #586977;
  --line: #CBD5DC;
  --accent: #F0B400;
  --steel: #1C5A86;
  --steel-soft: #DCE8F1;
  --good: #24804D;
  --bad: #C03A2A;
  --on-color: #FFFFFF;
  --scrim: rgba(12, 20, 27, 0.55);
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151A; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0; --muted: #91A2AF;
    --line: #2E3B47; --accent: #F5C12B; --steel: #72AEDC; --steel-soft: #1D3346; --good: #3FA86C;
    --bad: #E0594A; --on-color: #0F151A; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151A; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0; --muted: #91A2AF;
  --line: #2E3B47; --accent: #F5C12B; --steel: #72AEDC; --steel-soft: #1D3346; --good: #3FA86C;
  --bad: #E0594A; --on-color: #0F151A; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }

.app { box-sizing: border-box; height: 100%; max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; }

/* 상단 바 */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 20px; }
.stats { display: flex; gap: 12px; margin-left: auto; font-size: 13px; align-items: baseline; }
.stats .lbl { color: var(--muted); font-size: 11px; margin-right: 3px; }
.tools { display: flex; gap: 6px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; }

/* 콤보 */
.flow { display: flex; align-items: center; gap: 8px; }
.flow .meter { flex: 1; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.flow .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
.flow b { font-family: var(--font-display); font-weight: 400; font-size: 16px; min-width: 64px; text-align: right; color: var(--muted); }
.flow b.hot { color: var(--steel); }

/* 손님 줄 */
.clients-head { display: flex; justify-content: space-between; align-items: baseline; }
.backlog { font-size: 11px; color: var(--muted); }
.clients { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; min-height: 128px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card.empty { align-items: center; justify-content: center; color: var(--muted); font-size: 12px; border-style: dashed; background: transparent; cursor: default; }
.card .c-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.card .c-icon { font-size: 22px; line-height: 1; }
.card .c-sec { font-size: 10px; color: var(--steel); font-weight: 700; text-align: right; }
.card .c-who { font-weight: 700; font-size: 13px; line-height: 1.25; }
.card .c-ask { font-size: 11.5px; line-height: 1.4; opacity: 0.85; }
.card.target { border-color: var(--steel); box-shadow: 0 0 0 2px var(--steel); }
.card.enter { animation: enter .35s ease-out; }
.card.shake { animation: shake .4s; }
@keyframes enter { from { transform: translateY(-12px); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* 현장 소식 */
.ticker { font-size: 12px; line-height: 1.5; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-height: 2.6em; }
.ticker b { color: var(--steel); }

/* 작업대 */
.bench { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stripe { height: 7px; background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, var(--ink) 10px 20px); }
.bench-in { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.bench-head { display: flex; align-items: center; gap: 8px; }
.bench-head .hint { font-size: 11.5px; color: var(--muted); flex: 1; min-width: 0; }
.trash { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cell { height: 70px; border: 2px dashed var(--line); border-radius: 10px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; touch-action: none; padding: 0; }
.cell.part { border-style: solid; background: var(--surface-2); }
.cell.robot { border-style: solid; border-color: var(--steel); background: var(--steel-soft); color: var(--ink); }
.cell .ic { font-size: 28px; line-height: 1; }
.cell.sel { outline: 3px solid var(--accent); outline-offset: 1px; transform: translateY(-2px); }
.cell.drop { border-color: var(--accent); }
.cell.dim { opacity: .35; }
.cell.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.recipes { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }
.recipes span b { color: var(--ink); font-weight: 700; }

/* 스토리지 */
.storage { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.parts { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.part-btn { background: var(--surface); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 10px; padding: 6px 1px 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; touch-action: none; }
.part-btn .ic { font-size: 24px; line-height: 1.1; }
.part-btn .nm { font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.ghost { position: fixed; z-index: 40; pointer-events: none; font-size: 34px; transform: translate(-50%, -60%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }

/* 알림 */
.toast { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); max-width: min(90vw, 460px); padding: 11px 15px; border-radius: 10px; font-size: 13.5px; line-height: 1.45; font-weight: 500; color: var(--on-color); background: var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,.25); pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 20; }
.toast.show { opacity: 1; }
.toast.good { background: var(--good); }
.toast.bad { background: var(--bad); }

/* 오버레이 */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; width: 100%; max-width: 540px; max-height: 86%; overflow: auto; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; user-select: text; -webkit-user-select: text; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; text-wrap: balance; }
.sheet h3 { font-size: 13px; margin: 6px 0 0; color: var(--muted); letter-spacing: .06em; }
.sheet p { margin: 0; font-size: 14px; line-height: 1.6; }
.sheet ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.65; }
.big-stats { display: flex; gap: 18px; flex-wrap: wrap; }
.big-stats div { display: flex; flex-direction: column; }
.big-stats span { font-size: 11px; color: var(--muted); }
.big-stats b { font-size: 22px; }
.log { display: grid; gap: 8px; }
.log-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.55; background: var(--surface-2); }
.log-item .hd { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; margin-bottom: 3px; }
.log-item .hd b { font-size: 14px; }
.log-item .hd small { color: var(--steel); font-weight: 700; font-size: 11px; }
.log-item .hd em { font-style: normal; color: var(--muted); font-size: 11px; margin-left: auto; }
.log-item.locked { color: var(--muted); border-style: dashed; background: transparent; }
.primary { align-self: flex-start; background: var(--accent); color: #1A1400; border: 0; border-radius: 10px; padding: 11px 20px; font-weight: 700; font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  .card.enter, .card.shake, .cell.pop { animation: none; }
  .toast { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">로봇 SI 납품소</div>
    <div class="stats">
      <span><span class="lbl">근무</span><b class="num" id="clock">3:00</b></span>

<script>
// ───────── 그래픽 목록: 부품 7 + 로봇 6 = 13종. 아이콘은 임시 이모지, 나중에 이미지로 교체 ─────────
const ITEMS = {

  quad:  { kind: 'robot', icon: '🐕', name: '4족보행' },
  hum:   { kind: 'robot', icon: '🚶', name: '휴머노이드' },
};
const PART_IDS = ['wheel', 'lidar', 'tape', 'arm', 'tool', 'legs', 'torso'];
const RECIPES = [
  ['wheel', 'tape', 'agv'],
  ['wheel', 'lidar', 'amr'],
  ['arm', 'tool', 'cobot'],
  ['amr', 'cobot', 'mm'],
  ['legs', 'lidar', 'quad'],
  ['legs', 'torso', 'hum'],
];
const recipe = (a, b) => (RECIPES.find(([x, y]) => (x === a && y === b) || (x === b && y === a)) || [])[2] || null;

// ───────── 고객 주문 (출처: 로봇 스터디 2차 발제 자료, 2026.09.21) ─────────
// want = 원하는 로봇, why = 틀렸을 때 보여주는 설명
const ORDERS = [
  // AGV
  { id: 'port', want: 'agv', icon: '⚓', who: '부산항 신항', sec: '⑮ 항만', when: '2026.05',
    ask: '자동화 부두에서 시스템 지시대로 컨테이너 이송',
    why: '새로 짓는 자동화 부두는 바닥 경로를 깔 수 있어요. 정해진 길을 다니는 AGV면 돼요',
    fact: '국내 첫 완전 자동화 부두에서 터미널운영시스템 지시에 따라 AGV가 컨테이너 크레인과 야드 크레인 사이를 오가요. 2018년 노조가 대량 실직을 우려하자 해수부는 노사정 협의체를 꾸리고 진행했어요.' },
  { id: 'kai', want: 'agv', icon: '🛩️', who: 'KAI 사천공장', sec: '⑨ 항공기 제조', when: '2019.07',
    ask: '날개 천공 공정 사이로 자재를 정해진 길로 운반',

  // AMR
  { id: 'transys', want: 'amr', icon: '🚚', who: '현대트랜시스 앨라배마', sec: '② AMR', when: '2024.07',
    ask: '가동 중인 기존 공장에서 300kg 부품 운반. 바닥 공사는 못 해요',
    why: '기존 공장(브라운필드)은 바닥 공사가 어려워요. 바닥 경로가 필요한 AGV 말고, 스스로 길을 찾는 AMR이에요',

  { id: 'delivery', want: 'amr', icon: '🛵', who: '뉴빌리티', sec: '⑬ 배달', when: '2024.12',

  { id: 'parking', want: 'amr', icon: '🚗', who: '현대위아', sec: '⑭ 주차', when: '2026.08',

}
function renderHud() {
  const t = Math.max(0, Math.ceil(S.time));
  $('clock').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  $('count').textContent = S.served.length;
  $('score').textContent = S.score;
  $('combo').textContent = `콤보 ${S.combo}`;
  $('combo').classList.toggle('hot', S.combo >= 2);
  $('flowBar').style.width = (S.combo ? Math.max(0, S.comboT / COMBO_SEC) * 100 : 0).toFixed(1) + '%';
  $('btnDex').textContent = `도감 ${S.dex.size}/${ORDERS.length}`;
}

let toastTimer = 0;
function toast(msg, kind) {
  const el = $('toast');
  el.textContent = msg;
  el.className = `toast show ${kind || ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'bad' ? 3000 : 1800);
}

// ───────── 작업대 동작 ─────────
const firstEmpty = () => S.board.findIndex(x => !x);
function placePart(part, at) {
  const i = at ?? firstEmpty();
  if (i < 0) { toast('작업대가 꽉 찼어요. 🗑에 끌어다 버리세요'); return; }
  S.board[i] = part; renderBoard(i);
}
function mergeInto(target, incoming, fromCell) {
  const r = recipe(S.board[target], incoming);
  if (!r) return false;
  if (fromCell !== undefined) S.board[fromCell] = null;
  S.board[target] = r; S.sel = null;
  renderBoard(target);
  return true;
}
function cellToCell(from, to) {
  if (from === to) return;
  if (!S.board[to]) { S.board[to] = S.board[from]; S.board[from] = null; S.sel = null; renderBoard(); return; }
  if (mergeInto(to, S.board[from], from)) return;
  toast(`${label(S.board[from])} + ${label(S.board[to])}: 조립표에 없는 조합이에요`);
  [S.board[from], S.board[to]] = [S.board[to], S.board[from]];
  S.sel = null; renderBoard();
}
function tapCell(i) {
  if (S.sel === null) { if (S.board[i]) { S.sel = i; renderBoard(); } return; }
  if (S.sel === i) { S.sel = null; renderBoard(); return; }
  if (!S.board[i]) { cellToCell(S.sel, i); return; }
  if (mergeInto(i, S.board[S.sel], S.sel)) return;
  S.sel = i; renderBoard();
}
function tapPart(part) {
  if (S.sel !== null && S.board[S.sel] && mergeInto(S.sel, part)) return;
  placePart(part);
}
function trash(i) {
  if (i === null || !S.board[i]) { toast('버릴 것을 먼저 고르거나 🗑에 끌어다 놓으세요'); return; }
  S.board[i] = null; S.sel = null; renderBoard();
}
function deliver(cell, ci) {
  const c = S.clients[ci];
  const id = S.board[cell];
  if (!c || !id) return;
  if (ITEMS[id].kind === 'part') { toast('부품은 납품할 수 없어요. 조립해서 로봇으로 만들어 주세요'); return; }
  const o = c.order;
  if (id !== o.want) {
    toast(`${o.icon} ${o.who}: ${o.why}`, 'bad');
    const card = document.querySelector(`.card[data-client="${ci}"]`);
    if (card) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
    return;
  }
  S.combo = S.comboT > 0 ? S.combo + 1 : 1;
  S.comboT = COMBO_SEC;
  S.best = Math.max(S.best, S.combo);
  const waited = (SHIFT_SEC - S.time) - c.born;
  const mult = Math.min(3, 1 + 0.25 * (S.combo - 1));
  const gain = Math.round(100 * mult) + (waited < 10 ? 50 : 0);
  S.score += gain;
  S.served.push(o.id);
  S.dex.add(o.id); saveDex();
  S.board[cell] = null; S.sel = null;
  S.clients.splice(ci, 1);
  if (S.backlog.length) S.clients.push(S.backlog.shift());
  if (!S.clients.length) S.spawnT = Math.min(S.spawnT, 0.8);
  $('ticker').innerHTML = `<b>${o.icon} ${o.who}</b> · ${o.fact}`;
  toast(`✅ ${ITEMS[id].name} 납품 +${gain}${S.combo >= 2 ? ` · 콤보 ${S.combo}` : ''}`, 'good');
  renderClients(); renderBoard(); renderHud();
}

// ───────── 끌기 + 누르기 입력 ─────────
let drag = null;
function onDown(e) {
  if (!S.running || S.paused) return;
  const cell = e.target.closest('[data-cell]');
  const part = e.target.closest('[data-part]');
  if (!cell && !part) return;
  const src = cell ? { cell: +cell.dataset.cell } : { part: part.dataset.part };
  drag = { src, x: e.clientX, y: e.clientY, started: false, ghost: null, over: null };
}
function onMove(e) {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    const id = drag.src.part || S.board[drag.src.cell];
    if (!id) { drag = null; return; }
    drag.started = true;
    drag.ghost = document.createElement('div');
    drag.ghost.className = 'ghost';
    drag.ghost.textContent = ITEMS[id].icon;
    document.body.appendChild(drag.ghost);
    if (drag.src.cell !== undefined) document.querySelector(`[data-cell="${drag.src.cell}"]`)?.classList.add('dim');
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-cell],[data-client]');
  if (drag.over && drag.over !== over) drag.over.classList.remove('drop');
  if (over && over.dataset.cell !== undefined) over.classList.add('drop');
  drag.over = over;
}
function onUp(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.started) {
    if (d.src.part) tapPart(d.src.part); else tapCell(d.src.cell);
    return;
  }
  d.ghost.remove();
  const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-cell],[data-client],[data-trash]');
  if (!target) { renderBoard(); return; }
  if (target.dataset.trash) { if (d.src.cell !== undefined) trash(d.src.cell); else renderBoard(); return; }
  if (target.dataset.client !== undefined) {
    if (d.src.part) { toast('부품은 납품할 수 없어요. 조립해서 로봇으로 만들어 주세요'); renderBoard(); return; }
    deliver(d.src.cell, +target.dataset.client); renderBoard(); return;
  }
  const to = +target.dataset.cell;
  if (d.src.part) {
    if (!S.board[to]) placePart(d.src.part, to);
    else if (!mergeInto(to, d.src.part)) { toast(`${label(d.src.part)} + ${label(S.board[to])}: 조립표에 없는 조합이에요`); renderBoard(); }
  } else cellToCell(d.src.cell, to);
}
document.addEventListener('pointerdown', onDown);
document.addEventListener('pointermove', onMove, { passive: false });
document.addEventListener('pointerup', onUp);
document.addEventListener('pointercancel', () => { if (drag?.ghost) drag.ghost.remove(); drag = null; renderBoard(); });

$('clients').addEventListener('click', e => {
  const b = e.target.closest('[data-client]');
  if (!b || !S.running || S.paused) return;
  const ci = +b.dataset.client;
  if (S.sel === null || !S.board[S.sel]) { toast('작업대에서 로봇을 고른 뒤 손님을 누르세요 (끌어다 놓아도 돼요)'); return; }
  deliver(S.sel, ci);
});
$('btnTrash').addEventListener('click', () => { if (S.running && !S.paused) trash(S.sel); });

// ───────── 근무 루프 ─────────
function loop(t) {
  const dt = Math.min(0.1, (t - (S.last || t)) / 1000);
  S.last = t;
  if (S.running && !S.paused) {
    S.time -= dt;
    if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) { S.comboT = 0; S.combo = 0; } }
    if (S.clients.length + S.backlog.length < MAX_WAIT) {
      S.spawnT -= dt;
      if (S.spawnT <= 0) { spawn(); S.spawnT = spawnGap(); }
    }
    renderHud();
    if (S.time <= 0) endShift();
  }
  requestAnimationFrame(loop);
}
function startShift() {
  S.running = true; S.paused = false; S.time = SHIFT_SEC; S.score = 0;
  S.combo = 0; S.comboT = 0; S.best = 0; S.served = [];
  S.board = Array(CELLS).fill(null); S.sel = null;
  S.clients = []; S.backlog = []; S.spawnT = 0.3;
  S.intro = S.shift === 1 ? TUTORIAL.slice() : [];
  renderClients(); renderBoard(); renderHud();
}
function endShift() {
  S.running = false;
  const seen = [...new Set(S.served)];
  const log = seen.map(id => {
    const o = O[id];
    return `<div class="log-item"><div class="hd"><b>${o.icon} ${o.who}</b><small>${o.sec}</small><em>${o.when} · ${label(o.want)}</em></div>${o.fact}</div>`;
  }).join('');
  openSheet(`
    <h2>${S.shift}번째 근무 끝</h2>
    <div class="big-stats">
      <div><span>납품</span><b class="num">${S.served.length}</b></div>
      <div><span>매출</span><b class="num">${S.score}</b></div>
      <div><span>최고 콤보</span><b class="num">${S.best}</b></div>
      <div><span>도감</span><b class="num">${S.dex.size}/${ORDERS.length}</b></div>
    </div>
    ${log ? `<h3>오늘 다녀온 현장</h3><div class="log">${log}</div>` : '<p>오늘은 납품이 없었어요. 다음 근무에서 다시 해봐요.</p>'}
    <button class="primary" type="button" data-act="next">다음 근무 시작</button>`);
}

// ───────── 오버레이 ─────────
function openSheet(html, pause) {
  $('sheet').innerHTML = html;
  $('overlay').hidden = false;
  if (pause && S.running) S.paused = true;
  $('sheet').querySelector('button')?.focus();
}
function closeSheet() { $('overlay').hidden = true; if (S.running) S.paused = false; }
function helpHtml(first) {
  return `
    <h2>로봇 SI 납품소</h2>
    <p>산업 현장에서 손님이 끊임없이 찾아와요. 부품을 조립해 맞는 로봇을 납품하세요.</p>
    <ol>
      <li>스토리지에서 부품을 꺼내 작업대에 놓아요</li>
      <li>부품끼리 <b>끌어다 겹치면</b> 조립돼요 (하나 누르고 다른 하나를 눌러도 돼요)</li>
      <li>완성된 로봇을 <b>손님 카드에 끌어다 놓으면</b> 납품이에요</li>
    </ol>
    <p>손님은 떠나지 않고, 틀려도 감점이 없어요. 대신 왜 그 로봇이 맞는지 알려줘요. 15초 안에 연달아 납품하면 콤보가 쌓여요. 근무는 3분이에요.</p>
    <button class="primary" type="button" data-act="${first ? 'begin' : 'close'}">${first ? '근무 시작' : '계속하기'}</button>`;
}
function dexHtml() {
  const items = ORDERS.map(o => S.dex.has(o.id)
    ? `<div class="log-item"><div class="hd"><b>${o.icon} ${o.who}</b><small>${o.sec}</small><em>${o.when} · ${label(o.want)}</em></div>${o.fact}</div>`
    : `<div class="log-item locked"><div class="hd"><b>${o.icon} ???</b><small>${o.sec}</small></div>아직 납품 전이에요.</div>`).join('');
  return `
    <h2>현장 도감 ${S.dex.size}/${ORDERS.length}</h2>
    <p>납품한 현장의 실제 이야기가 모여요. 출처는 로봇 스터디 2차 발제 자료(2026.09.21)예요.</p>
    <div class="log">${items}</div>
    <button class="primary" type="button" data-act="close">닫기</button>`;
}
$('sheet').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') closeSheet();
  else if (act === 'begin') { $('overlay').hidden = true; startShift(); }
  else if (act === 'next') { S.shift++; $('overlay').hidden = true; startShift(); }
});
$('btnHelp').addEventListener('click', () => openSheet(helpHtml(false), true));
$('btnDex').addEventListener('click', () => openSheet(dexHtml(), true));
$('btnPause').addEventListener('click', () => {
  if (!S.running) return;
  openSheet(`<h2>잠깐 쉬는 중</h2><p>손님들은 기다려 줘요.</p><button class="primary" type="button" data-act="close">계속하기</button>`, true);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) $('btnPause').click(); });

// ───────── 시작 ─────────
renderParts(); renderBoard(); renderClients(); renderHud();
openSheet(helpHtml(true));
requestAnimationFrame(loop);
</script>
