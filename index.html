<title>로봇 SI 납품소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 주문 카드(그림) → 작업대(머지 보드, 안전 줄무늬) → 컨베이어 벨트. 글자 대신 그림으로 읽는 작업장 */
:root {
  --bg: #E7ECEF;
  --surface: #FFFFFF;
  --surface-2: #F2F5F7;
  --ink: #13202A;
  --muted: #586977;
  --line: #CBD5DC;
  --accent: #F0B400;
  --gold-soft: #FFF3C9;
  --steel: #1C5A86;
  --steel-soft: #DCE8F1;
  --belt: #3A4650;
  --belt-2: #2E3841;
  --good: #24804D;
  --scrim: rgba(12, 20, 27, 0.55);
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151A; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0; --muted: #91A2AF;
    --line: #2E3B47; --accent: #F5C12B; --gold-soft: #3A3115; --steel: #72AEDC; --steel-soft: #1D3346;
    --belt: #2A333B; --belt-2: #20282F; --good: #3FA86C; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151A; --surface: #18212A; --surface-2: #202B35; --ink: #E4EBF0; --muted: #91A2AF;
  --line: #2E3B47; --accent: #F5C12B; --gold-soft: #3A3115; --steel: #72AEDC; --steel-soft: #1D3346;
  --belt: #2A333B; --belt-2: #20282F; --good: #3FA86C; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { box-sizing: border-box; height: 100%; max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 14px; display: flex; flex-direction: column; gap: 12px; }

/* 상단 바 */
.top { display: flex; align-items: center; gap: 14px; font-size: 16px; }
.top .stat { display: flex; align-items: center; gap: 4px; }
.top .stat b { font-size: 17px; }
.combo { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.combo b { font-size: 17px; min-width: 1.5em; }
.combo .meter { flex: 1; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.combo .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
.combo.hot b { color: var(--accent); }
.tools { display: flex; gap: 6px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; font-size: 16px; padding: 0; }

/* 주문 카드 */
.clients { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; min-height: 150px; box-sizing: border-box; }
.card.empty { border-style: dashed; background: transparent; cursor: default; }
.card.gold { border: 2px solid var(--accent); background: var(--gold-soft); }
.card .badge { position: absolute; top: -9px; left: -6px; background: var(--accent); color: #1A1400; border-radius: 10px; font-size: 11px; font-weight: 700; padding: 2px 7px; }
.card .who { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; max-width: 100%; }
.card .who span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .want { width: 100%; background: var(--steel-soft); border-radius: 10px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; box-sizing: border-box; }
.card .icons { display: flex; gap: 2px; justify-content: center; }
.card .icons span { font-size: 40px; line-height: 1.05; position: relative; }
.card .icons.two span { font-size: 30px; }
.card .icons span.done { opacity: .3; }
.card .icons span.done::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--good); opacity: 1; font-weight: 700; }
.card .want .nm { font-family: var(--font-display); font-size: 13.5px; color: var(--steel); text-align: center; line-height: 1.15; }
.card .recipe { font-size: 16px; letter-spacing: 1px; min-height: 20px; color: var(--muted); white-space: nowrap; }
.card.target { border-color: var(--steel); box-shadow: 0 0 0 2px var(--steel); }
.card.over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.card.enter { animation: enter .35s ease-out; }
.card.shake { animation: shake .4s; }
.card.bump { animation: bump .3s; }
.backlog { position: absolute; top: -8px; right: -6px; background: var(--ink); color: var(--bg); border-radius: 10px; font-size: 11px; font-weight: 700; padding: 2px 7px; }
@keyframes enter { from { transform: translateY(-14px) scale(.95); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@keyframes bump { 50% { transform: scale(1.05); } }

/* 작업대 */
.bench { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stripe { height: 8px; background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, var(--ink) 10px 20px); }
.bench-in { padding: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cell { height: 72px; border: 2px dashed var(--line); border-radius: 12px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10.5px; font-weight: 700; touch-action: none; padding: 0 2px; line-height: 1.15; text-align: center; }
.cell.part { border-style: solid; background: var(--surface-2); }
.cell.robot { border-style: solid; border-color: var(--steel); background: var(--steel-soft); }
.cell .ic { font-size: 32px; line-height: 1; }
.cell.sel { outline: 3px solid var(--accent); outline-offset: 1px; transform: translateY(-3px); }
.cell.drop { border-color: var(--accent); }
.cell.dim { opacity: .3; }
.cell.pop { animation: pop .35s ease-out; }
.cell.nope { animation: shake .35s; }
@keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* 컨베이어 */
.line { margin-top: auto; display: flex; gap: 8px; align-items: stretch; }
.belt { position: relative; flex: 1; height: 74px; border-radius: 12px; overflow: hidden; background: var(--belt); touch-action: none; }
.belt::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--belt-2) 0 3px, transparent 3px 26px); background-size: 26px 100%; animation: roll 0.47s linear infinite; }
.belt.stop::before { animation-play-state: paused; }
@keyframes roll { to { background-position: -26px 0; } }
.bitem { position: absolute; top: 9px; left: 0; width: 56px; height: 56px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 30px; padding: 0; touch-action: none; will-change: transform; }
.bitem.robot { border: 2px solid var(--steel); background: var(--steel-soft); }
.bitem.glow { box-shadow: 0 0 0 3px var(--accent); }
.bitem.taken { opacity: .25; }
.trash { width: 54px; background: var(--surface-2); border: 2px dashed var(--line); border-radius: 12px; font-size: 24px; padding: 0; touch-action: none; }
.trash.drop { border-color: var(--accent); }
.trash.nope { animation: shake .35s; }

.ghost { position: fixed; z-index: 40; pointer-events: none; font-size: 40px; transform: translate(-50%, -65%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
.float { position: fixed; z-index: 35; pointer-events: none; font-family: var(--font-display); font-size: 24px; color: var(--good); transform: translate(-50%, 0); animation: floatUp .9s ease-out forwards; text-shadow: 0 1px 0 var(--surface); }
@keyframes floatUp { to { transform: translate(-50%, -50px); opacity: 0; } }

/* 오버레이 */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 16px; width: 100%; max-width: 520px; max-height: 88%; overflow: auto; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; user-select: text; -webkit-user-select: text; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.sheet p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
.steps { display: grid; gap: 10px; }
.step { display: flex; align-items: center; gap: 12px; font-size: 26px; }
.step span { font-size: 14px; color: var(--muted); }
.big-stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; }
.big-stats b { font-size: 24px; margin-left: 4px; }
.map { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.sector { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; position: relative; filter: grayscale(1); opacity: .35; }
.sector small { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--muted); font-weight: 700; }
.sector.lit { filter: none; opacity: 1; border: 1px solid var(--steel); background: var(--steel-soft); }
.sector.new { animation: pop .6s ease-out .2s both; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.unlock { display: flex; align-items: center; gap: 14px; background: var(--gold-soft); border: 2px solid var(--accent); border-radius: 14px; padding: 12px 14px; }
.unlock .ic { font-size: 44px; animation: pop .6s ease-out; }
.unlock b { font-family: var(--font-display); font-weight: 400; font-size: 20px; display: block; }
.unlock span { font-size: 18px; color: var(--muted); }
.log { display: grid; gap: 6px; }
.log-item { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: start; border-bottom: 1px solid var(--line); padding: 7px 0; font-size: 13px; line-height: 1.5; }
.log-item .i { font-size: 24px; grid-row: span 2; }
.log-item .h { font-weight: 700; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.log-item .h small { color: var(--steel); font-size: 11px; }
.log-item.locked { color: var(--muted); }
.primary { align-self: flex-start; background: var(--accent); color: #1A1400; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 16px; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }

@media (prefers-reduced-motion: reduce) {
  .card.enter, .card.shake, .card.bump, .cell.pop, .cell.nope, .trash.nope, .float, .sector.new, .unlock .ic { animation: none; }
  .belt::before { animation: none; }
}
</style>

<div class="app">
  <header class="top">
    <span class="stat" aria-label="남은 시간">⏱<b class="num" id="clock">3:00</b></span>
    <span class="stat" aria-label="점수">⭐<b class="num" id="score">0</b></span>
    <span class="combo" id="comboBox" aria-label="콤보">🔥<b class="num" id="combo">0</b><span class="meter"><i id="flowBar"></i></span></span>
    <span class="tools">
      <button class="tool" id="btnSound" type="button" aria-label="소리 켜고 끄기">🔊</button>
      <button class="tool" id="btnDex" type="button" aria-label="현장 도감">📖</button>
      <button class="tool" id="btnPause" type="button" aria-label="일시정지">⏸</button>
    </span>
  </header>

  <section class="clients" id="clients" aria-label="주문"></section>

  <section class="bench" aria-label="작업대">
    <div class="stripe"></div>
    <div class="bench-in" id="board"></div>
  </section>

  <section class="line" aria-label="컨베이어">
    <div class="belt stop" id="belt"></div>
    <button class="trash" id="btnTrash" type="button" data-trash="1" aria-label="버리기">🗑</button>
  </section>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>

<script>
// ───────── 그래픽 9종: 부품 3 + 완제품 3 + 조립 로봇 3. 아이콘은 임시 이모지 ─────────
const ITEMS = {
  wheel: { kind: 'part',  icon: '🛞', name: '바퀴' },
  lidar: { kind: 'part',  icon: '👁️', name: '라이다' },
  tape:  { kind: 'part',  icon: '🧲', name: '마그넷' },
  cobot: { kind: 'robot', icon: '🦾', name: '협동로봇' },
  quad:  { kind: 'robot', icon: '🐕', name: '4족보행' },
  hum:   { kind: 'robot', icon: '🚶', name: '휴머노이드' },
  amr:   { kind: 'robot', icon: '🚚', name: 'AMR' },
  agv:   { kind: 'robot', icon: '🛤️', name: 'AGV' },
  mm:    { kind: 'robot', icon: '🚜', name: '모바일 매니퓰레이터' },
};
// 자료에 나온 조합만: AMR(스스로 길 찾기) / AGV(바닥 경로) / AMR 위에 협동로봇 팔(⑧ LG엔솔)
const RECIPES = [['wheel', 'lidar', 'amr'], ['wheel', 'tape', 'agv'], ['amr', 'cobot', 'mm']];
const recipe = (a, b) => (RECIPES.find(([x, y]) => (x === a && y === b) || (x === b && y === a)) || [])[2] || null;
const recipeOf = r => RECIPES.find(x => x[2] === r);
const baseParts = r => { const x = recipeOf(r); return x ? [...baseParts(x[0]), ...baseParts(x[1])] : [r]; };

// 근무마다 새 로봇이 열림
const UNLOCKS = [['amr', 'agv'], ['cobot', 'mm'], ['quad'], ['hum']];
const unlockedAt = n => UNLOCKS.slice(0, n).flat();

// ───────── 손님: 자료가 로봇 종류를 직접 밝힌 곳만 (로봇 스터디 2차 발제 자료, 2026.09.21) ─────────
const ORDERS = [
  { id: 'port',     wants: ['agv', 'agv'], icon: '⚓', who: '부산항',      sec: '⑮ 항만',        fact: '국내 첫 완전 자동화 부두에서 AGV가 시스템 지시대로 컨테이너를 옮겨요. 2018년 노조 반발 뒤 노사정 협의체를 거쳤어요.' },
  { id: 'kai',      wants: ['agv'],        icon: '🛩️', who: 'KAI',         sec: '⑨ 항공기 제조', fact: 'AGV로 자재를 옮기고 로봇으로 T-50 날개를 뚫어, 8시간 걸리던 작업을 40분으로 줄였어요.' },
  { id: 'stl',      wants: ['amr', 'amr'], icon: '📦', who: '에스티엘',    sec: '② AMR',         fact: '트위니가 오더피킹 AMR 12대를 먼저 넣어 검증한 뒤 본계약을 맺었어요.' },
  { id: 'transys',  wants: ['amr'],        icon: '🏭', who: '현대트랜시스', sec: '② AMR',        fact: '바닥 공사 없이 기존 공장에 바로 넣을 수 있는 300kg급 AMR이에요. AGV는 바닥 경로가 필요해요.' },
  { id: 'ford',     wants: ['amr'],        icon: '🔌', who: '포드',        sec: '② AMR',         fact: '티로보틱스가 미국 포드 ESS 공장에 AMR을 공급했어요. 미 FCC는 중국산 센서 장비를 막고 있어요.' },
  { id: 'ecopro',   wants: ['amr'],        icon: '🧪', who: '에코프로',    sec: '⑧ 배터리 공장', fact: '이차전지 소재 공장에서 AMR로 설비를 점검하고 고장을 미리 잡아요.' },
  { id: 'lg',       wants: ['mm'],         icon: '🔋', who: 'LG엔솔',      sec: '⑧ 배터리 공장', fact: 'AMR 위에 협동로봇 팔을 얹은 결합형이 라인을 돌며 불량 셀을 빼고 부품을 공급해요.' },
  { id: 'mipo',     wants: ['cobot', 'cobot'], icon: '🚢', who: 'HD현대미포', sec: '④ 조선',     fact: '레인보우 협동로봇이 누적 55대예요. 용접공을 구하지 못해 일을 못 받는 현장이에요.' },
  { id: 'gwangjin', wants: ['cobot'],      icon: '⚙️', who: '광진',        sec: '③ 제조 SI',     fact: '13억원을 들여 협동로봇을 넣으며, 값보다 A/S를 보고 국산을 골랐어요.' },
  { id: 'polytech', wants: ['cobot'],      icon: '🎓', who: '폴리텍',      sec: '① 교육용 로봇', fact: '두산로보틱스가 실습용 협동로봇 4대를 기증했어요.' },
  { id: 'busanEdu', wants: ['cobot'],      icon: '🍱', who: '부산교육청',  sec: '⑱ 학교 급식',   fact: '5개교에 조리로봇을 설치해요. 실증에서 근력 작업 72%, 고위험 작업시간 69%가 줄었어요.' },
  { id: 'posco',    wants: ['quad'],       icon: '🔥', who: '포스코',      sec: '⑦ 철강',        fact: '계단·배관이 많은 고로에서 스팟이 하루 12번 가스 누설을 점검해요.' },
  { id: 'police',   wants: ['quad', 'quad'], icon: '🚓', who: '경찰청',    sec: '㉖ 소방·경찰',   fact: '사족보행 로봇 6대가 폭발물 현장에 먼저 들어가 영상을 보내요.' },
  { id: 'army',     wants: ['quad'],       icon: '🎖️', who: '방사청',      sec: '㉗ 국방',        fact: '대테러 다족보행로봇을 특전사·전방사단에 시범 배치했어요.' },
  { id: 'fire',     wants: ['quad'],       icon: '🚒', who: '소방청',      sec: '㉖ 소방·경찰',   fact: '4족보행로봇 40대에 160억원, 대당 약 4억원을 편성했어요.' },
  { id: 'hyundai',  wants: ['hum'],        icon: '🚙', who: '현대차',      sec: '⑤ 자동차 공장', fact: '아틀라스 2만5000대 투입 계획이에요. 노조는 "합의 없이 1대도 안 된다"고 해요.' },
  { id: 'bmw',      wants: ['hum', 'hum'], icon: '🇺🇸', who: 'BMW',        sec: '⑤ 자동차 공장', fact: 'Figure 02 2대가 11개월간 주 5일 10시간 교대로 일했어요.' },

  if (S.running) openSheet(`<h2>⏸</h2><button class="primary" type="button" data-act="close">계속 ▶</button>`, true);
});
const syncSound = () => { $('btnSound').textContent = S.sound ? '🔊' : '🔇'; };
$('btnSound').addEventListener('click', () => {
  S.sound = !S.sound; syncSound();
  try { localStorage.setItem('robotsi.sound', S.sound ? '1' : '0'); } catch (e) {}
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) $('btnPause').click(); });

syncSound(); renderBoard(); renderClients(); renderHud();
openSheet(HELP);
requestAnimationFrame(loop);
</script>
