<title>Robot Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 금색 제목·계기판 → 클라이언트 3명(말풍선 주문)과 계산대 줄무늬 → 철판 프레임 5×5 조립대. 공장 틸블루 바닥 */
:root {
  /* 공장 틸블루 바닥 위의 작업장. 카드(말풍선·안내창)만 흰 종이 */
  --bg: #1E5D68;
  --bg-deep: #134650;
  --plate: rgba(255, 255, 255, 0.05);
  --hud-ink: #E8F3F2;
  --hud-muted: #9CC6C9;
  --hud-line: rgba(255, 255, 255, 0.16);
  --gold: #F2C14E;
  --gold-deep: #7A5200;
  --board: #0F2E35;
  --cell: #1A424A;
  --frame: #0A2227;
  --surface: #FFFFFF;
  --surface-2: #F2F5F7;
  --ink: #13202A;
  --muted: #586977;
  --line: #B7C3CB;
  --accent: #F2C14E;
  --gold-soft: #FFF3C9;
  --steel: #1C5A86;
  --steel-soft: #DCE8F1;
  --good: #24804D;
  --warn: #C77F00;
  --bad: #C03A2A;
  --scrim: rgba(6, 22, 26, 0.6);
  --t-wheel: #E34234; --t-auto: #1E88C8; --t-arm: #F28C28; --t-legs: #F2C230; --t-tool: #8E3A9E; --t-hum: #D9DDE1; --t-floor: #3A9D5D;
  --t-ink-dark: #2B2118; --t-ink-light: #FFFFFF;
  --p-1: #1E88C8; --p-2: #F2C230; --p-3: #E34234; --p-4: #800020;
  --font-title: 'Rye', 'Georgia', serif;
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg) repeating-linear-gradient(135deg, var(--plate) 0 2px, transparent 2px 14px); color: var(--hud-ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { box-sizing: border-box; height: 100%; max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 14px; display: flex; flex-direction: column; gap: 10px; }

/* 상단: 금색 웨스턴 제목 + 계기판 */
/* 소리 버튼: Bosses of Our World와 같은 모양 (sound O 초록 / sound X 빨강) */
.mute { flex: none; border: 0; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .3px; line-height: 1; padding: 4px 5px 4px 7px; border-radius: 12px; white-space: nowrap; }
.mute b { display: inline-block; min-width: 18px; margin-left: 3px; padding: 2px 0; border-radius: 6px; text-align: center; color: #fff; }
.mute b.on { background: #2E9E4F; }
.mute b.off { background: #C62828; }
.masthead { display: flex; align-items: center; justify-content: center; }
.title { margin: 0; display: flex; justify-content: center; align-items: center; gap: 4px; font-family: var(--font-title); font-weight: 400; line-height: 1; white-space: nowrap; letter-spacing: .5px; }
/* 금박 글자: Bosses of Our World #title .main 그대로 (세로 그라데이션 + 진한 갈색 외곽선 + 아래 그림자) */
.title .main {
  font-size: clamp(30px, 10vw, 42px);
  background: linear-gradient(180deg, #fff6c8 0%, #ffd75a 38%, #e0a21f 55%, #ffe58a 72%, #b8770f 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1px #5a3104;
  filter: drop-shadow(0 2px 0 #3b1f02) drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5));
}
/* 달러 기호: Bosses #title .usd 그대로 (굵은 세리프 + 돈다발 초록 + 금 테두리, 살짝 크고 기울어 반짝) */
.title .usd {
  margin: 0 -2px;
  font-family: Georgia, 'Times New Roman', serif; font-weight: 900;
  font-size: clamp(36px, 12vw, 50px); line-height: 1;
  background: linear-gradient(180deg, #d8ffb0 0%, #5fe05a 40%, #12902e 70%, #7cf06a 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1.2px #ffd75a;
  filter: drop-shadow(0 2px 0 #0b3d14) drop-shadow(0 0 6px rgba(120, 255, 120, 0.55));
  transform: translateY(-1px) rotate(-6deg);
  animation: usd-bling 2.4s ease-in-out infinite;
}
@keyframes usd-bling {
  0%, 70%, 100% { filter: drop-shadow(0 2px 0 #0b3d14) drop-shadow(0 0 6px rgba(120, 255, 120, 0.55)); }
  80% { filter: drop-shadow(0 2px 0 #0b3d14) drop-shadow(0 0 14px rgba(200, 255, 140, 0.95)); }
}
/* 양쪽 보안관 별 + 밧줄 같은 짧은 선 */
.title .star { font-family: Georgia, serif; font-size: clamp(20px, 6vw, 26px); color: #ffd75a; -webkit-text-stroke: 1px #5a3104; filter: drop-shadow(0 2px 0 #3b1f02); animation: star-twinkle 3s ease-in-out infinite; }
.title .star:last-child { animation-delay: 1.5s; }
.title .rule { width: 14px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, transparent, #e0a21f); }
.title .rule.r { background: linear-gradient(270deg, transparent, #e0a21f); }
@keyframes star-twinkle { 0%, 80%, 100% { transform: rotate(0) scale(1); } 90% { transform: rotate(36deg) scale(1.15); } }
.tools { display: flex; gap: 6px; }
.tool { background: rgba(255, 255, 255, 0.12); border: 0; color: var(--hud-ink); border-radius: 12px; width: 30px; height: 24px; font-size: 13px; padding: 0; flex: none; }
.hud { display: flex; align-items: center; gap: 7px; background: var(--bg-deep); border: 1px solid var(--hud-line); border-radius: 12px; padding: 6px 7px; font-size: 13px; position: relative; }
.lv { font-family: var(--font-display); font-size: 15px; color: var(--gold); white-space: nowrap; }
.hud .stat { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.hud .stat b { font-size: 13px; }
.goal { flex: 1; min-width: 20px; height: 8px; background: rgba(0, 0, 0, .3); border-radius: 6px; overflow: hidden; }
.goal i { display: block; height: 100%; width: 0; background: var(--gold); }
.hud .chain { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); font-family: var(--font-display); color: var(--gold); font-size: 16px; z-index: 4; text-shadow: 0 2px 0 rgba(0,0,0,.4); pointer-events: none; }
.hud .left { display: none; }

/* 주문표 */
.rail { flex: none; height: 206px; padding-bottom: 6px; border-bottom: 6px solid; border-image: repeating-linear-gradient(-45deg, var(--gold) 0 10px, var(--frame) 10px 20px) 6; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, .52fr); gap: 7px; }
/* 주문서: 종이 카드. 위에서부터 업종 → 회사·할 일 → 로봇 → 부품 칸 → 기다림 바 */
.ocard { position: relative; min-width: 0; min-height: 0; box-sizing: border-box; background: var(--surface); color: var(--ink); border: 2px solid var(--ink); border-radius: 12px; padding: 7px 5px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 3px 0 var(--gold-deep); transition: transform .18s ease-out, opacity .3s; overflow: hidden; }
.ocard .ind { font-family: var(--font-display); font-size: 16px; line-height: 1.12; text-align: center; word-break: keep-all; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: none; }
.ocard .co { font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ocard .task { font-size: 11.5px; font-weight: 700; color: var(--steel); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ocard .rb { display: flex; align-items: center; justify-content: center; gap: 3px; margin-top: auto; max-width: 100%; }
.ocard .rb .ric { font-size: 32px; line-height: 1; }
.ocard .rb b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.ocard .rname { font-family: var(--font-display); font-size: 12px; color: var(--steel); line-height: 1.15; text-align: left; word-break: keep-all; }
.ocard .needs { display: flex; flex-wrap: nowrap; justify-content: center; gap: 2px; margin: 3px 0 4px; }
.ocard .hint { font-size: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
/* 좁은 휴머노이드 상시 주문서 */
.ocard.hum { padding: 7px 3px 6px; background: linear-gradient(180deg, #FFF8E1, var(--surface) 45%); border-color: var(--gold-deep); }
.ocard.hum .ind { font-size: 22px; }
.ocard.hum .rname { font-size: 11px; text-align: center; }
.ocard.hum .needs { flex-wrap: wrap; gap: 2px; }
.ocard.hum .need { width: 21px; height: 21px; font-size: 14px; }
.ocard.empty, .ocard.pending { background: rgba(0, 0, 0, .14); border: 2px dashed var(--hud-line); box-shadow: none; color: var(--hud-muted); justify-content: center; font-size: 12px; font-weight: 700; }
.ocard.pending span { font-size: 30px; animation: urgent 1s ease-in-out infinite; }
.ocard.done { border-color: var(--good); }
.ocard.gone { border-color: var(--bad); }
.ocard.done > :not(.tag), .ocard.gone > :not(.tag) { opacity: .35; }
.ocard .tag { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%) rotate(-12deg); font-family: var(--font-display); font-size: 22px; padding: 2px 10px; border: 3px solid; border-radius: 8px; background: rgba(255, 255, 255, .85); white-space: nowrap; animation: stampIn .3s ease-out; }
.ocard .tag.ok { color: var(--good); }
.ocard .tag.no { color: var(--bad); }
.ocard.hum .tag { font-size: 15px; padding: 2px 5px; }
@keyframes stampIn { 0% { transform: translate(-50%, -50%) rotate(-12deg) scale(2.2); opacity: 0; } 100% { transform: translate(-50%, -50%) rotate(-12deg) scale(1); opacity: 1; } }
.ocard.enter { animation: drop .3s ease-out; }
.ocard.bump { transform: scale(1.06); }
.need { flex: none; position: relative; width: 23px; height: 23px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; border: 1.5px dashed var(--muted); background: var(--surface-2); box-sizing: border-box; }
.need.got { border: 1.5px solid var(--good); background: rgba(46, 160, 67, .18); }
.need.got::after { content: '✓'; position: absolute; right: -3px; bottom: -5px; font-size: 10px; font-weight: 700; color: var(--good); }
.pat { width: 100%; height: 12px; border-radius: 7px; background: rgba(0, 0, 0, .12); border: 2px solid var(--ink); overflow: hidden; flex: none; box-sizing: border-box; }
/* 기다림 바: 세룰리안블루 → 노랑 → 다홍 → 버건디 */
.pat i { display: block; height: 100%; background: var(--p-1); transform-origin: left; transition: background-color .3s; }
.pat i.p2 { background: var(--p-2); }
.pat i.p3 { background: var(--p-3); }
.pat i.p4 { background: var(--p-4); animation: urgent .6s ease-in-out infinite; }
/* 휴머노이드 손님은 기다림이 끝없음: 금색 줄무늬 */
.pat.inf i { background: repeating-linear-gradient(-45deg, var(--gold) 0 6px, #FFE9A8 6px 12px); }
@keyframes urgent { 50% { filter: brightness(1.45); } }
@keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes drop { from { transform: translateY(-18px); opacity: .2; } to { transform: none; opacity: 1; } }
.showcase { position: fixed; z-index: 39; pointer-events: none; font-size: 30px; transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
.showcase b { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 400; font-size: 9px; color: var(--ink); white-space: nowrap; text-shadow: 0 1px 0 var(--surface); }

/* 매치3 보드 */
.boardwrap { flex: none; display: flex; justify-content: center; }
.board { position: relative; width: 100%; aspect-ratio: 1; background: var(--board); border-radius: 14px; box-shadow: 0 0 0 6px var(--frame), 0 0 0 7px var(--hud-line), 0 10px 24px rgba(0, 0, 0, .35); touch-action: none; overflow: visible; }
.clip { position: absolute; inset: 0; overflow: hidden; border-radius: 14px; }
.fxc { position: absolute; left: -40px; top: -40px; pointer-events: none; z-index: 5; }
.cellbg { position: absolute; border-radius: 10px; background: var(--cell); box-shadow: inset 0 2px 4px rgba(0, 0, 0, .35); }
.boardwrap { padding: 7px 0 2px; }
.tile { position: absolute; left: 0; top: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); will-change: transform; pointer-events: none; transform-origin: 50% 50%; }
.sv { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }
.tile .ic { font-size: calc(var(--ts, 60px) * 0.66); line-height: 1; }
.tile .nm { font-size: 9.5px; font-weight: 500; color: var(--t-ink-light); opacity: .75; margin-bottom: 0; text-align: center; line-height: 1.1; white-space: nowrap; letter-spacing: -0.02em; }
.tile .nm.long { letter-spacing: -0.07em; }
.tile.lite .nm { color: var(--t-ink-dark); opacity: .55; }
.tile.hum { box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 0 0 3px var(--accent); }
.tile.sel { box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 0 0 3px var(--accent); }
.tile.hint { animation: hint 1s ease-in-out infinite; }
@keyframes hint { 50% { filter: brightness(1.25); } }

.flyer { position: fixed; z-index: 38; pointer-events: none; font-size: 28px; transform: translate(-50%, -50%); transition: left .32s ease-in, top .32s ease-in, transform .32s ease-in; }
.float { position: fixed; z-index: 35; pointer-events: none; font-family: var(--font-display); font-size: 24px; color: var(--good); transform: translate(-50%, 0); animation: floatUp .9s ease-out forwards; text-shadow: 0 1px 0 var(--surface); }
.float.bad { color: var(--bad); }
.float.big { font-size: 30px; color: var(--accent); }
@keyframes floatUp { to { transform: translate(-50%, -54px); opacity: 0; } }
.banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 36; pointer-events: none; font-family: var(--font-display); font-size: 36px; color: var(--accent); text-shadow: 0 2px 0 var(--ink); animation: banner 1.2s ease-out forwards; white-space: nowrap; }
@keyframes banner { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1); opacity: 0; } }

.readscrim { position: fixed; inset: 0; z-index: 37; background: rgba(5, 25, 30, .55); opacity: 0; cursor: pointer; }
.order-card { position: fixed; z-index: 38; cursor: pointer; width: 236px; box-sizing: border-box; background: var(--surface); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 6px 0 var(--gold-deep), 0 14px 30px rgba(0, 0, 0, .45); }
.order-card .oc-head { align-self: stretch; text-align: center; font-family: var(--font-display); font-size: 13px; letter-spacing: .08em; color: var(--surface); background: var(--ink); border-radius: 8px; padding: 3px 0; margin-bottom: 4px; }
.order-card.hum .oc-head { background: var(--gold-deep); }
.order-card .ind { font-family: var(--font-display); font-size: 30px; line-height: 1.1; text-align: center; word-break: keep-all; }
.order-card .co { font-size: 13px; font-weight: 700; color: var(--muted); }
.order-card .task { font-size: 15px; font-weight: 700; color: var(--steel); text-align: center; word-break: keep-all; }
.order-card .rb { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.order-card .rb .ric { font-size: 58px; line-height: 1.05; }
.order-card .rb b { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.order-card .rname { font-family: var(--font-display); font-size: 17px; color: var(--steel); line-height: 1.2; word-break: keep-all; max-width: 110px; }
.order-card .needs { display: flex; gap: 4px; margin-top: 4px; }
.order-card .need { width: 34px; height: 34px; font-size: 22px; border-width: 2px; border-radius: 8px; }
.order-card .oc-tap { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--surface); background: var(--accent); color: #1A1400; border-radius: 999px; padding: 6px 16px; animation: urgent 1s ease-in-out infinite; }
.order-card .stamp { position: absolute; right: 10px; top: 42%; font-family: var(--font-display); font-size: 34px; color: var(--bad); border: 4px solid var(--bad); border-radius: 10px; padding: 0 10px; background: rgba(255, 255, 255, .7); transform: rotate(-14deg) scale(2.4); opacity: 0; pointer-events: none; }
.order-card.stamped .stamp { animation: stampHit .22s ease-out forwards; }
.order-card.stamped .oc-tap { visibility: hidden; }
@keyframes stampHit { to { transform: rotate(-14deg) scale(1); opacity: 1; } }
.leave { position: fixed; z-index: 40; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.leave .lstars { font-size: 64px; line-height: 1; letter-spacing: 2px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .45)); white-space: nowrap; }
.leave .lstars span { color: rgba(255, 255, 255, .55); }
.leave .lrobot { font-size: 88px; line-height: 1; display: flex; align-items: center; gap: 4px; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .45)); }
.leave .lrobot b { font-family: var(--font-display); font-weight: 400; font-size: 36px; color: var(--accent); text-shadow: 0 2px 0 var(--ink); }
/* 완성 못 한 로봇: 검은 실루엣 */
.leave .lrobot.shadow { filter: brightness(0) drop-shadow(0 0 2px rgba(255, 255, 255, .55)) drop-shadow(0 8px 16px rgba(0, 0, 0, .45)); opacity: .9; }
.leave .lsad { font-size: 50px; line-height: 1; letter-spacing: 2px; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .4)); white-space: nowrap; }
.leave .lword { font-family: var(--font-display); font-size: 30px; color: var(--accent); text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(0, 0, 0, .5); white-space: nowrap; }
.leave.angry .lword { color: #FF8A80; }
.puff { position: fixed; z-index: 41; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%) scale(.3); background: radial-gradient(circle, rgba(225, 230, 234, .95) 0%, rgba(170, 178, 186, .7) 45%, rgba(150, 160, 170, 0) 70%); animation: puff .8s ease-out forwards; }
@keyframes puff { to { transform: translate(-50%, -80%) scale(1.6); opacity: 0; } }

/* 오버레이 */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 16px; width: 100%; max-width: 480px; max-height: 88%; overflow: auto; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; user-select: text; -webkit-user-select: text; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.sheet p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
.steps { display: grid; gap: 10px; }
.step { display: flex; align-items: center; gap: 12px; font-size: 24px; }
.step span { font-size: 14px; color: var(--muted); }
.recipes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 14px; }
.big-stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; }
.big-stats b { font-size: 24px; margin-left: 4px; }
.map { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.sector { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; filter: grayscale(1); opacity: .35; }
.sector small { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--muted); font-weight: 700; }
.sector.lit { filter: none; opacity: 1; border: 1px solid var(--steel); background: var(--steel-soft); }
.log { display: grid; gap: 6px; }
.log-item { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: start; border-bottom: 1px solid var(--line); padding: 7px 0; font-size: 13px; line-height: 1.5; }
.log-item .i { font-size: 24px; grid-row: span 2; }

<script>
// 보드 순수 로직 (렌더링·애니메이션 없음). 셀 인덱스 idx = r * cols + c.
// 타일 객체는 로직 필드(type, special)와 렌더용 필드(x, y, scale ...)를 함께 가진다.

let nextId = 1;

function makeTile(type, special = false, r = 0, c = 0) {
  return {
    id: nextId++,
    type,          // characters 배열 인덱스
    special,
    x: c, y: r,    // 셀 단위 렌더 위치
    scale: 1, sx: 1, sy: 1, alpha: 1, jx: 0,
    // 표정·몸짓 (faces.js)
    expr: 'smirk', exprUntil: 0, exprPrio: 0, flip: false,
    ox: 0, oy: 0, rot: 0, motion: 0, nextIdle: 0, phase: Math.random() * Math.PI * 2,
  };
}

class Board {
  constructor(cols, rows, types, rng = Math.random) {
    this.cols = cols;
    this.rows = rows;
    this.types = types;
    this.rng = rng;
    this.cells = new Array(cols * rows).fill(null);
  }

  idx(r, c) { return r * this.cols + c; }
  rc(idx) { return [Math.floor(idx / this.cols), idx % this.cols]; }
  inBounds(r, c) { return r >= 0 && r < this.rows && c >= 0 && c < this.cols; }
  get(r, c) { return this.inBounds(r, c) ? this.cells[this.idx(r, c)] : null; }
  // noMatch 아이템(시한폭탄·비둘기 민병대)은 어떤 것과도 매치되지 않는다 (드론은 드론끼리 매치됨)
  typeAt(r, c) { const t = this.get(r, c); return t && !t.noMatch ? t.type : -1; }

  randomType() { return this.types[Math.floor(this.rng() * this.types.length)]; }

  // 매치 없이 + 가능한 수가 하나 이상 있는 보드 생성
  fillInitial() {
    for (let attempt = 0; attempt < 200; attempt++) {
      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          let type, guard = 0;
          do {
            type = this.randomType();
            guard++;
          } while (guard < 50 && this.makesRunWhenPlaced(r, c, type));
          this.cells[this.idx(r, c)] = makeTile(type, false, r, c);
        }
      }
      if (this.findMatches().groups.length === 0 && this.findMove()) return;
    }
  }

  // (r,c)에 type을 놓으면 왼쪽 두 칸 또는 위쪽 두 칸과 3연속이 되는지
  makesRunWhenPlaced(r, c, type) {
    if (c >= 2 && this.typeAt(r, c - 1) === type && this.typeAt(r, c - 2) === type) return true;
    if (r >= 2 && this.typeAt(r - 1, c) === type && this.typeAt(r - 2, c) === type) return true;
    return false;
  }

  swap(a, b) {
    const ia = this.idx(a.r, a.c), ib = this.idx(b.r, b.c);
    const t = this.cells[ia];
    this.cells[ia] = this.cells[ib];
    this.cells[ib] = t;
  }

  // 가로/세로 3개 이상 연속 동일 인물. 겹치는(같은 셀 공유) 런은 한 그룹으로 합친다.
  findMatches() {
    const n = this.cells.length;
    const parent = new Int32Array(n).fill(-1);
    const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[rb] = ra; };
    const mark = (list) => {
      for (const i of list) if (parent[i] === -1) parent[i] = i;
      for (let k = 1; k < list.length; k++) union(list[0], list[k]);
    };

    const scan = (outer, inner, at) => {
      for (let o = 0; o < outer; o++) {
        let run = [];
        let runType = -1;
        for (let i = 0; i <= inner; i++) {
          const idx = i < inner ? at(o, i) : -1;
          const type = idx >= 0 && this.cells[idx] && !this.cells[idx].noMatch ? this.cells[idx].type : -1;
          if (type !== -1 && type === runType) {
            run.push(idx);
          } else {
            if (run.length >= 3) mark(run);
            run = type === -1 ? [] : [idx];
            runType = type;
          }
        }
      }
    };
    scan(this.rows, this.cols, (r, c) => this.idx(r, c));
    scan(this.cols, this.rows, (c, r) => this.idx(r, c));

    const byRoot = new Map();
    for (let i = 0; i < n; i++) {
      if (parent[i] === -1) continue;
      const root = find(i);
      if (!byRoot.has(root)) byRoot.set(root, { type: this.cells[i].type, cells: [] });
      byRoot.get(root).cells.push(i);
    }
    const groups = [...byRoot.values()];
    const matched = new Set();
    for (const g of groups) for (const i of g.cells) matched.add(i);
    return { groups, matched };
  }

  // (r,c)를 포함하는 3연속이 있는지
  hasMatchAt(r, c) {
    const type = this.typeAt(r, c);
    if (type === -1) return false;
    let h = 1, v = 1;
    for (let k = c - 1; this.typeAt(r, k) === type; k--) h++;
    for (let k = c + 1; this.typeAt(r, k) === type; k++) h++;
    for (let k = r - 1; this.typeAt(k, c) === type; k--) v++;
    for (let k = r + 1; this.typeAt(k, c) === type; k++) v++;
    return h >= 3 || v >= 3;
  }

  wouldMatch(a, b) {
    if (!this.get(a.r, a.c) || !this.get(b.r, b.c)) return false;
    this.swap(a, b);
    const ok = this.hasMatchAt(a.r, a.c) || this.hasMatchAt(b.r, b.c);
    this.swap(a, b);
    return ok;
  }

  // a↔b를 바꾸면 한 줄로 맞춰지는 칸들 [{ r, c }] (바꾼 뒤 위치 기준)
  matchCellsFor(a, b) {
    if (!this.get(a.r, a.c) || !this.get(b.r, b.c)) return [];
    this.swap(a, b);
    const out = new Map();
    for (const p of [a, b]) {
      const type = this.typeAt(p.r, p.c);
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const run = [p];
        for (let k = 1; this.typeAt(p.r - dr * k, p.c - dc * k) === type; k++) run.push({ r: p.r - dr * k, c: p.c - dc * k });
        for (let k = 1; this.typeAt(p.r + dr * k, p.c + dc * k) === type; k++) run.push({ r: p.r + dr * k, c: p.c + dc * k });
        if (run.length >= 3) for (const q of run) out.set(q.r * this.cols + q.c, q);
      }
    }
    this.swap(a, b);
    return [...out.values()];
  }

  // 가능한 수 목록 (없으면 빈 배열)
  allMoves() {
    const moves = [];
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const a = { r, c };
        if (c + 1 < this.cols && this.wouldMatch(a, { r, c: c + 1 })) moves.push([a, { r, c: c + 1 }]);
        if (r + 1 < this.rows && this.wouldMatch(a, { r: r + 1, c })) moves.push([a, { r: r + 1, c }]);
      }
    }
    return moves;
  }

  findMove() {
    const moves = this.allMoves();
    return moves.length ? moves[Math.floor(this.rng() * moves.length)] : null;
  }

  // 빈칸을 아래로 채우고 위에서 새 타일 생성.
  // 반환: [{ tile, c, fromY, toR }] — fromY가 음수면 보드 위에서 새로 생긴 타일
  collapse() {
    const falls = [];
    for (let c = 0; c < this.cols; c++) {
      let write = this.rows - 1;
      for (let r = this.rows - 1; r >= 0; r--) {
        const t = this.cells[this.idx(r, c)];
        if (!t) continue;
        if (write !== r) {
          this.cells[this.idx(write, c)] = t;
          this.cells[this.idx(r, c)] = null;
          falls.push({ tile: t, c, fromY: r, toR: write });
        }
        write--;
      }
      const empty = write + 1;
      for (let r = write; r >= 0; r--) {
        const t = makeTile(this.randomType(), false, r - empty, c);
        this.cells[this.idx(r, c)] = t;
        falls.push({ tile: t, c, fromY: r - empty, toR: r });
      }
    }
    return falls;
  }

  // 타일 객체를 섞어 재배치. 매치 없음 + 가능한 수 있음이 될 때까지.
  shuffle() {
    const tiles = this.cells.filter(Boolean);
    for (let attempt = 0; attempt < 300; attempt++) {
      for (let i = tiles.length - 1; i > 0; i--) {
        const j = Math.floor(this.rng() * (i + 1));
        [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
      }
      tiles.forEach((t, i) => { this.cells[i] = t; });
      if (this.findMatches().groups.length === 0 && this.findMove()) return;
    }
    // 드물게 실패하면 일반 타일의 인물을 새로 뽑는다
    for (let attempt = 0; attempt < 300; attempt++) {
      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          const t = this.cells[this.idx(r, c)];
          if (t.special) continue;
          this.cells[this.idx(r, c)] = null;
          let guard = 0, type;
          do { type = this.randomType(); guard++; } while (guard < 50 && this.makesRunWhenPlaced(r, c, type));
          t.type = type;
          this.cells[this.idx(r, c)] = t;
        }
      }
      if (this.findMatches().groups.length === 0 && this.findMove()) return;
    }
  }
}

}

function fxText(x, y, str, size, color, img) { if (JUICE > 0) FX.texts.push({ x, y, str, size, color, img, t: 0, dur: 0.9 }); }
// 보드 흔들림은 쓰지 않음 (타일이 흔들리지 않게). 호출은 남겨 두고 아무것도 안 함

function fxDraw() {
  const cv = $('fxc'); if (!cv) return;

      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(19,32,42,.55)'; ctx.strokeText(p.glyph, 0, 0); ctx.fillText(p.glyph, 0, 0);
    } else if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill(); } else ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);

  }

    const p = t.t / t.dur, s = p < 0.15 ? 0.4 + 0.8 * (p / 0.15) * 1.0 : 1.2 - 0.2 * Math.min(1, (p - 0.15) * 4);

    let tx = 0;
    if (t.img && t.img.complete) { const w = ctx.measureText(t.str).width, d = t.size * 1.15; tx = d / 2; ctx.drawImage(t.img, -w / 2 - d / 2 - 2, -d / 2, d, d); }

// ───────── 보드 그리기: 타일은 DOM, 위치·크기·번쩍임은 매 프레임 타일 상태로 ─────────
let geo = { size: 0, step: 0, pad: 0 };
const tileEls = new Map();
const tileHex = {};
function layout() {
  const el = $('board');
  // 보드는 가로폭을 꽉 채움. 세로가 모자라면 손님 영역을 줄이고(최소 236px), 그래도 모자랄 때만 보드를 줄임
  const full = el.parentElement.clientWidth;
  const rail = $('rail');
  rail.style.height = '';
  const railH = rail.getBoundingClientRect().height;
  const spare = innerHeight - el.getBoundingClientRect().top - 14 - full * ROWS / COLS;
  if (spare < 0) rail.style.height = Math.max(190, railH + spare) + 'px';
  const room = innerHeight - el.getBoundingClientRect().top - 14;
  el.style.width = Math.min(full, room * COLS / ROWS) + 'px';
  const W = el.clientWidth, H = el.clientHeight;
  const pad = 6, gap = 5;
  const size = Math.min((W - pad * 2 - gap * (COLS - 1)) / COLS, (H - pad * 2 - gap * (ROWS - 1)) / ROWS);
  geo = { size, step: size + gap, pad };
  $('clip').querySelectorAll('.cellbg').forEach(x => x.remove());
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const b = document.createElement('div');
    b.className = 'cellbg';
    Object.assign(b.style, { left: pad + c * geo.step + 'px', top: pad + r * geo.step + 'px', width: size + 'px', height: size + 'px' });
    $('clip').prepend(b);
  }
  tileEls.forEach(e => sizeTile(e));
  const cv = $('fxc'), dpr = devicePixelRatio || 1;
  cv.style.width = (W + FX.M * 2) + 'px'; cv.style.height = (H + FX.M * 2) + 'px';
  cv.width = Math.round((W + FX.M * 2) * dpr); cv.height = Math.round((H + FX.M * 2) * dpr);
  const cs = getComputedStyle(document.documentElement);
  Object.keys(TILES).forEach(k => { tileHex[k] = cs.getPropertyValue('--t-' + k).trim() || '#cccccc'; });
}
function sizeTile(e) { e.style.width = geo.size + 'px'; e.style.height = geo.size + 'px'; e.style.setProperty('--ts', geo.size + 'px'); }

const cy = r => geo.pad + r * geo.step + geo.size / 2;

  let e = tileEls.get(t);

    e = document.createElement('div');

    e.style.background = TILES[t.type].color;
    e.innerHTML = `<span class="nm${TILES[t.type].name.length > 6 ? ' long' : ''}">${TILES[t.type].name}</span><span class="ic">${TILES[t.type].icon}</span>`;
    sizeTile(e);

  }

}
function drawTiles() {
  const now = performance.now();
  tileEls.forEach((e, t) => {
    const x = geo.pad + t.x * geo.step, y = geo.pad + t.y * geo.step;
    // 숨쉬기: 타일마다 박자가 조금씩 다르게 크게 들썩임 (가운데를 0.96으로 낮춰 이웃 타일과 덜 겹치게: 0.86~1.06)
    const br = 0.96 + BREATH * Math.sin(now / 1000 * Math.PI * 2 / 2.2 + t.phase);
    e.style.transform = `translate(${x + (t.ox || 0)}px, ${y + (t.oy || 0)}px) scale(${t.scale * t.sx * br}, ${t.scale * t.sy * br})`;
    e.style.opacity = t.alpha;

}
function renderBoard() {
  const live = new Set();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = S.board.get(r, c);
    if (!t) continue;
    live.add(t);
    tileEl(t).classList.toggle('sel', !!S.sel && S.sel.r === r && S.sel.c === c);
  }
  tileEls.forEach((e, t) => { if (!live.has(t)) { e.remove(); tileEls.delete(t); } });
}
function clearBoardEls() { tileEls.forEach(e => e.remove()); tileEls.clear(); }

// ───────── 매치3 진행 ─────────
function slide(t, r, c, ms) {
  const x0 = t.x, y0 = t.y;
  return tween(ms, p => { t.x = x0 + (c - x0) * p; t.y = y0 + (r - y0) * p; }, EASE.outQuad);
}
async function trySwap(a, b) {
  if (S.busy || !S.running || S.paused || S.reading) return;
  S.busy = true; S.sel = null; S.idle = 0; clearHint(); renderBoard();
  const ta = S.board.get(a.r, a.c), tb = S.board.get(b.r, b.c);
  SFX.swap();
  if (!S.board.wouldMatch(a, b)) {
    await Promise.all([slide(ta, b.r, b.c, 110), slide(tb, a.r, a.c, 110)]);
    SFX.nope();
    await Promise.all([slide(ta, a.r, a.c, 130), slide(tb, b.r, b.c, 130)]);
    S.busy = false;
    return;
  }
  S.board.swap(a, b);
  await Promise.all([slide(ta, b.r, b.c, 120), slide(tb, a.r, a.c, 120)]);
  await resolve();
  S.busy = false;
}
function popTile(t) {
  const x = cx(t.x), y = cy(t.y);
  fxBurst(x, y, tileHex[t.type], 8 + Math.floor(Math.random() * 5));
  fxRing(x, y, geo.size * 0.25, geo.size, 150);
  if (JUICE <= 0) { t.alpha = 0; return Promise.resolve(); }
  const s1 = 1 + 0.4 * JUICE;

}

  t.y = Math.round(t.y);

  const A = 0.15 * JUICE;
  if (A <= 0) return;
  tween(180, p => {
    const f = p < 0.2 ? p / 0.2 : Math.exp(-6 * (p - 0.2)) * Math.cos((p - 0.2) * Math.PI * 3);

}

  const g = FALL_GRAVITY / 1e6; // 칸/ms²
  return Promise.all(falls.map(f => {
    const t = f.tile, d = f.toR - f.fromY;
    t.x = f.c; t.y = f.fromY;
    tileEl(t);
    return tween(Math.sqrt((2 * d) / g), p => { t.y = f.fromY + d * p; }, EASE.inQuad).then(() => land(t));
  }));
}

// 맞춘 부품: 타일에서 위로 떠올라 → 화면 가운데 크게 → 작아지며 클라이언트 말풍선 칸으로 날아가 붙음
const flying = { n: 0 };
async function showcase(p, x0, y0, delay) {
  const claim = claimNeed(p);
  const el = document.createElement('div');
  el.className = 'showcase';
  el.innerHTML = `${TILES[p].icon}<b>${TILES[p].name}</b>`;
  const set = (x, y, s) => { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = `translate(-50%, -50%) scale(${s})`; };
  set(x0, y0, 1);
  flying.n++;
  await wait(delay);
  document.body.appendChild(el);
  const k = flying.n;
  const midX = innerWidth / 2 + ((k % 3) - 1) * 70, midY = innerHeight * 0.42;
  await tween(150, q => set(x0, y0 - 34 * q, 1 + 0.4 * q), EASE.outQuad);
  await tween(220, q => set(x0 + (midX - x0) * q, y0 - 34 + (midY - y0 + 34) * q, 1.4 + 1.8 * q), EASE.outQuad);
  SFX.part();
  await wait(170);
  // 받을 손님이 없으면 화면 밖으로 날려버림
  const live = claim && claim.c === S.slots[claim.i] && claim.c.state === 'wait';
  if (!live) {
    if (claim) claim.c.needs[claim.k].res = false;
    el.style.filter = 'grayscale(1)';
    SFX.waste();
    const dir = Math.random() < 0.5 ? -1 : 1;
    await tween(380, q => { set(midX + dir * innerWidth * 0.7 * q, midY - 120 * q + 220 * q * q, 3.2 - 1.8 * q); el.style.opacity = 1 - q * 0.6; el.style.rotate = (dir * 540 * q) + 'deg'; }, EASE.inQuad);
    el.remove(); flying.n--;
    S.dead++; renderStock();
    return;
  }
  const target = document.querySelector(`[data-slot="${claim.i}"] [data-need="${claim.k}"]`);
  const [tx, ty] = target ? centerOf(target) : [midX, 30];
  await tween(300, q => set(midX + (tx - midX) * q, midY + (ty - midY) * q, 3.2 - 2.6 * q), EASE.inQuad);
  el.remove();
  flying.n--;
  if (live && claim.c.state === 'wait') {
    claim.c.needs[claim.k].got = true;
    SFX.stick();
    renderClients();
    document.querySelector(`[data-slot="${claim.i}"]`)?.classList.add('bump');
    setTimeout(() => document.querySelector(`[data-slot="${claim.i}"]`)?.classList.remove('bump'), 200);
    if (claim.c.needs.every(nd => nd.got)) complete(claim.i);
  } else {
    // 날아가는 사이 손님이 떠났으면 악성재고
    claim.c.needs[claim.k].res = false;
    S.dead++; renderStock();
  }
}

async function resolve() {
  let chain = 0;
  for (;;) {
    const m = S.board.findMatches();
    if (!m.groups.length) break;
    chain++;
    S.chainMax = Math.max(S.chainMax, chain);
    const bigGroups = m.groups.filter(g => g.cells.length >= 4);
    // 히트스톱: 연쇄나 4개 이상이면 터지기 직전 아주 잠깐 멈춤
    if (JUICE > 0 && (chain >= 2 || bigGroups.length)) await wait(35 * JUICE);
    SFX.match(chain - 1); vibrate(10);
    let sx = 0, sy = 0;
    for (const i of m.matched) { const [r, c] = S.board.rc(i); sx += cx(c); sy += cy(r); }
    if (chain >= 2) { fxText(sx / m.matched.size, sy / m.matched.size, `x${chain}`, 30 + chain * 8, '#FFD84A'); $('chain').textContent = `연쇄 ×${chain}`; }
    let order = 0;
    for (const g of m.groups) {
      // 3개 = 부품 1, 4개 = 2, 5개 이상 = 3
      const gain = Math.min(3, g.cells.length - 2);
      const mid = g.cells[Math.floor(g.cells.length / 2)];
      const midEl = tileEls.get(S.board.cells[mid]);
      const [x0, y0] = midEl ? centerOf(midEl) : [innerWidth / 2, innerHeight / 2];
      for (let k = 0; k < gain; k++) showcase(g.type, x0, y0, (order++) * 140);
      const pts = 10 * g.cells.length * chain;
      S.score += pts;
      let gx = 0, gy = 0;
      g.cells.forEach(i => { const [r, c] = S.board.rc(i); gx += cx(c); gy += cy(r); });
      fxText(gx / g.cells.length, gy / g.cells.length + (chain >= 2 ? 26 : 0), gain > 1 ? `${TILES[g.type].img ? '' : TILES[g.type].icon}×${gain}` : `+${pts}`, gain > 1 ? 26 : 18, gain > 1 ? '#FFD84A' : '#ffffff', gain > 1 ? TILES[g.type].img : null);
    }
    const doomed = [...m.matched].map(i => S.board.cells[i]);
    await Promise.all(doomed.map(popTile));
    for (const i of m.matched) S.board.cells[i] = null;
    renderBoard();
    renderHud();
    const falls = S.board.collapse();
    // 4개 이상 맞춘 줄마다 휴머노이드가 하나씩 위에서 내려옴
    for (const g of bigGroups) {
      const cols = new Set(g.cells.map(i => S.board.rc(i)[1]));
      const cand = falls.filter(f => f.fromY < 0 && f.tile.type !== 'hum' && cols.has(f.c));
      const pick = (cand.length ? cand : falls.filter(f => f.fromY < 0 && f.tile.type !== 'hum'))[0];
      if (pick) {
        pick.tile.type = 'hum';
        SFX.hum();
        const W = $('board').clientWidth;
        fxText(Math.min(Math.max(cx(pick.c), 90), W - 90), cy(0) + 10, '🤖 휴머노이드 투입!', 18, '#FFD84A');
      }
    }
    await animateFalls(falls);
  }
  setTimeout(() => { $('chain').textContent = ''; }, 700);
  if (!S.board.findMove()) {
    banner('🔀 섞는 중');
    await wait(400);
    S.board.shuffle();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const t = S.board.get(r, c); t.x = c; t.y = r; }
    renderBoard();
  }
}
// 손님이 필요로 하는 부품이 조금 더 자주 떨어짐 (휴머노이드는 여기서 안 나옴)
function biasedType() {
  const need = waiting().flatMap(c => c.needs.filter(n => !n.res).map(n => n.p)).filter(p => S.def.tiles.includes(p));
  if (need.length && Math.random() < 0.12) return need[Math.floor(Math.random() * need.length)];
  return S.def.tiles[Math.floor(Math.random() * S.def.tiles.length)];
}

// 오래 손을 안 대면 맞출 수 있는 두 칸을 반짝임
let hintCells = [];
function clearHint() { hintCells.forEach(t => tileEls.get(t)?.classList.remove('hint')); hintCells = []; }
function showHint() {
  const mv = S.board.findMove();
  if (!mv) return;
  hintCells = mv.map(p => S.board.get(p.r, p.c)).filter(Boolean);
  hintCells.forEach(t => tileEl(t).classList.add('hint'));
}

// ───────── 입력: 끌어서 스왑, 또는 두 칸 차례로 탭 ─────────
let drag = null;
function cellAt(x, y) {
  const r0 = $('board').getBoundingClientRect();
  const c = Math.floor((x - r0.left - geo.pad + 2) / geo.step), r = Math.floor((y - r0.top - geo.pad + 2) / geo.step);
  return r >= 0 && r < ROWS && c >= 0 && c < COLS ? { r, c } : null;
}
const adjacent = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
$('board').addEventListener('pointerdown', e => {
  if (!S.running || S.paused || S.busy || S.reading) return;
  const cell = cellAt(e.clientX, e.clientY);
  if (!cell) return;
  if (S.sel && adjacent(S.sel, cell)) { const a = S.sel; S.sel = null; trySwap(a, cell); return; }
  const same = S.sel && S.sel.r === cell.r && S.sel.c === cell.c;
  S.sel = same ? null : cell;
  renderBoard();
  drag = { cell, x: e.clientX, y: e.clientY, id: e.pointerId };
  try { $('board').setPointerCapture(e.pointerId); } catch (_) {}
});

  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < geo.step * 0.3) return;
  const { r, c } = drag.cell;
  const to = Math.abs(dx) > Math.abs(dy) ? { r, c: c + Math.sign(dx) } : { r: r + Math.sign(dy), c };
  drag = null; S.sel = null;
  if (S.board.inBounds(to.r, to.c)) trySwap({ r, c }, to); else renderBoard();
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
$('board').addEventListener('pointerup', endDrag);
$('board').addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => { if (S.board) { layout(); renderBoard(); } });

// ───────── 효과 ─────────
function centerOf(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function floatText(el, text, kind) {
  if (!el) return;
  const [x, y] = centerOf(el);
  const f = document.createElement('div');
  f.className = 'float' + (kind ? ' ' + kind : ''); f.textContent = text;
  f.style.left = x + 'px'; f.style.top = (y - 20) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 950);
}
function fly(fromEl, toEl, icon) {
  if (!fromEl || !toEl) return;
  const [x0, y0] = centerOf(fromEl), [x1, y1] = centerOf(toEl);
  const f = document.createElement('div');
  f.className = 'flyer'; f.textContent = icon;
  f.style.left = x0 + 'px'; f.style.top = y0 + 'px';
  document.body.appendChild(f);
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.left = x1 + 'px'; f.style.top = y1 + 'px'; f.style.transform = 'translate(-50%, -50%) scale(.7)'; }));
  setTimeout(() => f.remove(), 340);
}
function banner(text, delay) {
  setTimeout(() => {
    const b = document.createElement('div');
    b.className = 'banner'; b.textContent = text;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1250);
  }, delay || 0);
}

// ───────── 진행 ─────────
function loop(t) {
  const dt = Math.min(0.1, (t - (S.last || t)) / 1000);
  S.last = t;
  if (S.running && !S.paused) {
    S.clock += dt;
    clientTick(dt);
    if (S.running) spawnTick(dt);
    updateBars();
    if (!S.busy && (S.idle += dt) > 6 && !hintCells.length) showHint();
  }
  ambient(dt, S.running && !S.paused);
  updateTweens(dt * 1000);
  fxUpdate(dt);
  if (S.board) drawTiles();
  fxDraw();
  requestAnimationFrame(loop);
}
function startLevel() {
  S.def = levelDef(S.lv);
  stage.q.length = 0;
  Object.assign(S, { reading: false, running: true, paused: false, busy: false, slots: [null, null, null], spawned: 0, done: 0, missed: 0, spawnT: 0, dead: 0, stars: 0, sel: null, idle: 0 });
  $('overlay').hidden = true;
  clearBoardEls();
  S.board = new Board(COLS, ROWS, S.def.tiles);
  S.board.randomType = biasedType;
  S.board.fillInitial();
  layout(); renderBoard();
  renderClients(); renderStock(); renderHud();
  banner(`${S.lv}단계`);
  const fresh = NEW_AT[S.lv];
  if (fresh) banner(`NEW ${fresh.map(r => ROBOTS[r].icon).join(' ')}`, 1100);
  addClient(0);
  S.spawnT = 2;
}
function levelClear() {
  if (!S.running) return;
  S.running = false;
  const n = levelTarget(S.lv);
  // 단계 별: 손님들이 준 별의 평균 (떠난 손님은 0개)
  const avg = S.stars / Math.max(1, S.done + S.missed);
  const stars = avg >= 2.5 ? 3 : avg >= 1.8 ? 2 : 1;
  const bonus = stars * 300;
  S.score += bonus; S.best = Math.max(S.best, S.score); save();
  SFX.clear();
  banner(`CLEAR ${'⭐'.repeat(stars)} 평균 ${avg.toFixed(1)}`);
  S.lv++;
  setTimeout(() => { if (!S.paused) startLevel(); else S.pendingStart = true; }, 2400);
  renderHud();
}

// ───────── 오버레이 ─────────
const litSectors = () => new Set([...S.dex].map(id => secKey(O[id])));
const logItem = o => `<div class="log-item"><span class="i">${o.icon}</span><span class="h">${o.ind}${o.who ? ' · ' + o.who : ''} ${ROBOTS[o.want].icon} ${robotLabel(o)}<small>${o.sec}</small></span><span>${o.fact}</span></div>`;
const mapHtml = () => { const lit = litSectors(); return `<div class="map">${SECTORS.map(s => `<div class="sector${lit.has(s.key) ? ' lit' : ''}"><small>${s.key}</small>${s.icon}</div>`).join('')}</div>`; };
const recipesHtml = () => `<div class="recipes">${Object.values(ROBOTS).map(r => `<span>${r.parts.map(p => TILES[p].icon + (p === 'hum' ? '×3' : '')).join(' ')} = ${r.icon} ${r.name}</span>`).join('')}</div>`;
function openSheet(html, pause) {
  $('sheet').innerHTML = html;
  $('overlay').hidden = false;
  $('sheet').scrollTop = 0;
  if (pause) S.paused = true;
  $('sheet').querySelector('button')?.focus();
}
function resume() {
  $('overlay').hidden = true; S.paused = false;
  if (S.pendingStart) { S.pendingStart = false; startLevel(); }
}
const HELP = `
  <h2>ROBOT RU$H</h2>
  <div class="steps">
    <div class="step">📨 <span>새 주문서가 뜨면 눌러서 수락! (어느 업종이 어떤 로봇을 사는지 읽어 보세요)</span></div>
    <div class="step">🛞🛞🛞 <span>같은 부품 3개를 맞추면 주문서로 날아가 붙어요</span></div>
    <div class="step">🤖 <span>4개 이상 맞추면 휴머노이드가 하나 내려와요. 휴머노이드도 엔드포인트 SI(로봇 집게)를 붙여야 납품돼요. 오른쪽 좁은 주문서는 늘 휴머노이드 손님이라 버릴 일이 없어요</span></div>
  </div>
  <p>주문서 아래 바가 다 떨어지면 😢 계약 취소. 다 채우면 남은 시간만큼 ⭐을 받아요.</p>
  ${recipesHtml()}
  <button class="primary" type="button" data-act="begin">시작 ▶</button>`;
function summaryHtml() {
  const seen = [...new Set(S.runServed)].map(id => logItem(O[id])).join('');
  return `
    <h2>⏸ ${S.lv}단계</h2>
    <div class="big-stats"><span>💰<b class="num">${S.score}</b></span><span>🏆<b class="num">${S.best}</b></span><span>⛓<b class="num">${S.chainMax}</b></span></div>
    <button class="primary" type="button" data-act="close">계속 ▶</button>
    <span class="lbl">조합표</span>${recipesHtml()}
    <span class="lbl">산업 지도 ${litSectors().size}/${SECTORS.length}</span>${mapHtml()}
    <span class="lbl">현장 도감 ${S.dex.size}/${ORDERS.length}</span>
    <div class="log">${ORDERS.map(o => S.dex.has(o.id) ? logItem(o) : `<div class="log-item locked"><span class="i">❔</span><span class="h">???<small>${o.sec}</small></span><span>아직 납품 전</span></div>`).join('')}</div>
    <p>출처: 로봇 스터디 2차 발제 자료 (2026.09.21). 매치3 보드 로직은 Bosses of Our World에서 가져왔어요.</p>`;
}
$('sheet').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') resume();
  else if (act === 'begin') startLevel();
});
$('btnPause').addEventListener('click', () => { if ($('overlay').hidden && S.running) openSheet(summaryHtml(), true); });
const syncSound = () => { $('btnSound').innerHTML = `sound <b class="${S.sound ? 'on' : 'off'}">${S.sound ? 'O' : 'X'}</b>`; $('btnSound').setAttribute('aria-pressed', S.sound ? 'true' : 'false'); };
$('btnSound').addEventListener('click', () => {
  S.sound = !S.sound; syncSound();
  try { localStorage.setItem('robotsi.sound', S.sound ? '1' : '0'); } catch (e) {}
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) $('btnPause').click(); });

syncSound(); renderHud();
openSheet(HELP);
requestAnimationFrame(loop);
</script>
