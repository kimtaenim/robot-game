<title>로봇 SI 납품소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 주문표 레일 → 카드 테이블(겹치면 조합) → 부품 덱. 카드 게임 테이블 같은 작업장 */
:root {
  --bg: #DDE4E8;
  --table: #C9D4DA;
  --card: #FFFDF7;
  --card-head: #E9E2D0;
  --surface: #FFFFFF;
  --surface-2: #F2F5F7;
  --ink: #13202A;
  --muted: #586977;
  --line: #B7C3CB;
  --accent: #F0B400;
  --gold-soft: #FFF3C9;
  --steel: #1C5A86;
  --steel-soft: #DCE8F1;
  --good: #24804D;
  --warn: #C77F00;
  --bad: #C03A2A;
  --scrim: rgba(12, 20, 27, 0.55);
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151A; --table: #1A242C; --card: #252F38; --card-head: #33404B; --surface: #18212A; --surface-2: #202B35;
    --ink: #E4EBF0; --muted: #91A2AF; --line: #3A4855; --accent: #F5C12B; --gold-soft: #3A3115;
    --steel: #72AEDC; --steel-soft: #1D3346; --good: #3FA86C; --warn: #E0A030; --bad: #E0594A; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151A; --table: #1A242C; --card: #252F38; --card-head: #33404B; --surface: #18212A; --surface-2: #202B35;
  --ink: #E4EBF0; --muted: #91A2AF; --line: #3A4855; --accent: #F5C12B; --gold-soft: #3A3115;
  --steel: #72AEDC; --steel-soft: #1D3346; --good: #3FA86C; --warn: #E0A030; --bad: #E0594A; --scrim: rgba(0, 0, 0, 0.65); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { box-sizing: border-box; height: 100%; max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 14px; display: flex; flex-direction: column; gap: 10px; }

/* 상단 바 */
.top { display: flex; align-items: center; gap: 12px; font-size: 16px; }
.lv { font-family: var(--font-display); font-size: 18px; }
.top .stat { display: flex; align-items: center; gap: 4px; }
.top .stat b { font-size: 17px; }
.goal { flex: 1; min-width: 0; height: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; position: relative; overflow: visible; }
.goal i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 6px; }
.goal .st { position: absolute; top: -7px; font-size: 13px; transform: translateX(-50%); filter: grayscale(1); opacity: .5; }
.goal .st.on { filter: none; opacity: 1; }
.tools { display: flex; gap: 6px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; font-size: 15px; padding: 0; }
.subbar { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.subbar .combo { font-family: var(--font-display); font-size: 16px; color: var(--muted); }
.subbar .combo.hot { color: var(--accent); }
.subbar .meter { flex: 1; height: 5px; background: var(--surface); border-radius: 4px; overflow: hidden; }
.subbar .meter i { display: block; height: 100%; width: 0; background: var(--accent); }

/* 주문표 */
.rail { flex: 1.25 1 0; min-height: 170px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.ticket { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px 10px 4px 4px; padding: 10px 5px 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; box-sizing: border-box; box-shadow: 0 2px 0 var(--line); }
.ticket::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: 10px 10px 0 0; background: var(--steel); }
.ticket.slot { border-style: dashed; background: transparent; box-shadow: none; cursor: default; }
.ticket.slot::before { display: none; }
.ticket .site { font-size: 38px; line-height: 1.1; margin-top: 2px; }
.ticket .who { font-size: 12.5px; font-weight: 700; max-width: 100%; text-align: center; line-height: 1.2; word-break: keep-all; }
.ticket .ask { flex: 1; width: 100%; min-height: 64px; background: var(--steel-soft); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 3px 0; box-sizing: border-box; }
.ticket .ask .icons { display: flex; gap: 1px; }
.ticket .ask .icons span { font-size: 46px; line-height: 1.05; position: relative; }
.ticket .ask .icons span.done { opacity: .28; }
.ticket .ask .icons.two span { font-size: 26px; }
.ticket .ask .rc { font-size: 15px; margin-top: 3px; text-align: center; line-height: 1.25; padding-inline: 2px; }
.ticket.bulk { grid-column: 1 / -1; background: var(--gold-soft); border: 2px solid var(--accent); flex-direction: row; justify-content: space-around; align-items: center; gap: 10px; padding: 10px 12px; }
.ticket.bulk::before { background: var(--accent); }
.bulk .siren { font-family: var(--font-display); font-size: 20px; color: var(--ink); text-align: center; line-height: 1.2; }
.bulk .siren small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.bulk .count { font-family: var(--font-display); font-size: 44px; color: var(--steel); line-height: 1; text-align: center; }
.bulk .count small { display: block; font-size: 30px; }
.bulk .left { font-family: var(--font-mono); font-size: 13px; color: var(--muted); text-align: center; }
.bulk .fact { font-size: 12px; color: var(--muted); line-height: 1.45; max-width: 16em; }
.app.fever { background: var(--gold-soft); }
.fever-tag { display: none; font-family: var(--font-display); color: var(--accent); font-size: 16px; text-shadow: 0 1px 0 var(--ink); }
.app.fever .fever-tag { display: inline; }
.ticket .ask .t { font-size: 12px; font-weight: 700; color: var(--steel); text-align: center; line-height: 1.2; padding-inline: 2px; }
.ticket .ask .q { font-family: var(--font-display); font-size: 26px; color: var(--steel); line-height: 1; }
.ticket .qty { position: absolute; top: -7px; right: -5px; background: var(--ink); color: var(--bg); border-radius: 9px; font-size: 11px; font-weight: 700; padding: 1px 6px; }
.ticket .mood { position: absolute; top: 4px; left: 5px; font-size: 18px; line-height: 1; }
.ticket .task { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.2; word-break: keep-all; }
.ticket .pat { width: 100%; height: 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; flex: none; }
.ticket .pat i { display: block; height: 100%; background: var(--good); transform-origin: left; }
.ticket .pat i.warn { background: var(--warn); }
.ticket .pat i.crit { background: var(--bad); }
.ticket.target { box-shadow: 0 0 0 2px var(--steel); }
.ticket.over { box-shadow: 0 0 0 3px var(--accent); }
.ticket.enter { animation: drop .3s ease-out; }
.ticket.shake { animation: shake .4s; }
.ticket.bump { animation: bump .3s; }
.more { position: absolute; bottom: -8px; right: -5px; background: var(--accent); color: #1A1400; border-radius: 9px; font-size: 11px; font-weight: 700; padding: 1px 6px; }
@keyframes drop { from { transform: translateY(-20px) rotate(-3deg); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@keyframes bump { 50% { transform: scale(1.06); } }

/* 카드 테이블 */
.table { flex: none; background: var(--table); border-radius: 12px; padding: 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.spot { border: 2px dashed var(--line); border-radius: 10px; background: transparent; padding: 0; height: 60px; touch-action: none; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 0; height: 60px; display: flex; flex-direction: column; overflow: hidden; touch-action: none; box-shadow: 0 3px 0 var(--line); transition: transform .12s; }
.card .hd { background: var(--card-head); font-size: 9.5px; font-weight: 700; padding: 2px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .ic { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 26px; line-height: 1; }
.card .ic.multi { font-size: 17px; flex-wrap: wrap; gap: 0 1px; padding-inline: 2px; }
.card.robot { border-color: var(--steel); }
.card.robot .hd { background: var(--steel); color: var(--surface); }
.card.sel { transform: translateY(-6px) rotate(-2deg); box-shadow: 0 0 0 3px var(--accent), 0 8px 0 var(--line); }
.card.dim { opacity: .3; }
.card.pop { animation: pop .35s ease-out; }
.card.nope, .spot.nope { animation: shake .35s; }
.spot.drop, .card.drop { box-shadow: 0 0 0 3px var(--accent); }
@keyframes pop { 0% { transform: scale(.5) rotate(-8deg); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* 덱 */
.deck { flex: 1 1 0; min-height: 150px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 8px; }
.pile { flex: 1; min-width: 0; position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; touch-action: none; box-shadow: 0 2px 0 var(--line), 0 4px 0 var(--card-head), 0 5px 0 var(--line); }
.pile .ic { font-size: 32px; line-height: 1.1; }
.pile .nm { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pile.robot { border-color: var(--steel); }
.pile:active { transform: translateY(2px); }
.pile.lock { opacity: .25; pointer-events: none; }
.pile.fresh::after { content: 'NEW'; position: absolute; top: -8px; right: -4px; background: var(--accent); color: #1A1400; font-size: 9px; font-weight: 700; border-radius: 6px; padding: 1px 4px; }

.ghost { position: fixed; z-index: 40; pointer-events: none; font-size: 40px; transform: translate(-50%, -65%) rotate(-6deg); filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
.float { position: fixed; z-index: 35; pointer-events: none; font-family: var(--font-display); font-size: 24px; color: var(--good); transform: translate(-50%, 0); animation: floatUp .9s ease-out forwards; text-shadow: 0 1px 0 var(--surface); }
.float.big { font-size: 34px; color: var(--accent); }
@keyframes floatUp { to { transform: translate(-50%, -54px); opacity: 0; } }
.banner { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 36; pointer-events: none; font-family: var(--font-display); font-size: 40px; color: var(--accent); text-shadow: 0 2px 0 var(--ink); animation: banner 1.2s ease-out forwards; white-space: nowrap; }
@keyframes banner { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1); opacity: 0; } }

.flyer { position: fixed; z-index: 38; pointer-events: none; font-size: 36px; transform: translate(-50%, -50%); transition: left .22s ease-in, top .22s ease-in, transform .22s ease-in; }
.card.idle { animation: shake .35s; }
.par { font-size: 11px; color: var(--muted); white-space: nowrap; }

/* 오버레이 */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 16px; width: 100%; max-width: 520px; max-height: 88%; overflow: auto; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; user-select: text; -webkit-user-select: text; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.sheet p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
.steps { display: grid; gap: 10px; }
.step { display: flex; align-items: center; gap: 12px; font-size: 26px; }
.step span { font-size: 14px; color: var(--muted); }
.stars { font-size: 44px; letter-spacing: 6px; }
.stars span { display: inline-block; animation: pop .5s ease-out both; }
.stars span.off { filter: grayscale(1); opacity: .3; }
.big-stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; }
.big-stats b { font-size: 24px; margin-left: 4px; }
.map { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.sector { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; position: relative; filter: grayscale(1); opacity: .35; }
.sector small { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--muted); font-weight: 700; }
.sector.lit { filter: none; opacity: 1; border: 1px solid var(--steel); background: var(--steel-soft); }
.sector.new { animation: pop .6s ease-out .2s both; box-shadow: 0 0 0 2px var(--accent); }
.unlock { display: flex; align-items: center; gap: 14px; background: var(--gold-soft); border: 2px solid var(--accent); border-radius: 14px; padding: 12px 14px; }
.unlock .ic { font-size: 44px; animation: pop .6s ease-out; }
.unlock b { font-family: var(--font-display); font-weight: 400; font-size: 20px; display: block; }
.unlock span { font-size: 18px; color: var(--muted); }
.log { display: grid; gap: 6px; }
.log-item { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: start; border-bottom: 1px solid var(--line); padding: 7px 0; font-size: 13px; line-height: 1.5; }
.log-item .i { font-size: 24px; grid-row: span 2; }
.log-item .h { font-weight: 700; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.log-item .h small { color: var(--steel); font-size: 11px; }
.log-item.locked { color: var(--muted); }
.primary { align-self: flex-start; background: var(--accent); color: #1A1400; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 16px; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }

@media (prefers-reduced-motion: reduce) {
  .ticket.enter, .ticket.shake, .ticket.bump, .card.pop, .card.nope, .spot.nope, .float, .banner, .sector.new, .unlock .ic, .stars span { animation: none; }
  .card { transition: none; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <span class="lv" id="lv">1단계</span>
    <span class="stat" aria-label="걸린 시간">⏱<b class="num" id="clock">0:00</b></span>
    <span class="goal" aria-label="단계 진행"><i id="goalBar"></i></span>
    <span class="stat" aria-label="납품 진행">📦<b class="num" id="prog">0/8</b></span>
    <span class="tools">
      <button class="tool" id="btnSound" type="button" aria-label="소리 켜고 끄기">🔊</button>
      <button class="tool" id="btnDex" type="button" aria-label="현장 도감">📖</button>
      <button class="tool" id="btnPause" type="button" aria-label="일시정지">⏸</button>
    </span>
  </header>
  <div class="subbar"><span class="num" aria-label="점수">💰 <b id="score">0</b></span><span class="par" id="par"></span><span class="combo" id="combo">🔥0</span><span class="fever-tag">FEVER ×2</span><span class="meter"><i id="flowBar"></i></span></div>

  <section class="rail" id="rail" aria-label="주문표"></section>
  <section class="table" id="table" aria-label="카드 테이블"></section>
  <section class="deck" id="deck" aria-label="부품 덱"></section>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>

<script>
// ───────── 부품 카드 11종: 본체·이동부·SI(도구·손·센서). 아이콘은 임시 이모지 ─────────
const PARTS = {
  wheel:    { icon: '🛞', name: '바퀴' },
  auto:     { icon: '🧭', name: '자율주행' },
  floor:    { icon: '🚧', name: '바닥 공사' },
  arm:      { icon: '🦾', name: '협동로봇 팔' },
  quad:     { icon: '🐕', name: '4족 본체' },
  humanoid: { icon: '🧍', name: '휴머노이드' },
  torch:    { icon: '🔥', name: '용접 토치' },
  pan:      { icon: '🍳', name: '조리 도구' },
  gripper:  { icon: '🤏', name: '그리퍼' },
  hand:     { icon: '🖐️', name: '로봇 손' },
  sensor:   { icon: '📷', name: '점검 센서' },
};
const DECK = ['wheel', 'auto', 'floor', 'arm', 'quad', 'humanoid', 'torch', 'pan', 'gripper', 'hand', 'sensor'];

// ───────── 납품 로봇 9종 = 부품을 쌓아 올린 것 (순서 상관없음) ─────────
// 바퀴 + 자율주행(센서·SW) = AMR / 바퀴 + 바닥 공사(마그넷·QR 경로) = AGV
// 협동로봇 팔은 도구를 붙여야 일함(SI) / AMR 위에 협동로봇 = 모바일 매니퓰레이터(⑧ LG엔솔)
// 4족은 점검 센서를 얹어 순찰(⑦ 포스코, ㉖ 경찰) / 휴머노이드는 손을 붙여 작업 / AMR 하체 휴머노이드(② 티로보틱스)
const ROBOTS = {
  agv:  { icon: '🛤️', name: 'AGV',               parts: ['wheel', 'floor'] },
  amr:  { icon: '🚚', name: 'AMR',               parts: ['wheel', 'auto'] },
  weld: { icon: '🧑‍🏭', name: '용접 협동로봇',      parts: ['arm', 'torch'] },
  cook: { icon: '🧑‍🍳', name: '조리 협동로봇',      parts: ['arm', 'pan'] },
  pick: { icon: '📥', name: '피킹로봇',           parts: ['arm', 'gripper'] },
  mm:   { icon: '🚜', name: '모바일 매니퓰레이터', parts: ['wheel', 'auto', 'arm', 'gripper'] },
  quad: { icon: '🐕‍🦺', name: '점검 4족로봇',      parts: ['quad', 'sensor'] },
  hum:  { icon: '🚶', name: '휴머노이드',         parts: ['humanoid', 'hand'] },
  humw: { icon: '🤖', name: '바퀴형 휴머노이드',   parts: ['wheel', 'auto', 'humanoid', 'hand'] },
};
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const robotOf = stack => Object.keys(ROBOTS).find(r => sameSet(ROBOTS[r].parts, stack)) || null;
const UNLOCKS = [['amr', 'agv'], ['weld', 'cook', 'pick'], ['mm'], ['quad'], ['hum', 'humw']];
const unlockedAt = lv => UNLOCKS.slice(0, Math.max(0, Math.min(lv, UNLOCKS.length))).flat();

// ───────── 현장: 자료가 로봇 종류를 직접 밝힌 곳만 (로봇 스터디 2차 발제 자료, 2026.09.21) ─────────
const ORDERS = [
  { id: 'port',     wants: ['agv', 'agv'],   icon: '⚓', who: '부산항',      sec: '⑮ 항만',        fact: '국내 첫 완전 자동화 부두에서 AGV가 시스템 지시대로 컨테이너를 옮겨요.' },

// ───────── 효과음 ─────────
let ac = null;
function tone(freq, dur, type, delay, vol) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol || 0.12, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const SFX = {
  card:  n => tone(560 + n * 110, 0.06, 'triangle', 0, 0.08),

  half:  () => tone(880, 0.1, 'triangle', 0, 0.1),
  done:  n => [523, 659, 784, 1047, 1319].slice(0, 2 + Math.min(3, n)).forEach((f, i) => tone(f * (1 + Math.min(n, 10) * 0.03), 0.13, 'triangle', i * 0.05, 0.12)),
  nope:  () => tone(150, 0.14, 'sawtooth', 0, 0.06),

// ───────── 주문 ─────────
const unlocked = () => unlockedAt(S.lv);
function pickOrder() {
  if (S.intro.length) return S.intro.shift();
  const ok = new Set(unlocked());
  const fresh = new Set(UNLOCKS[S.lv - 1] || []);
  const open = new Set(S.tickets.map(t => t.order.id));
  let pool = ORDERS.filter(o => o.wants.every(w => ok.has(w)) && !open.has(o.id));
  if (!pool.length) pool = ORDERS.filter(o => o.wants.every(w => ok.has(w)));
  const weighted = pool.flatMap(o => o.wants.some(w => fresh.has(w)) ? [o, o, o] : [o]);
  return weighted[Math.floor(Math.random() * weighted.length)].id;
}
function addTicket() {
  const order = O[pickOrder()];
  // 인내심: 성격 기본값 + 큰 로봇일수록 조금 더, 단계가 오를수록 조금씩 짧게
  const size = order.wants.reduce((s, w) => s + ROBOTS[w].parts.length, 0);
  const max = (MOODS[order.mood].sec + Math.max(0, size - 2) * 1.5) * Math.max(0.6, 1 - (S.lv - 1) * 0.05);
  S.tickets.push({ order, left: order.wants.slice(), max, t: max, fresh: true });
  S.spawned++;
  SFX.ticket();
}
function spawnTick(dt) {
  if (S.bulk || S.spawned >= levelTarget(S.lv) || S.tickets.length >= RAIL) return;
  S.spawnT -= dt * (S.fever > 0 ? 1.6 : 1);
  if (S.spawnT <= 0 || !S.tickets.length) {
    addTicket(); renderRail();
    S.spawnT = levelGap(S.lv) * (0.8 + Math.random() * 0.4);
  }
}
// 지금 만들어야 하는 로봇들 (대량 수주 중이면 그 로봇만)
const wantedRobots = () => S.bulk ? [S.bulk.robot] : [...new Set(S.tickets.flatMap(t => t.left))];

// ───────── 대량 수주 이벤트 ─────────
function bulkTick(dt) {
  if (S.bulk) {
    S.bulk.t -= dt;
    if (S.bulk.t <= 0) endBulk();
    return;
  }
  if (S.lv < 2 || S.done >= levelTarget(S.lv) - 1) return;
  if ((S.bulkCD -= dt) > 0) return;
  const ok = new Set(unlocked());
  const pool = BULKS.filter(b => b.minLv <= S.lv && ok.has(b.robot));
  if (!pool.length) return;
  const b = pool[Math.floor(Math.random() * pool.length)];
  S.bulk = { ...b, got: 0, t: b.sec };
  SFX.siren();
  banner(`🚨 대량 수주! ${b.who} ${ROBOTS[b.robot].name} ${b.n}대`);
  renderRail();
}
function endBulk() {
  const b = S.bulk;
  S.bulk = null;
  S.bulkCD = 30 + Math.random() * 15;
  const full = b.got >= b.n;
  const bonus = b.got * 120 + (full ? 600 : 0);
  S.score += bonus;
  if (full) { SFX.clear(); banner(`🎉 ${b.who} ${b.n}대 완납! +${bonus}`); }
  else if (b.got) banner(`${b.who} ${b.got}/${b.n}대 +${bonus}`);
  S.spawnT = 0;
  renderRail(); renderHud();
}

// ───────── 렌더링 ─────────
function ticketHtml(t, i) {
  const o = t.order, kinds = [...new Set(o.wants)];
  const left = t.left.slice();
  const icons = o.wants.map(w => { const k = left.indexOf(w); if (k >= 0) { left.splice(k, 1); return `<span>${ROBOTS[w].icon}</span>`; } return `<span class="done">${ROBOTS[w].icon}</span>`; }).join('');
  const qty = o.wants.length > 1 ? `<span class="qty">${o.wants.length - t.left.length}/${o.wants.length}</span>` : '';
  const m = MOODS[o.mood];
  return `<button class="ticket${t.fresh ? ' enter' : ''}" type="button" data-ticket="${i}" aria-label="${o.who} 주문, ${m.label}">
    ${qty}<span class="mood" data-mood="${i}">${m.face}</span><span class="site">${o.icon}</span><span class="who">${o.who}</span>
    <span class="task">${o.task}</span>
    <span class="ask"><span class="icons${o.wants.length > 1 ? ' two' : ''}">${icons}</span>
      <span class="t">${kinds.map(w => ROBOTS[w].name).join(' + ')}</span>
      <span class="rc">${kinds.map(partsIcons).join(' ')}</span></span>
    <span class="pat" data-pat="${i}"><i></i></span>`;
}
function renderRail() {
  if (S.bulk) {
    const b = S.bulk, r = ROBOTS[b.robot];
    $('rail').innerHTML = `<div class="ticket bulk enter" data-ticket="bulk">
      <div class="siren">🚨 대량 수주<br>${b.icon} ${b.who}<small>${b.fact}</small></div>
      <div class="count">${r.icon}<small>${b.got}/${b.n}</small></div>
      <div><div class="rc" style="font-size:22px;text-align:center">${partsIcons(b.robot)}</div><div class="left" id="bulkLeft">${Math.ceil(b.t)}초</div></div>
    </div>`;
    return;
  }
  const rest = levelTarget(S.lv) - S.spawned;
  $('rail').innerHTML = Array.from({ length: RAIL }, (_, i) => {
    const t = S.tickets[i];
    const more = i === RAIL - 1 && rest > 0 ? `<span class="more">+${rest}</span>` : '';
    if (!t) return `<div class="ticket slot">${more}</div>`;
    return ticketHtml(t, i) + more + '</button>';
  }).join('');
  S.tickets.forEach(t => (t.fresh = false));
}
function renderTable(popAt) {
  $('table').innerHTML = S.table.map((st, i) => {
    if (!st.length) return `<button class="spot" type="button" data-spot="${i}" aria-label="빈 조립대"></button>`;
    const r = robotOf(st);
    const body = r ? `<span class="ic">${ROBOTS[r].icon}</span>` : `<span class="ic multi">${st.map(p => PARTS[p].icon).join('')}</span>`;
    return `<button class="card${r ? ' robot' : ''}${popAt === i ? ' pop' : ''}" type="button" data-spot="${i}" aria-label="${r ? ROBOTS[r].name : '조립 중'}"><span class="hd">${r ? ROBOTS[r].name : '조립 중'}</span>${body}</button>`;
  }).join('');
}
function renderDeck() {
  const ok = new Set(unlocked().flatMap(r => ROBOTS[r].parts));
  const before = new Set(unlockedAt(S.lv - 1).flatMap(r => ROBOTS[r].parts));
  $('deck').innerHTML = DECK.map(id => `
    <button class="pile${ok.has(id) ? '' : ' lock'}${S.lv > 1 && ok.has(id) && !before.has(id) ? ' fresh' : ''}" type="button" data-pile="${id}" aria-label="${PARTS[id].name}">
      <span class="ic">${PARTS[id].icon}</span><span class="nm">${PARTS[id].name}</span></button>`).join('');
}
function renderHud() {
  const n = levelTarget(S.lv);
  $('clock').textContent = fmt(S.elapsed);
  $('prog').textContent = `${S.done}/${n}`;
  $('goalBar').style.width = (S.done / n * 100).toFixed(1) + '%';
  $('par').textContent = S.missed ? `💢 떠난 손님 ${S.missed}` : '';
  $('score').textContent = S.score;
  $('lv').textContent = `${S.lv}단계`;
  $('combo').textContent = `🔥${S.combo}`;
  $('combo').classList.toggle('hot', S.combo >= 3);
  $('flowBar').style.width = (S.fever > 0 ? S.fever / FEVER_SEC * 100 : S.combo ? S.comboT / COMBO_SEC * 100 : 0).toFixed(1) + '%';
  $('app').classList.toggle('fever', S.fever > 0);
  if (S.bulk) { const el = $('bulkLeft'); if (el) el.textContent = `${Math.ceil(S.bulk.t)}초`; }
  S.tickets.forEach((tk, i) => {
    const f = Math.max(0, tk.t / tk.max);
    const el = document.querySelector(`[data-pat="${i}"] i`);
    if (el) { el.style.transform = `scaleX(${f})`; el.className = f < 0.25 ? 'crit' : f < 0.5 ? 'warn' : ''; }
    const face = document.querySelector(`[data-mood="${i}"]`);
    if (face) face.textContent = f < 0.25 ? '😡' : f < 0.5 ? '😠' : MOODS[tk.order.mood].face;
  });
}
function centerOf(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function floatText(el, text, big) {
  if (!el) return;
  const [x, y] = centerOf(el);
  const f = document.createElement('div');
  f.className = 'float' + (big ? ' big' : ''); f.textContent = text;
  f.style.left = x + 'px'; f.style.top = (y - 30) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 950);
}
function fly(fromEl, toEl, icon) {
  if (!fromEl || !toEl) return;
  const [x0, y0] = centerOf(fromEl), [x1, y1] = centerOf(toEl);
  const f = document.createElement('div');
  f.className = 'flyer'; f.textContent = icon;
  f.style.left = x0 + 'px'; f.style.top = y0 + 'px';
  document.body.appendChild(f);
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.left = x1 + 'px'; f.style.top = y1 + 'px'; f.style.transform = 'translate(-50%, -50%) scale(.6)'; }));
  setTimeout(() => f.remove(), 260);
}
function banner(text, delay) {
  setTimeout(() => {
    const b = document.createElement('div');
    b.className = 'banner'; b.textContent = text;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1250);
  }, delay || 0);
}

// ───────── 조립: 부품 카드를 조립대 위에 쌓기 ─────────
// 이 스택에 이 부품을 얹으면 아직 누군가 원하는 로봇이 될 수 있나
const fitsWanted = (stack, p) => !stack.includes(p) && wantedRobots().some(r => [...stack, p].every(x => ROBOTS[r].parts.includes(x)));
function addPart(p, at) {
  let i = at;
  if (i === undefined) {
    // 가장 많이 쌓인(완성에 가까운) 맞는 스택 → 빈 조립대
    let bestLen = -1;
    S.table.forEach((st, k) => { if (st.length && fitsWanted(st, p) && st.length > bestLen) { bestLen = st.length; i = k; } });
    if (i === undefined) i = S.table.findIndex(st => !st.length);
    if (i < 0) { SFX.nope(); nudge($('table')); return; }
  } else if (S.table[i].includes(p)) { SFX.nope(); nudge(document.querySelector(`[data-spot="${i}"]`)); return; }
  fly(document.querySelector(`[data-pile="${p}"]`), document.querySelector(`[data-spot="${i}"]`), PARTS[p].icon);
  S.table[i] = [...S.table[i], p];
  const r = robotOf(S.table[i]);
  if (r) SFX.built(); else SFX.card(S.table[i].length);
  renderTable(i);
  if (r) tryShip(i);
  else if (!wantedRobots().some(w => S.table[i].every(x => ROBOTS[w].parts.includes(x)))) document.querySelector(`[data-spot="${i}"]`)?.classList.add('idle');
}
// 완성된 로봇은 찾는 주문표로 저절로 날아감
function tryShip(i) {
  const r = robotOf(S.table[i]);
  if (!r) return false;
  if (S.bulk) {
    if (S.bulk.robot !== r) return false;
    fly(document.querySelector(`[data-spot="${i}"]`), document.querySelector('[data-ticket="bulk"]'), ROBOTS[r].icon);
    S.table[i] = [];
    S.bulk.got++;
    S.score += Math.round(60 * (S.fever > 0 ? 2 : 1));
    SFX.done(Math.min(4, S.bulk.got));
    renderTable(); renderRail();
    floatText(document.querySelector('[data-ticket="bulk"]'), `${S.bulk.got}/${S.bulk.n}`, true);
    if (S.bulk.got >= S.bulk.n) endBulk();
    renderHud();
    return true;
  }
  const ti = S.tickets.findIndex(t => t.left.includes(r));
  if (ti < 0) return false;
  fly(document.querySelector(`[data-spot="${i}"]`), document.querySelector(`[data-ticket="${ti}"]`), ROBOTS[r].icon);
  deliver(i, ti);
  return true;
}
// 조립대 누르기: 완성품이면 납품, 아니면 부품을 덱으로 되돌리기
function tapSpot(i) {
  if (!S.table[i].length) return;
  if (tryShip(i)) return;
  const el = document.querySelector(`[data-spot="${i}"]`);
  fly(el, document.querySelector(`[data-pile="${S.table[i][0]}"]`), S.table[i].map(p => PARTS[p].icon).join(''));
  S.table[i] = []; SFX.back(); renderTable();
}
function deliver(spot, ti) {
  const t = S.tickets[ti];
  const r = robotOf(S.table[spot]);
  const el = document.querySelector(`[data-ticket="${ti}"]`);
  if (!t || !r) return;
  const k = t.left.indexOf(r);
  if (k < 0) { SFX.nope(); nudge(el); S.combo = 0; S.comboT = 0; return; }
  t.left.splice(k, 1);
  S.table[spot] = [];
  if (t.left.length) { SFX.half(); floatText(el, '✓'); renderRail(); renderTable(); document.querySelector(`[data-ticket="${ti}"]`)?.classList.add('bump'); return; }
  S.combo = S.comboT > 0 ? S.combo + 1 : 1;
  S.comboT = COMBO_SEC;
  S.best = Math.max(S.best, S.combo);
  if (S.combo === FEVER_AT && S.fever <= 0) { S.fever = FEVER_SEC; banner('🔥 FEVER ×2'); }
  const tip = Math.round(80 * t.t / t.max);
  const size = t.order.wants.reduce((s, w) => s + ROBOTS[w].parts.length, 0);
  const gain = Math.round((50 * size * Math.min(3, 1 + 0.2 * (S.combo - 1)) + tip) * (S.fever > 0 ? 2 : 1));
  S.score += gain;
  floatText(el, `+${gain}`, S.combo >= 3);
  SFX.done(S.combo);
  if (S.combo >= 3 && S.combo % 4 === 0 && S.combo !== FEVER_AT) banner(`🔥 ${S.combo} 콤보!`);
  S.done++;
  S.runServed.push(t.order.id);
  const lit = [...S.dex].some(id => secKey(O[id]) === secKey(t.order));
  S.dex.add(t.order.id);
  if (!lit) banner(`${secKey(t.order)}${t.order.icon} 점등!`, 150);
  S.bestScore = Math.max(S.bestScore, S.score);
  save();
  S.tickets.splice(ti, 1);
  if (!S.tickets.length) S.spawnT = 0;
  renderRail(); renderTable(); renderHud();
  if (S.done >= levelTarget(S.lv)) levelClear();
}

// ───────── 입력: 누르기 + 끌기(덱 카드를 원하는 조립대로, 완성품을 주문표로) ─────────
let drag = null;
document.addEventListener('pointerdown', e => {
  if (!S.running || S.paused) return;
  const spot = e.target.closest('[data-spot]'), pile = e.target.closest('[data-pile]');
  if (!spot && !pile) return;
  drag = { src: spot ? { spot: +spot.dataset.spot } : { pile: pile.dataset.pile }, x: e.clientX, y: e.clientY, started: false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 10) return;
    const st = drag.src.spot !== undefined ? S.table[drag.src.spot] : null;
    if (st && !st.length) { drag = null; return; }
    const r = st && robotOf(st);
    drag.started = true;
    drag.ghost = Object.assign(document.createElement('div'), { className: 'ghost', textContent: drag.src.pile ? PARTS[drag.src.pile].icon : r ? ROBOTS[r].icon : st.map(p => PARTS[p].icon).join('') });
    document.body.appendChild(drag.ghost);
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-spot],[data-ticket],#deck');
  if (drag.over && drag.over !== over) drag.over.classList.remove('drop', 'over');
  if (over) over.classList.add(over.dataset.ticket !== undefined ? 'over' : 'drop');
  drag.over = over;
}, { passive: false });
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!S.running) { d.ghost?.remove(); return; }
  if (!d.started) { if (d.src.pile) addPart(d.src.pile); else tapSpot(d.src.spot); return; }
  d.ghost.remove();
  d.over?.classList.remove('drop', 'over');
  const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-spot],[data-ticket],#deck');
  if (!t) return;
  if (d.src.pile) { if (t.dataset.spot !== undefined) addPart(d.src.pile, +t.dataset.spot); return; }
  if (t.id === 'deck') { S.table[d.src.spot] = []; SFX.back(); renderTable(); return; }
  if (t.dataset.ticket !== undefined) {
    if (t.dataset.ticket === 'bulk') tryShip(d.src.spot); else deliver(d.src.spot, +t.dataset.ticket);
    renderTable(); return;
  }
  const to = +t.dataset.spot;
  if (to !== d.src.spot && !S.table[to].length) { S.table[to] = S.table[d.src.spot]; S.table[d.src.spot] = []; renderTable(to); }
});
document.addEventListener('pointercancel', () => { if (!drag) return; drag.ghost?.remove(); drag = null; });

// ───────── 진행: 단계를 깨면 멈추지 않고 바로 다음 단계 ─────────
function patienceTick(dt) {
  if (S.bulk) return;
  for (let i = S.tickets.length - 1; i >= 0; i--) {
    const tk = S.tickets[i];
    if ((tk.t -= dt) > 0) continue;
    floatText(document.querySelector(`[data-ticket="${i}"]`), '💢 떠남');
    SFX.nope();
    S.tickets.splice(i, 1);
    S.missed++; S.done++;
    S.combo = 0; S.comboT = 0;
    if (!S.tickets.length) S.spawnT = 0;
    renderRail();
    if (S.done >= levelTarget(S.lv)) { levelClear(); return; }
  }
}
function loop(t) {
  const dt = Math.min(0.1, (t - (S.last || t)) / 1000);
  S.last = t;
  if (S.running && !S.paused) {
    S.elapsed += dt;
    if (S.comboT > 0 && !S.bulk && (S.comboT -= dt) <= 0) { S.comboT = 0; S.combo = 0; }
    if (S.fever > 0) S.fever -= dt;
    bulkTick(dt);
    if (S.running) patienceTick(dt);
    if (S.running) spawnTick(dt);
    renderHud();
  }
  requestAnimationFrame(loop);
}
function startLevel() {
  Object.assign(S, { running: true, paused: false, elapsed: 0, spawned: 0, done: 0, tickets: [], missed: 0, spawnT: 0,
    bulk: null, bulkCD: 12 + Math.random() * 10, intro: S.lv === 1 ? ['transys', 'kai', 'stl'] : [] });
  $('overlay').hidden = true;
  renderRail(); renderTable(); renderDeck(); renderHud();
  addTicket(); addTicket(); S.spawnT = levelGap(S.lv); renderRail();
}
function levelClear() {
  S.running = false;
  const n = levelTarget(S.lv), served = n - S.missed;
  const stars = S.missed === 0 ? 3 : served >= n * 0.7 ? 2 : 1;
  const bonus = stars * 200;
  S.score += bonus; S.bestScore = Math.max(S.bestScore, S.score); save();
  SFX.clear();
  banner(`CLEAR ${'⭐'.repeat(stars)} +${bonus}`);
  const next = UNLOCKS[S.lv];
  if (next) banner(`NEW ${next.map(w => ROBOTS[w].icon).join(' ')} ${next.map(w => ROBOTS[w].name).join(', ')}`, 1300);
  S.lv++;
  setTimeout(() => { if (!S.paused) startLevel(); else S.pendingStart = true; }, next ? 2700 : 1500);
  renderHud();
}

// ───────── 오버레이 ─────────
const litSectors = () => new Set([...S.dex].map(id => secKey(O[id])));
const logItem = o => `<div class="log-item"><span class="i">${o.icon}</span><span class="h">${o.who} ${o.wants.map(w => ROBOTS[w].icon).join('')}<small>${o.sec}</small></span><span>${o.fact}</span></div>`;
const mapHtml = () => {
  const lit = litSectors();
  return `<div class="map">${SECTORS.map(s => `<div class="sector${lit.has(s.key) ? ' lit' : ''}"><small>${s.key}</small>${s.icon}</div>`).join('')}</div>`;
};
function openSheet(html, pause) {
  $('sheet').innerHTML = html;
  $('overlay').hidden = false;
  $('sheet').scrollTop = 0;
  if (pause) S.paused = true;
  $('sheet').querySelector('button')?.focus();
}
function resume() {
  $('overlay').hidden = true; S.paused = false;
  if (S.pendingStart) { S.pendingStart = false; startLevel(); }
}
const HELP = `
  <h2>로봇 SI 납품소</h2>
  <div class="steps">
    <div class="step">🛞 🧭 <span>부품 카드를 톡톡 누르면</span></div>
    <div class="step">🛞🧭🦾🤏 = 🚜 <span>조립대 위에 차곡차곡 쌓이고</span></div>
    <div class="step">🚜 ➜ 🧾 <span>완성되면 주문표로 날아가요</span></div>
  </div>
  <p>손님마다 성격이 달라요. 😤 급한 손님은 금방 떠나고 😌 느긋한 손님은 기다려줘요. 타임 바가 다 떨어지면 💢 돈을 못 받아요. 다 쳐내면 바로 다음 단계! 연달아 쳐내면 🔥, 5콤보면 FEVER ×2. 가끔 🚨 대량 수주가 터지면 미친 듯이 눌러요. 조립대를 누르면 부품이 덱으로 돌아가요.</p>
  <button class="primary" type="button" data-act="begin">시작 ▶</button>`;
function summaryHtml() {
  const seen = [...new Set(S.runServed)].map(id => logItem(O[id])).join('');
  return `
    <h2>⏸ ${S.lv}단계</h2>
    <div class="big-stats"><span>💰<b class="num">${S.score}</b></span><span>🏆<b class="num">${S.bestScore}</b></span><span>🔥<b class="num">${S.best}</b></span></div>
    <button class="primary" type="button" data-act="close">계속 ▶</button>
    <span class="lbl">산업 지도 ${litSectors().size}/${SECTORS.length}</span>
    ${mapHtml()}
    ${seen ? `<span class="lbl">이번 판에 다녀온 현장</span><div class="log">${seen}</div>` : ''}`;
}
$('sheet').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') resume();
  else if (act === 'begin') { $('overlay').hidden = true; startLevel(); }
});
$('btnDex').addEventListener('click', () => {
  openSheet(`
    <h2>현장 도감 ${S.dex.size}/${ORDERS.length}</h2>
    ${mapHtml()}
    <div class="log">${ORDERS.map(o => S.dex.has(o.id) ? logItem(o)
      : `<div class="log-item locked"><span class="i">❔</span><span class="h">???<small>${o.sec}</small></span><span>아직 납품 전</span></div>`).join('')}</div>
    <p>출처: 로봇 스터디 2차 발제 자료 (2026.09.21)</p>
    <button class="primary" type="button" data-act="close">계속 ▶</button>`, true);
});
$('btnPause').addEventListener('click', () => { if (!$('overlay').hidden) return; openSheet(summaryHtml(), true); });
const syncSound = () => { $('btnSound').textContent = S.sound ? '🔊' : '🔇'; };
$('btnSound').addEventListener('click', () => {
  S.sound = !S.sound; syncSound();
  try { localStorage.setItem('robotsi.sound', S.sound ? '1' : '0'); } catch (e) {}
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) $('btnPause').click(); });

syncSound(); renderRail(); renderTable(); renderDeck(); renderHud();
openSheet(HELP);
requestAnimationFrame(loop);
</script>
